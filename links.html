<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Links por familia · La Liga de Salvador</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
:root{--navy:#101c38;--gold:#f5b82e;--red:#b3191c;--cream:#f6eedf;--ink:#0c1530}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Rubik',sans-serif;background:var(--navy);color:var(--cream);padding:24px 16px 60px}
main{max-width:640px;margin:0 auto}
h1{font-family:'Bangers';font-weight:400;font-size:40px;letter-spacing:1px;color:var(--gold);text-shadow:3px 3px 0 #000}
p{line-height:1.5;margin-top:8px;color:#dbe4f7}
.box{background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:18px;margin-top:20px;box-shadow:6px 6px 0 #000}
label{display:block;font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
textarea{width:100%;min-height:170px;font:600 16px 'Rubik';padding:12px;border:3px solid var(--ink);border-radius:12px;resize:vertical}
.btn{font-family:'Bangers';letter-spacing:1px;font-size:19px;border:3px solid var(--ink);border-radius:12px;padding:8px 14px;background:var(--gold);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink);text-decoration:none;display:inline-block;white-space:nowrap}
.btn.wa{background:#25d366}
.item{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:2px dashed #c9bfae}
.item:last-child{border-bottom:0}
.item b{flex:1 1 180px;font-size:17px}
.item code{flex:1 1 100%;font-size:12px;word-break:break-all;color:#4a5578}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--gold);color:var(--ink);font-weight:800;border:3px solid var(--ink);border-radius:12px;padding:10px 16px;display:none}
</style>
</head>
<body>
<main>
  <h1>Links personalizados</h1>
  <p>Escribe un nombre por línea. Cada link abre el cómic con la banda <i>“Ejemplar de Familia Pérez”</i> en la portada y deja su nombre ya escrito en el cupón.</p>

  <div class="box">
    <label for="names">Invitados (uno por línea)</label>
    <textarea id="names" placeholder="Familia Pérez&#10;Tía Carmen&#10;Mateo y familia"></textarea>
  </div>

  <div class="box" id="out" hidden></div>
</main>
<div class="toast" id="toast">¡Copiado!</div>
<script>
const base = new URL('./', location.href).href;
const ta = document.getElementById('names'), out = document.getElementById('out');
try { ta.value = localStorage.getItem('liga-names') || ''; } catch {}
const esc = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function linkFor(n){ return `${base}?para=${encodeURIComponent(n)}`; }
function message(n){
  return `🚨 ¡Alerta de la Liga! 🦸\n\n${n}, ¡llegó su ejemplar de La Liga de Salvador Núm. 1! 🦸 Salvador cumple 1 año 🎉\n\n📅 Domingo 11 de octubre · 3:00 pm\n📍 Av. El Sol Este 176, Barranco (terraza)\n\nAbran el cómic y confírmenos su asistencia aquí 👇\n${linkFor(n)}`;
}
function render(){
  try { localStorage.setItem('liga-names', ta.value); } catch {}
  const names = [...new Set(ta.value.split('\n').map(s => s.trim()).filter(Boolean))];
  out.hidden = !names.length;
  out.innerHTML = names.map((n, i) => `
    <div class="item">
      <b>${esc(n)}</b>
      <button class="btn" data-copy="${i}">Copiar link</button>
      <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(message(n))}">Enviar por WhatsApp</a>
      <code>${esc(linkFor(n))}</code>
    </div>`).join('');
  out.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    await navigator.clipboard.writeText(message(names[+b.dataset.copy]));
    const t = document.getElementById('toast'); t.textContent = '¡Mensaje con link copiado!'; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 1800);
  });
}
ta.addEventListener('input', render); render();
</script>
</body>
</html>
