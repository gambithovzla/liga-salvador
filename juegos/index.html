    if (m.fase === "juego" && S.mjListo === m.id) {
      const tipo = TIPOS[m.tipo];
      if (tipo && tipo.host.actualizar) { try { tipo.host.actualizar(ctx, zContenido); } catch (e) { console.error(e); } }
    }
  }

  /* ---------- pestaña Lanzar ---------- */
  function vecesJugada(id) { return Object.values(S.historial || {}).filter((h) => h && h.tipo === id).length; }
  function htmlLanzar() {
    if (L.elegido && TIPOS[L.elegido]) return htmlConfig(TIPOS[L.elegido]);
    return `<section class="pagina"><span class="cap">Lanzar misión</span><p>Elige un juego. Al lanzarlo, suena en todos los celulares que tienen la página abierta.</p></section>` +
      CATEGORIAS.map((cat) => `<section class="pagina"><span class="cap">${esc(cat.titulo)}</span><div class="catalogo">${cat.tipos.map((id) => {
        const t = TIPOS[id], veces = vecesJugada(id);
        return `<button class="ficha${veces ? " jugada" : ""}" data-accion="elegir" data-tipo="${id}"><span class="icono">${icono(t.icono)}</span>` +
          `<span class="ficha-texto"><span class="ficha-t">${esc(t.nombre)}</span><span class="ficha-r">${esc(t.resumen)}</span></span>` +
          (veces ? `<span class="hecha">jugada${veces > 1 ? ` ×${veces}` : ""}</span>` : "") + `</button>`;
      }).join("")}</div></section>`).join("");
  }
  function htmlConfig(t) {
    const cfg = cfgDe(t.id);
    const cat = CATEGORIAS.find((c) => c.tipos.includes(t.id));
    const campos = (t.campos || []).map((c) => {
      if (c.tipo === "opciones") {
        return `<div class="campo-grupo"><span class="etiqueta">${esc(c.etiqueta)}</span><div class="segmentado">${c.opciones.map(([v, e]) => `<button data-accion="opcion" data-campo="${c.id}" data-v="${esc(v)}" aria-pressed="${String(cfg[c.id]) === String(v)}">${esc(e)}</button>`).join("")}</div></div>`;
      }
      return `<div class="campo-grupo"><label class="etiqueta" for="campo-${c.id}">${esc(c.etiqueta)}</label><input class="campo" id="campo-${c.id}" value="${esc(cfg[c.id] || "")}" autocomplete="off">` +
        (c.sugerencias ? `<div class="sugerencias">${c.sugerencias.map((s) => `<button type="button" data-accion="sug-campo" data-campo="${c.id}" data-v="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : "") + `</div>`;
    }).join("");
    return `<section class="pagina"><span class="cap">${esc(cat ? cat.titulo : "Misión")}</span><div class="mision-cabeza"><span class="icono-mision">${icono(t.icono)}</span><h2 class="titulo chico">${esc(t.nombre)}</h2></div>` +
      `${t.pasos ? pasosHTML(t.pasos) : `<p>${esc(t.ayuda)}</p>`}${campos}` +
      (t.notaLanzar ? `<div class="campo-grupo" data-vivo="nota-lanzar"></div>` : "") +
      `<div class="campo-grupo"><span class="etiqueta">Puntos</span><div class="segmentado"><button data-accion="doble" data-v="0" aria-pressed="${!L.doble}">Normales</button><button data-accion="doble" data-v="1" aria-pressed="${L.doble}">¡Vale doble!</button></div></div>` +
      (t.usaSala ? `<p class="suave">Primero se abre una sala: los agentes tocan «Estoy listo» y tú das la largada.</p>` : "") +
      `<p class="error" data-vivo="error" role="alert"></p><div class="fila"><button class="boton blanco" data-accion="volver-catalogo">Volver</button><button class="boton rojo grande" data-accion="lanzar">${icono("lanzar")} Lanzar</button></div></section>`;
  }

  /* ---------- pestaña Agentes ---------- */
  function htmlAgentes() {
    const enlace = enlaceJuego();
    return `<section class="pagina"><span class="cap">Invita a los agentes</span><div class="qr">${qrSVG(enlace)}</div>` +
      `<p class="centro enlace-juego">${esc(enlace)}</p>${MODO === "demo" ? `<p class="suave centro">En la fiesta, este código abre los juegos.</p>` : ""}` +
      `<div class="fila"><button class="boton blanco" data-accion="copiar-enlace">Copiar enlace</button><a class="boton blanco" href="${esc(enlaceWhatsApp(`¡Juegos de La Liga de Salvador! Entra aquí, crea tu tarjeta de héroe y juega desde tu celular: ${enlace}`))}" target="_blank" rel="noopener">${icono("whatsapp")} WhatsApp</a></div></section>` +
      `<section class="pagina"><span class="cap" data-vivo="n-agentes">Agentes</span><div class="columna lista-agentes" data-vivo="lista-agentes"></div></section>` +
      `<section class="pagina"><span class="cap">Ensayo</span><p>Agrega agentes de prueba: juegan solos todas las misiones, para que ensayes antes de la fiesta.</p>` +
      `<div class="fila"><button class="boton blanco" data-accion="bots-agregar">Agregar 6 de prueba</button><button class="boton blanco" data-accion="bots-quitar">Quitar los de prueba</button></div></section>` +
      `<section class="pagina"><span class="cap roja">Empezar de cero</span><p>Borra agentes, puntos, misiones y fotos. Úsalo después del ensayo, antes de que lleguen los invitados.</p>` +
      `<button class="boton rojo" data-accion="reiniciar-todo">Borrar todo</button></section>`;
  }
  function actualizarAgentes() {
    const lista = clasificacion(S);
    const n = $('[data-vivo="n-agentes"]', zContenido);
    const t = `${plural(lista.length, "agente", "agentes")} · ${conectados()} en línea`;
    if (n && n.textContent !== t) n.textContent = t;
    pintarVivo("lista-agentes", lista.length ? lista.map((a) => {
      const notas = [`Agente ${a.codigo || "–"}`, a.conectado === false ? "sin conexión" : "en línea"];
      if (a.ocupado) notas.push("en misión");
      if (a.bot) notas.push("de prueba");
      return `<button class="agente-fila${a.conectado === false ? " desconectado" : ""}" data-accion="agente" data-id="${a.id}">${poderHTML(a.poder)}` +
        `<span class="nom">${esc(a.nombre)}<small>${esc(notas.join(" · "))}</small></span><span class="val">${fmt(a.total)}</span></button>`;
    }).join("") : `<p class="suave">Todavía no hay agentes. Comparte el código QR o el enlace.</p>`);
  }

  /* ---------- pestaña Marcador ---------- */
  function htmlMarcador() {
    const oculto = !!(S.ajustes && S.ajustes.ocultarRanking);
    let album;
    if (L.cargandoAlbum) album = `<p class="latido">Cargando fotos…</p>`;
    else if (L.album) {
      album = L.album.length ? L.album.map((g) => `<h3 class="subtitulo">${esc(g.reto)}</h3><div class="galeria">${Object.entries(g.fotos).map(([aid, src]) =>
        `<figure><img src="${esc(src)}" alt="Foto de ${esc(nombreDe(S, aid))}" data-accion="album-foto" data-m="${g.id}" data-id="${aid}"><figcaption>${esc(nombreDe(S, aid))}</figcaption></figure>`).join("")}</div>`).join("") +
        `<button class="boton blanco" data-accion="ver-album">Actualizar</button>` : `<p class="suave">Todavía no hay fotos.</p><button class="boton blanco" data-accion="ver-album">Buscar de nuevo</button>`;
    } else album = `<p>Las fotos de las misiones «Foto en el lugar».</p><button class="boton blanco" data-accion="ver-album">${icono("camara")} Ver las fotos</button>`;
    return `<section class="pagina"><span class="cap">Clasificación</span><div data-vivo="ranking"></div></section>` +
      `<section class="pagina"><span class="cap">En los celulares</span><p>¿Los invitados ven la clasificación? Ocúltala antes del final para dar suspenso.</p>` +
      `<div class="segmentado"><button data-accion="ranking" data-v="visible" aria-pressed="${!oculto}">Visible</button><button data-accion="ranking" data-v="oculto" aria-pressed="${oculto}">Oculta</button></div></section>` +
      `<section class="pagina"><span class="cap">Misiones jugadas</span><div data-vivo="historial"></div></section>` +
      `<section class="pagina"><span class="cap">Álbum de fotos</span>${album}</section>` +
      `<section class="pagina"><span class="cap roja">Gran final</span><p>Cuando termine la última misión, revela el podio: aparece en todos los celulares, del 3.er al 1.er lugar.</p>` +
      `<div data-vivo="empate"></div><button class="boton rojo grande" data-accion="final-empezar">${icono("trofeo")} Revelar el podio</button></section>`;
  }
  function actualizarMarcador() {
    const lista = clasificacion(S);
    pintarVivo("ranking", tablaClasificacion(lista));
    const hist = Object.entries(S.historial || {}).map(([id, h]) => Object.assign({ id }, h)).sort((a, b) => b.t - a.t);
    const duelos = duelosRecientes(S, 5);
    pintarVivo("historial", (hist.length ? `<ol class="tabla historial">${hist.map((h, i) => {
      const g = (h.top || [])[0];
      const hora = new Date(h.t).toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" });
      const gano = g && Number(g.pts) > 0;
      return `<li><span class="pos">${hist.length - i}</span>${gano ? poderHTML(poderDeAgente(S, g.id)) : "<span></span>"}<span class="nom">${esc(h.nombre)}${h.doble ? " ×2" : ""}<small>${gano ? `ganó ${esc(nombreDe(S, g.id))}` : esc(h.detalle || "sin puntos")}</small></span><span class="val">${hora}</span></li>`;
    }).join("")}</ol>` : `<p class="suave">Todavía no termina ninguna misión.</p>`) +
      (duelos.length ? `<ul class="feed">${duelos.map((d) => `<li>${icono("duelo")}<span>${textoDuelo(S, d)}</span></li>`).join("")}</ul>` : ""));
    const empatados = lista.filter((a) => a.pos === 1);
    pintarVivo("empate", empatados.length > 1 && lista[0].total > 0
      ? `<div class="globo"><strong>¡Empate en el 1.er lugar!</strong> ${empatados.map((a) => esc(a.nombre)).join(" y ")} tienen ${fmt(lista[0].total)} puntos. Puedes lanzar una misión rápida de desempate, como Reflejos de héroe, antes de revelar el podio.</div>` : "");
  }

  /* ---------- gran final en el centro de mando ---------- */
  function htmlFinal() {
    const f = S.final, podio = f.podio || [], paso = Number(f.paso) || 0;
    const siguiente = siguientePodio(podio, paso);
    return `<section class="pagina"><span class="cap roja">Gran final</span><h2 class="titulo chico">El podio de la Liga</h2>${podioHTML(podio, paso)}` +
      (siguiente
        ? `<button class="boton rojo grande" data-accion="final-revelar"${L.revelando ? " disabled" : ""}>${L.revelando ? "Redoble de tambores…" : esc(siguiente)}</button>`
        : `<div class="globo"><strong>¡Campeón: ${esc(podio[0] ? podio[0].nombre : "")}!</strong> Entrégale el premio: es para él o ella, o para el pequeño héroe que elija.</div>`) +
      `</section><section class="pagina"><span class="cap">Tabla final</span>${tablaClasificacion((f.tabla || []).map((x) => Object.assign({ nombre: nombreDe(S, x.id), poder: poderDeAgente(S, x.id) }, x)))}</section>` +
      `<button class="enlace centro" data-accion="final-cancelar">Volver a la fiesta (quitar el podio de los celulares)</button>`;
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", (e) => {
    const b = e.target.closest("[data-accion]");
    if (!b || !raiz.contains(b) || b.disabled) return;
    accion(b.dataset.accion, b);
  });
  raiz.addEventListener("submit", (e) => {
    const f = e.target.closest("form[data-form]");
    if (!f) return;
    e.preventDefault();
    if (f.dataset.form === "pin") entrarPin(f);
  });
  raiz.addEventListener("input", (e) => {
    const m = /^campo-(.+)$/.exec(e.target.id || "");
    if (m && L.elegido) cfgDe(L.elegido)[m[1]] = e.target.value;
  });

  function marcarPresionado(el) {
    $$("button", el.parentElement).forEach((b) => b.setAttribute("aria-pressed", String(b === el)));
  }
  async function accion(a, el) {
    switch (a) {
      case "pestana": L.pestana = el.dataset.p; if (L.pestana !== "lanzar") L.elegido = null; L.forzar = true; refrescar(); desplazarArriba(); return;
      case "tomar-control": tomarControl(); return;
      case "ir-lanzar": L.pestana = "lanzar"; L.elegido = null; refrescar(); desplazarArriba(); return;
      case "elegir": L.elegido = el.dataset.tipo; L.doble = false; refrescar(); desplazarArriba(); return;
      case "relampago-ya": L.elegido = "relampago"; L.doble = false; cfgDe("relampago"); lanzar(); return;
      case "volver-catalogo": L.elegido = null; refrescar(); return;
      case "opcion": {
        const v = el.dataset.v;
        cfgDe(L.elegido)[el.dataset.campo] = v !== "" && !isNaN(Number(v)) ? Number(v) : v;
        marcarPresionado(el);
        return;
      }
      case "sug-campo": {
        const i = $(`#campo-${el.dataset.campo}`, zContenido);
        if (i) { i.value = el.dataset.v; cfgDe(L.elegido)[el.dataset.campo] = el.dataset.v; }
        return;
      }
      case "doble": L.doble = el.dataset.v === "1"; marcarPresionado(el); return;
      case "lanzar": lanzar(); return;
      case "empezar": empezar(); return;
      case "cancelar-mision": cancelarMision(); return;
      case "archivar": T.borrar("mision"); return;
      case "sirena": sirena(); return;
      case "copiar-enlace": { const ok = await copiar(enlaceJuego()); aviso(ok ? "Enlace copiado." : "No se pudo copiar: mantén presionado el enlace."); return; }
      case "agente": abrirAgente(el.dataset.id); return;
      case "bots-agregar":
        if (L.trabajando) return;
        L.trabajando = true;
        try { await bots.agregar(6); aviso("Llegaron 6 agentes de prueba."); } finally { L.trabajando = false; }
        return;
      case "bots-quitar":
        if (L.trabajando) return;
        L.trabajando = true;
        try { await bots.quitar(); aviso("Agentes de prueba fuera."); } finally { L.trabajando = false; }
        return;
      case "reiniciar-todo": reiniciarTodo(); return;
      case "ranking": T.actualizar("ajustes", { ocultarRanking: el.dataset.v === "oculto" }); return;
      case "ver-album": cargarAlbum(); return;
      case "album-foto": verFoto(el.dataset.m, el.dataset.id); return;
      case "final-empezar": empezarFinal(); return;
      case "final-revelar": revelarPaso(); return;
      case "final-cancelar": cancelarFinal(); return;
      case "sonido":
        Sonido.activo = !Sonido.activo;
        if (!opc.demo) almacen.set("liga2:sonido-comando", Sonido.activo ? "si" : "no");
        if (Sonido.activo) { Sonido.despertar(); Sonido.tocar("exito"); }
        refrescar();
        return;
      default: {
        const m = S.mision, tipo = m && TIPOS[m.tipo];
        if (L.pestana === "mision" && m && m.fase === "juego" && tipo && tipo.host.click) {
          try { tipo.host.click(a, el, ctxHost()); } catch (e) { console.error(e); }
          programar();
        }
      }
    }
  }

  /* ---------- el reloj de la fiesta: corre en el dispositivo que tiene el control ---------- */
  function mantenerDuelos() {
    const ahora = T.ahora();
    for (const [did, d] of Object.entries(S.duelos || {})) {
      if (!d || L.duelosHechos[did]) continue;
      if (d.estado === "pendiente" && ahora - d.creado > DUELO_ACEPTAR_MS + 8000) { L.duelosHechos[did] = true; rechazarDuelo(T, did, "expirado"); }
      if (d.estado === "aceptado" && !d.go && ahora > (Number(d.aceptadoT) || 0) + DUELO_PREPARAR_MS + 6000 && !L.duelosHechos["go" + did]) { L.duelosHechos["go" + did] = true; largarDuelo(T, did); }
      if (d.estado === "aceptado" && d.go && ahora > d.go + DUELO_TOQUE_MS + 6000) { L.duelosHechos[did] = true; resolverDuelo(T, S, did, "comando"); }
    }
  }
  const tic = setInterval(() => {
    if (!L.autorizado || !activo() || S.agentes === undefined) return;
    const m = S.mision;
    if (m && m.fase === "juego" && S.mjListo === m.id && !S.final) {
      const tipo = TIPOS[m.tipo];
      if (tipo && tipo.host.tic) { try { tipo.host.tic(ctxHost()); } catch (e) { console.error(e); } }
    }
    mantenerDuelos();
    bots.paso();
  }, 250);
  const pintor = setInterval(refrescar, 250);

  montar();
  refrescar();
  return {
    S, T, bots,
    lanzarTipo(id, cfg, doble) { L.elegido = id; L.cfg[id] = Object.assign(cfgDe(id), cfg || {}); L.doble = !!doble; L.pestana = "lanzar"; refrescar(); return lanzar(); },
    destruir() { clearInterval(tic); clearInterval(pintor); if (L.desFotos) L.desFotos(); },
  };
}

/* =====================================================================
   DEMO: el celular de un invitado y el centro de mando lado a lado,
   con agentes de prueba que juegan solos. Todo vive en la memoria.
   ===================================================================== */
async function sembrarDemo(T, bots) {
  const ids = await bots.agregar(7);
  const ahora = T.ahora();
  const pasadas = [
    { id: "mdemo1", tipo: "reflejos", nombre: TIPOS.reflejos.nombre, t: ahora - 25 * 60000 },
    { id: "mdemo2", tipo: "trivia", nombre: TIPOS.trivia.nombre, t: ahora - 11 * 60000 },
  ];
  const puntos = {};
  for (const p of pasadas) {
    const orden = barajar(ids).slice(0, 6);
    const filas = orden.map((id, i) => ({ id, pos: i + 1, pts: puntosPorPuesto(i + 1, orden.length) }));
    filas.forEach((f) => { puntos[`${f.id}/m_${p.id}`] = { p: f.pts, m: p.nombre, t: p.t }; });
    await T.escribir(`historial/${p.id}`, { tipo: p.tipo, nombre: p.nombre, t: p.t, doble: false, n: filas.length, detalle: "", top: filas.slice(0, 3).map((f) => ({ id: f.id, pts: f.pts })) });
  }
  await T.actualizar("puntos", puntos);
}

function arrancarDemo(app) {
  let T, jugador, comando;
  app.innerHTML = `<div class="demo"><div class="demo-barra">` +
    `<p><b>Demo de los juegos de la Liga.</b> <span class="solo-ancha">A la izquierda, el celular de un invitado; a la derecha, tu centro de mando. </span><span class="solo-angosta">Cambia entre el celular de un invitado y tu centro de mando. </span>Crea tu tarjeta, lanza una misión y juega contra 7 agentes de prueba.</p>` +
    `<div class="demo-controles"><div class="demo-pestanas" role="tablist" aria-label="Qué pantalla ver">` +
    `<button role="tab" aria-selected="true" data-ver="celular">Celular</button><button role="tab" aria-selected="false" data-ver="comando">Centro de mando</button></div>` +
    `<button class="boton chico blanco" id="demo-reiniciar">Reiniciar<span class="solo-ancha"> demo</span></button></div></div>` +
    `<div class="demo-escenario" data-ver="celular">` +
    `<section class="demo-celular" aria-label="Celular de un invitado"><div class="marco-celular" id="raiz-jugador"></div></section>` +
    `<section class="demo-comando" aria-label="Centro de mando"><div id="raiz-comando"></div></section></div></div>`;
  const escenario = $(".demo-escenario", app);
  const marco = $("#raiz-jugador", app);
  const angosta = () => window.matchMedia("(max-width: 1099px)").matches;
  function ver(cual) {
    escenario.dataset.ver = cual;
    $$(".demo-pestanas button", app).forEach((b) => b.setAttribute("aria-selected", String(b.dataset.ver === cual)));
    if (angosta()) window.scrollTo(0, 0);
  }
  async function iniciar() {
    if (jugador) jugador.destruir();
    if (comando) comando.destruir();
    marco.innerHTML = "";
    $("#raiz-comando", app).innerHTML = "";
    T = crearTransporteLocal("demo", { memoria: true });
    jugador = crearJugador(marco, T, {
      demo: true,
      desplazar: () => { if (angosta()) window.scrollTo(0, 0); else marco.scrollTop = 0; },
    });
    comando = crearComando($("#raiz-comando", app), T, {
      demo: true,
      retarA: () => jugador && jugador.yo,
      alLanzar: () => { if (angosta()) setTimeout(() => ver("celular"), 700); },
      desplazar: () => { if (angosta()) window.scrollTo(0, 0); },
    });
    await sembrarDemo(T, comando.bots);
  }
  app.addEventListener("click", (e) => {
    const t = e.target.closest("[data-ver]");
    if (t && t.closest(".demo-pestanas")) { ver(t.dataset.ver); return; }
    if (e.target.closest("#demo-reiniciar")) iniciar();
  });
  Sonido.activo = true;
  iniciar();
  window.__demo = { get T() { return T; }, get jugador() { return jugador; }, get comando() { return comando; }, ver };
}

/* =====================================================================
   ARRANQUE: demo, ensayo en pestañas (?local) o la fiesta con Firebase.
   Jugadores: la página tal cual. Anfitrión: la misma página + #comando
   ===================================================================== */
(function () {
  const app = $("#app");
  if (!app) return;
  pintarFondo();
  window.addEventListener("hashchange", () => location.reload());

  if (MODO === "demo") { arrancarDemo(app); return; }

  async function conectar() {
    app.innerHTML = `<div class="cargando">${logoHTML()}<p class="latido">Conectando con la Liga…</p></div>`;
    let T;
    try {
      T = MODO === "firebase" ? await crearTransporteFirebase(CONFIG.firebaseURL, SALA) : crearTransporteLocal(SALA);
    } catch (e) {
      console.error(e);
      app.innerHTML = `<div class="error-carga columna"><section class="pagina"><span class="cap roja">Sin conexión</span><h1 class="titulo chico">No pudimos conectar</h1>` +
        `<p>Revisa que tengas internet (wifi o datos) y vuelve a intentar.</p><button class="boton rojo grande bloque" id="reintentar">Reintentar</button></section></div>`;
      $("#reintentar", app).addEventListener("click", conectar);
      return;
    }
    if (ES_COMANDO) window.__comando = crearComando(app, T, {});
    else window.__jugador = crearJugador(app, T, {});
  }
  conectar();
})();
