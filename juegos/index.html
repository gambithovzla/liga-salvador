  color: var(--crema);
  -webkit-text-stroke: 3px var(--tinta);
  paint-order: stroke fill;
  text-shadow: 5px 5px 0 var(--tinta);
  pointer-events: none;
}
.arena-texto small { display: block; font-family: var(--f-etiqueta); font-size: 24px; letter-spacing: 1px; -webkit-text-stroke: 1px var(--tinta); text-shadow: 2px 2px 0 var(--tinta); margin-top: 8px; }
.arena-reloj {
  position: absolute;
  right: 10px;
  top: 8px;
  z-index: 3;
  font-family: var(--f-titulo);
  font-size: 34px;
  color: var(--blanco);
  -webkit-text-stroke: 2px var(--tinta);
  paint-order: stroke fill;
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.arena-marcador { position: absolute; left: 10px; top: 8px; z-index: 3; font-family: var(--f-titulo); font-size: 30px; color: var(--amarillo); -webkit-text-stroke: 2px var(--tinta); paint-order: stroke fill; pointer-events: none; }
.flota { position: absolute; z-index: 4; font-family: var(--f-titulo); font-size: 26px; color: var(--amarillo); -webkit-text-stroke: 2px var(--tinta); paint-order: stroke fill; pointer-events: none; animation: flotar 0.7s ease-out forwards; }
.flota.mala { color: var(--rojo-claro); }
@keyframes flotar { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-46px); opacity: 0; } }
.boton-gigante {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(62%, 240px);
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 5px solid var(--tinta);
  box-shadow: 6px 6px 0 var(--tinta);
  background: radial-gradient(circle at 40% 35%, #ffef9a, var(--amarillo) 55%, #e0a10f);
  font-family: var(--f-titulo);
  font-size: 34px;
  color: var(--tinta);
  cursor: pointer;
  touch-action: none;
}
.boton-gigante.golpe { transform: translate(-50%, -50%) scale(0.93); box-shadow: 2px 2px 0 var(--tinta); }
.boton-gigante.abajo { top: auto; bottom: 12px; z-index: 3; width: min(76%, 280px); height: 84px; aspect-ratio: auto; border-radius: 999px; transform: translateX(-50%); font-size: 38px; }
.boton-gigante.abajo.golpe { transform: translateX(-50%) scale(0.95); }

/* Haz volar a Salvador */
.arena.cielo {
  background:
    radial-gradient(2px 2px at 18% 4%, #fff 98%, transparent), radial-gradient(2px 2px at 72% 7%, #fff 98%, transparent),
    radial-gradient(1.5px 1.5px at 44% 12%, #fff 98%, transparent), radial-gradient(2px 2px at 86% 15%, #fff 98%, transparent),
    radial-gradient(1.5px 1.5px at 10% 19%, #fff 98%, transparent), radial-gradient(2px 2px at 58% 23%, #fff 98%, transparent),
    linear-gradient(180deg, #070d27 0%, #14235c 26%, #2d3a86 44%, #6b3f86 60%, #d9683f 80%, #f2b51c 100%);
  background-size: 100% 320%;
  background-position: 50% 100%;
  transition: background-position 0.25s ease-out;
}
.vuelo-ciudad { position: absolute; left: 0; right: 0; bottom: 0; height: 110px; transition: transform 0.25s ease-out; pointer-events: none; }
.vuelo-ciudad svg { display: block; width: 100%; height: 100%; }
.salva-vuelo { position: absolute; left: 50%; bottom: 108px; z-index: 2; width: min(27%, 112px); transform: translate(-50%, 0); transition: transform 0.2s ease-out; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.4)); animation: balanceo 1.1s ease-in-out infinite alternate; pointer-events: none; }
@keyframes balanceo { from { rotate: -5deg; } to { rotate: 5deg; } }

/* Reflejos: Salvador aparece en el amarillo */
.salva-ya { display: block; width: min(50%, 190px); height: auto; margin: 0 auto 4px; filter: drop-shadow(4px 4px 0 var(--tinta)); animation: estallar 0.22s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
.medidor { position: relative; height: 26px; background: var(--blanco); border: var(--borde); overflow: hidden; }
.medidor i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--amarillo), var(--rojo)); }
.medidor b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-etiqueta); font-weight: 400; font-size: 18px; letter-spacing: 1px; color: var(--tinta); }

/* Atrapa al villano: ventanas de edificio */
.ventanas { position: absolute; inset: 52px 12px 12px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; }
.ventana { position: relative; background: #0c1433; border: var(--borde); overflow: hidden; cursor: pointer; touch-action: none; padding: 0; }
.ventana::before { content: ""; position: absolute; inset: 6px; background: linear-gradient(180deg, #ffd766, #f2a91c); opacity: 0.18; }
.ventana .quien { position: absolute; inset: 8% 10%; display: grid; place-items: center; transform: translateY(105%); transition: transform 0.09s ease-out; }
.ventana.arriba .quien { transform: translateY(0); }
.ventana .quien svg, .ventana .quien img { width: 100%; height: 100%; object-fit: contain; }
.ventana.golpe { background: var(--amarillo); }
.ventana.error { background: var(--rojo); }

/* Memoria de héroe */
.pads { position: absolute; inset: 52px 14px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pad { border: 4px solid var(--tinta); box-shadow: 4px 4px 0 var(--tinta); display: grid; place-items: center; cursor: pointer; opacity: 0.55; touch-action: none; padding: 0; }
.pad svg { width: 46%; height: 46%; fill: var(--blanco); stroke: var(--tinta); stroke-width: 1.3; paint-order: stroke fill; }
.pad.encendido { opacity: 1; filter: brightness(1.25); transform: scale(0.97); }
.pad[data-i="0"] { background: var(--amarillo); }
.pad[data-i="1"] { background: var(--rojo); }
.pad[data-i="2"] { background: var(--azul); }
.pad[data-i="3"] { background: #27a35a; }
.pads.bloqueado .pad { pointer-events: none; }

/* Rescate en orden */
.numeros { position: absolute; inset: 52px 10px 10px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); gap: 8px; }
.num { background: var(--blanco); border: var(--borde); box-shadow: 2px 2px 0 var(--tinta); font-family: var(--f-titulo); font-size: clamp(22px, 7vw, 32px); color: var(--tinta); cursor: pointer; touch-action: none; padding: 0; }
.num.salvado { background: var(--amarillo); opacity: 0.35; box-shadow: none; }
.num.error { background: var(--rojo); color: var(--blanco); }

/* Encuentra al impostor */
.impostor { position: absolute; inset: 52px 10px 10px; display: grid; gap: 6px; }
.icono-celda { display: grid; place-items: center; background: transparent; border: 0; padding: 0; cursor: pointer; touch-action: none; }
.icono-celda svg { width: 82%; height: 82%; stroke: var(--tinta); stroke-width: 1.2; paint-order: stroke fill; }
.cara-celda { position: relative; min-width: 0; min-height: 0; }
.cara-celda img { position: absolute; inset: 4%; width: 92%; height: 92%; object-fit: contain; pointer-events: none; }

/* Detén el reloj */
.cronometro { position: absolute; left: 0; right: 0; top: 18%; text-align: center; font-family: var(--f-titulo); font-size: clamp(64px, 22vw, 110px); color: var(--blanco); -webkit-text-stroke: 3px var(--tinta); paint-order: stroke fill; text-shadow: 5px 5px 0 var(--tinta); font-variant-numeric: tabular-nums; line-height: 1; pointer-events: none; }

/* Ponle la capa a Salvador */
.salva { position: absolute; pointer-events: none; }
.marca-toque { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 4px solid var(--tinta); background: var(--rojo); pointer-events: none; }
.marca-real { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 4px solid var(--tinta); background: var(--amarillo); pointer-events: none; }
.linea-error { position: absolute; height: 4px; background: var(--tinta); transform-origin: 0 50%; pointer-events: none; }

/* Carrera */
.pista { display: flex; flex-direction: column; gap: 6px; background: #2b6e2f; border: var(--borde); padding: 8px; }
.carril { position: relative; height: 34px; background: #3d8a40; border: 2px dashed rgba(255, 255, 255, 0.4); }
.carril.yo { background: #5aa85c; }
.carril .meta { position: absolute; right: 0; top: 0; bottom: 0; width: 10px; background: repeating-linear-gradient(0deg, #fff 0 6px, var(--tinta) 6px 12px); }
.corredor { position: absolute; top: 50%; left: 0; transform: translate(0, -50%); display: flex; align-items: center; gap: 4px; transition: left 0.18s linear; white-space: nowrap; }
.corredor .poder { font-size: 13px; }
.corredor > span:not(.poder) { font-size: 15px; background: var(--blanco); color: var(--tinta); border: 2px solid var(--tinta); padding: 0 4px; }
.pies { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pie { min-height: 120px; font-family: var(--f-titulo); font-size: 28px; background: var(--amarillo); border: 4px solid var(--tinta); box-shadow: 5px 5px 0 var(--tinta); cursor: pointer; touch-action: none; color: var(--tinta); }
.pie.toca { background: var(--rojo); color: var(--blanco); }
.pie:disabled { opacity: 0.4; }

/* Trivia */
.opciones { display: grid; gap: 10px; }
.opcion {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 62px;
  padding: 10px 14px 8px;
  border: var(--borde);
  box-shadow: var(--sombra);
  text-align: left;
  font-family: var(--f-texto);
  font-size: 22px;
  line-height: 1.1;
  cursor: pointer;
  overflow: hidden;
}
.opcion[data-o="0"] { background: var(--amarillo); color: var(--tinta); }
.opcion[data-o="1"] { background: var(--rojo); color: var(--blanco); }
.opcion[data-o="2"] { background: var(--azul); color: var(--blanco); }
.opcion[data-o="3"] { background: var(--blanco); color: var(--tinta); }
.opcion:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--tinta); }
.opcion:disabled { opacity: 0.5; cursor: default; }
.opcion .forma { width: 24px; height: 24px; flex: none; fill: currentColor; stroke: var(--tinta); stroke-width: 1.5; }
.opcion span { min-width: 0; overflow-wrap: anywhere; }
.opcion.correcta { outline: 4px solid var(--amarillo); outline-offset: 3px; }
.opcion.apagada { opacity: 0.3; }
.opcion .conteo { margin-left: auto; font-family: var(--f-titulo); font-size: 22px; }
.pregunta-texto, .pagina .pregunta-texto { font-size: 26px; line-height: 1.15; }
.opciones.mirando { gap: 6px; }
.opciones.mirando .opcion { min-height: 46px; font-size: 18px; padding: 6px 10px 4px; box-shadow: none; cursor: default; }

/* Fotos */
.foto-propia { width: 100%; border: var(--borde); box-shadow: var(--sombra); display: block; }
.galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.galeria figure { margin: 0; background: var(--blanco); color: var(--tinta); border: var(--borde); box-shadow: var(--sombra); padding: 6px; display: flex; flex-direction: column; gap: 6px; }
.galeria img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; border: 2px solid var(--tinta); background: var(--papel); }
.galeria figcaption { font-size: 16px; line-height: 1.1; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.galeria figure.rechazada { opacity: 0.45; }
.galeria .pos { font-family: var(--f-titulo); color: var(--rojo); }

/* Bingo */
.carton { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.casilla { position: relative; min-height: 92px; padding: 6px 4px 4px; background: var(--blanco); border: var(--borde); color: var(--tinta); font-family: var(--f-etiqueta); font-size: 19px; letter-spacing: 0.5px; line-height: 1.05; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 4px; overflow-wrap: anywhere; }
.casilla.marcada { background: var(--amarillo); }
.casilla.marcada:not(.centro)::after { content: ""; position: absolute; inset: 9px 7px; border: 5px solid var(--rojo); border-radius: 50%; opacity: 0.8; transform: rotate(-9deg); pointer-events: none; z-index: 0; }
.casilla > span { position: relative; z-index: 1; }
.casilla.centro { cursor: default; background: var(--rojo); color: var(--blanco); font-size: 17px; }
.cara-salva { width: 58px; height: 58px; border-radius: 50%; border: 3px solid var(--tinta); object-fit: cover; display: block; background: var(--amarillo); }
.cara-salva.sin-foto { display: grid; place-items: center; font-family: var(--f-titulo); font-size: 30px; color: var(--rojo); }
.pagina .cantado { font-family: var(--f-titulo); font-size: clamp(30px, 10vw, 46px); line-height: 1; text-align: center; color: var(--amarillo); -webkit-text-stroke: 2px var(--tinta); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--tinta); margin: 2px 0; }
.chips.cantados { gap: 6px; }
.chips.cantados li { padding: 2px 10px; font-size: 16px; }
.chips.cantados li:first-child { background: var(--amarillo); font-weight: 700; }
.casilla b { font-family: var(--f-etiqueta); font-weight: 400; font-size: 15px; letter-spacing: 0.5px; color: var(--rojo-hondo); }

/* Dúo */
.medio-emblema { width: min(70%, 260px); margin-inline: auto; display: block; filter: drop-shadow(4px 4px 0 var(--tinta)); }

/* Bomba */
.bomba { width: min(60%, 220px); margin-inline: auto; display: block; }
.lista-objetivos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.lista-objetivos .boton { font-family: var(--f-texto); font-size: 19px; letter-spacing: 0; justify-content: flex-start; padding: 6px 8px; min-height: 50px; text-align: left; line-height: 1.05; }
.lista-objetivos .boton small { display: block; font-family: var(--f-etiqueta); font-size: 15px; letter-spacing: 1px; color: var(--azul-hondo); }

/* Revelar con el dedo (roles secretos) */
.secreto { position: relative; min-height: 150px; display: grid; place-items: center; text-align: center; padding: 16px; background: var(--tinta); color: var(--crema); border: var(--borde); cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none; }
.secreto .tapa { font-family: var(--f-etiqueta); font-size: 22px; letter-spacing: 1px; }
.secreto .contenido { display: none; }
.secreto.visible .tapa { display: none; }
.secreto.visible .contenido { display: block; }
.secreto .palabra { font-family: var(--f-titulo); font-size: clamp(34px, 11vw, 52px); color: var(--amarillo); line-height: 1; -webkit-text-stroke: 2px var(--tinta); paint-order: stroke fill; }

/* Ventanas emergentes y avisos */
.capa-modal { position: fixed; inset: 0; z-index: 50; background: var(--velo); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.capa-modal .pagina { width: min(100%, 460px); }
.aviso {
  position: fixed;
  left: 50%;
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) rotate(-1deg);
  z-index: 70;
  max-width: calc(100% - 32px);
  background: var(--amarillo);
  color: var(--tinta);
  border: var(--borde);
  box-shadow: var(--sombra);
  padding: 8px 14px 6px;
  font-family: var(--f-etiqueta);
  font-size: 20px;
  letter-spacing: 1px;
  text-align: center;
}
.alerta-total { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: var(--velo); padding: 16px; }
.confeti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }

/* ---------- Centro de mando ---------- */
.comando { max-width: 640px; margin-inline: auto; padding-inline: 16px; padding-block: 12px 110px; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
.c-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.c-cabecera .logo { width: 110px; margin: 0; }
.c-cabecera .cap { transform: rotate(1.5deg); }
.c-estado { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.punto-conexion { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; }
.punto-conexion::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #3fd06a; border: 2px solid var(--tinta); }
.punto-conexion.caida::before { background: var(--rojo); }
.barra-mision { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--rojo); color: var(--blanco); border: var(--borde); box-shadow: var(--sombra); padding: 8px 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.barra-mision .que { flex: 1 1 140px; font-family: var(--f-etiqueta); font-size: 20px; letter-spacing: 1px; line-height: 1.05; }
.barra-mision .que small { display: block; font-family: var(--f-texto); font-size: 15px; letter-spacing: 0; }
.pestanas {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--tinta);
  border-top: 3px solid var(--amarillo);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.pestanas button { background: none; border: 0; color: var(--crema); padding: 10px 4px 8px; font-family: var(--f-etiqueta); font-size: 17px; letter-spacing: 1px; cursor: pointer; display: grid; justify-items: center; gap: 2px; }
.pestanas button svg { width: 24px; height: 24px; fill: currentColor; }
.pestanas button[aria-selected="true"] { color: var(--amarillo); background: rgba(255, 210, 31, 0.08); }
.catalogo { display: grid; gap: 12px; }
.ficha { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--blanco); color: var(--tinta); border: var(--borde); box-shadow: var(--sombra); text-align: left; cursor: pointer; width: 100%; }
.ficha .icono { width: 46px; height: 46px; flex: none; display: grid; place-items: center; background: var(--amarillo); border: var(--borde); }
.ficha .icono svg { width: 70%; height: 70%; fill: var(--tinta); }
.ficha h3 { font-family: var(--f-etiqueta); font-size: 22px; letter-spacing: 1px; line-height: 1; }
.ficha p { font-size: 17px; line-height: 1.1; color: var(--cafe); }
.ficha.jugada { opacity: 0.65; }
.ficha .hecha { margin-left: auto; font-family: var(--f-etiqueta); font-size: 15px; color: var(--rojo-hondo); flex: none; }
.segmentado { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.segmentado button { min-height: 44px; padding: 6px 12px 4px; background: var(--blanco); color: var(--tinta); border: var(--borde); font-family: var(--f-etiqueta); font-size: 19px; letter-spacing: 1px; cursor: pointer; }
.segmentado button[aria-pressed="true"] { background: var(--amarillo); box-shadow: var(--sombra); }
.sugerencias { display: flex; flex-wrap: wrap; gap: 6px; }
.sugerencias button { background: var(--blanco); border: 2px solid var(--tinta); padding: 4px 8px; font-family: var(--f-texto); font-size: 16px; color: var(--tinta); cursor: pointer; }
.agente-fila { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; background: var(--blanco); color: var(--tinta); border: 2px solid var(--tinta); }
.agente-fila .nom { font-size: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agente-fila small { display: block; color: var(--cafe); font-size: 15px; }
.agente-fila .acciones { display: flex; gap: 4px; }
.agente-fila .acciones button { min-width: 44px; min-height: 40px; background: var(--amarillo); border: 2px solid var(--tinta); font-family: var(--f-etiqueta); font-size: 17px; cursor: pointer; padding: 2px 6px; }
.agente-fila.desconectado { opacity: 0.6; }
.qr { width: min(70%, 280px); margin-inline: auto; background: var(--blanco); border: var(--borde); box-shadow: var(--sombra-grande); padding: 8px; }
.qr svg { width: 100%; height: auto; display: block; }
.qr-fondo { fill: var(--blanco); }
.qr-modulos { fill: var(--tinta); }

/* Podio */
.podio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 8px; }
.peldano { display: grid; justify-items: center; gap: 8px; text-align: center; min-width: 0; }
.quien { min-height: 84px; display: grid; justify-items: center; align-content: end; gap: 4px; font-size: 18px; line-height: 1.05; min-width: 0; }
.quien span { overflow-wrap: anywhere; }
.quien .oculto { font-family: var(--f-titulo); font-size: 42px; color: var(--crema); -webkit-text-stroke: 2px var(--tinta); paint-order: stroke fill; }
.escalon { width: 100%; border: var(--borde); display: grid; place-items: center; font-family: var(--f-titulo); font-size: 40px; color: var(--tinta); }
.p1 .escalon { height: 170px; background: var(--amarillo); }
.p2 .escalon { height: 125px; background: var(--blanco); }
.p3 .escalon { height: 92px; background: var(--rojo); color: var(--blanco); }

/* ---------- Piezas de las pantallas (celular y centro de mando) ---------- */
.zona { display: contents; }
.boton svg { width: 1.1em; height: 1.1em; fill: currentColor; flex: none; }
.mision-cabeza { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mision-cabeza .titulo { min-width: 0; overflow-wrap: anywhere; }
.mision-cabeza .poder { font-size: 20px; }
.icono-mision { width: 54px; height: 54px; flex: none; display: grid; place-items: center; background: var(--amarillo); border: var(--borde); box-shadow: var(--sombra); border-radius: 50%; }
.icono-mision svg { width: 62%; height: 62%; fill: var(--tinta); }
.icono-mision.grande { width: 74px; height: 74px; }
.doble { font-family: var(--f-etiqueta); letter-spacing: 1px; color: var(--rojo); font-size: 22px; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.feed li { display: flex; gap: 8px; align-items: center; font-size: 17px; line-height: 1.15; }

/* ---------- Cómo se juega y prácticas ---------- */
.pasos { list-style: none; counter-reset: paso; margin: 0; padding: 0; display: grid; gap: 8px; }
.pasos li { counter-increment: paso; position: relative; padding-left: 42px; font-size: 19px; line-height: 1.2; min-height: 32px; }
.pasos li::before {
  content: counter(paso);
  position: absolute;
  left: 0;
  top: -2px;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  background: var(--rojo);
  color: var(--blanco);
  border: 2px solid var(--tinta);
  border-radius: 50%;
  font-family: var(--f-titulo);
  font-size: 17px;

.mi-codigo span { font-family: var(--f-etiqueta); font-size: 18px; letter-spacing: 1px; }

/* Los globos de Salvador */

/* Sopla la vela de Salvador */

/* ---------- fondo con la ciudad de noche ---------- */
function pintarFondo() {
  if ($(".fondo")) return;
  const f = document.createElement("div");
  f.className = "fondo";
  f.setAttribute("aria-hidden", "true");
  let x = 0, svg = "", semilla = 7;
  const rnd = () => { semilla = (semilla * 9301 + 49297) % 233280; return semilla / 233280; };
  while (x < 400) {
    const w = 18 + rnd() * 26, h = 40 + rnd() * 110;
    svg += `<rect class="edificio" x="${x.toFixed(1)}" y="${(200 - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"/>`;
    for (let wy = 200 - h + 8; wy < 192; wy += 11) {
      for (let wx = x + 4; wx < x + w - 5; wx += 8) if (rnd() > 0.55) svg += `<rect class="luz" x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="3.2" height="5"/>`;
    }
    x += w + 2;
  }
  f.innerHTML = `<svg viewBox="0 0 400 200" preserveAspectRatio="none">${svg}</svg>`;
  document.body.prepend(f);
  if (CONFIG.imagenes && CONFIG.imagenes.papel) document.documentElement.style.setProperty("--textura-papel", `url("${CONFIG.imagenes.papel}")`);
}

    (raiz || document.body).appendChild(capa);

function confeti(raiz) {

  const lienzo = document.createElement("canvas");
  lienzo.className = "confeti";
  lienzo.setAttribute("aria-hidden", "true");

  const W = lienzo.clientWidth || innerWidth, H = lienzo.clientHeight || innerHeight;
  lienzo.width = W * dpr;

  const paleta = ["--amarillo", "--rojo", "--azul", "--crema", "--rojo-claro"].map((v) => css.getPropertyValue(v).trim() || "#ffd21f");
  const piezas = Array.from({ length: 160 }, () => ({
    x: Math.random() * W, y: -20 - Math.random() * H * 0.6, w: 7 + Math.random() * 7, h: 10 + Math.random() * 10,
    vx: -1.6 + Math.random() * 3.2, vy: 2 + Math.random() * 3.4, r: Math.random() * Math.PI, vr: -0.2 + Math.random() * 0.4,
    c: paleta[(Math.random() * paleta.length) | 0],

  (function cuadro(t) {
    ctx.clearRect(0, 0, W, H);

    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    o.start(t); o.stop(t + dur + 0.05);
  }

      const d = ruidoBuf.getChannelData(0);

    }
    const s = a.createBufferSource(); s.buffer = ruidoBuf;
    const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = frec || 850; f.Q.value = 0.9;
    const g = a.createGain();
    const t = a.currentTime + ini;
    g.gain.setValueAtTime(vol, t);

function qrSVG(texto) {

  const q = qrcode(0, "M");
  q.addData(texto);
  q.make();
  const n = q.getModuleCount(), m = 2;
  let d = "";

  const lado = n + 2 * m;

}

/* =====================================================================
   CONEXIÓN: cómo viajan los datos entre el centro de mando y los celulares.
   - firebase: Realtime Database (la fiesta de verdad)
   - local: pestañas del mismo navegador, o todo en memoria (demo)
   ===================================================================== */
function crearTransporteLocal(sala, opciones) {
  const soloMemoria = !!(opciones && opciones.memoria);
  const clave = "liga-local:" + sala;
  let arbol = {};
  if (!soloMemoria) { try { arbol = JSON.parse(almacen.get(clave) || "{}") || {}; } catch (e) { arbol = {}; } }
  const oyentes = new Set();
  let canal = null;
  if (!soloMemoria) { try { canal = new BroadcastChannel(clave); } catch (e) { canal = null; } }
  const partes = (p) => String(p).split("/").filter(Boolean);
  function podar(v) {
    if (v === null || v === undefined) return null;
    if (typeof v !== "object") return v;
    const esLista = Array.isArray(v);
    const out = {};
    for (const k of Object.keys(v)) { const x = podar(v[k]); if (x !== null) out[k] = x; }
    const ks = Object.keys(out);
    if (!ks.length) return null;
    if (esLista && ks.every((k, i) => String(i) === k)) return ks.map((k) => out[k]);
    return out;
  }
  function leer(p) {
    let n = arbol;
    for (const k of partes(p)) { if (n === null || typeof n !== "object") return null; n = n[k]; }
    return n === undefined ? null : n;
  }
  function escribirCrudo(p, v) {
    const ks = partes(p);
    // Igual que la regla de Firebase: un agente sin nombre no se crea.
    if (ks.length >= 5 && ks[2] === "agentes" && v !== null && leer(ks.slice(0, 4).join("/") + "/nombre") === null) return;
    if (!ks.length) { arbol = podar(limpio(v)) || {}; return; }
    let n = arbol;
    for (let i = 0; i < ks.length - 1; i++) {
      if (n[ks[i]] === null || typeof n[ks[i]] !== "object") n[ks[i]] = {};
      n = n[ks[i]];
    }
    const val = podar(limpio(v));
    if (val === null) delete n[ks[ks.length - 1]];
    else n[ks[ks.length - 1]] = val;
    arbol = podar(arbol) || {};
  }
  const relacionados = (a, b) => { const A = partes(a).join("/"), B = partes(b).join("/"); return !A || !B || A === B || A.startsWith(B + "/") || B.startsWith(A + "/"); };
  const copia = (v) => (v === null || v === undefined ? null : JSON.parse(JSON.stringify(v)));
  function notificar(p) {
    for (const o of Array.from(oyentes)) {
      if (!relacionados(o.p, p)) continue;
      const v = copia(leer(o.p));
      setTimeout(() => { if (o.activo) o.cb(v); }, 0);
    }
  }
  let guardadoPendiente = false;
  function guardar() {
    if (soloMemoria || guardadoPendiente) return;
    guardadoPendiente = true;
    setTimeout(() => { guardadoPendiente = false; almacen.set(clave, JSON.stringify(arbol)); }, 30);
  }
  function aplicar(op, p, v, remoto) {
    if (op === "set") escribirCrudo(p, v);
    else if (op === "update") for (const k of Object.keys(v || {})) escribirCrudo(p + "/" + k, v[k]);
    else if (op === "del") escribirCrudo(p, null);
    if (!remoto) {
      guardar();
      if (canal) { try { canal.postMessage({ op, p, v: limpio(v) }); } catch (e) { /* sin canal */ } }
    }
    notificar(p);
  }
  if (canal) {
    canal.onmessage = (ev) => {
      const m = ev.data || {};
      if (m.op === "hola") { canal.postMessage({ op: "arbol", v: arbol }); return; }
      if (m.op === "arbol") { if (!Object.keys(arbol).length && m.v) { arbol = m.v; notificar(""); } return; }
      aplicar(m.op, m.p, m.v, true);
    };
    try { canal.postMessage({ op: "hola" }); } catch (e) { /* sin canal */ }
  }
  const base = "salas/" + sala + "/";
  // Como en Firebase: la promesa se cumple después de avisar a los oyentes locales.
  const despues = (v) => new Promise((ok) => setTimeout(() => ok(v), 0));
  return {
    tipo: "local",
    ahora: () => Date.now(),
    escuchar(p, cb) {
      const o = { p: base + p, cb, activo: true };
      oyentes.add(o);
      const v = copia(leer(o.p));
      setTimeout(() => { if (o.activo) cb(v); }, 0);
      return () => { o.activo = false; oyentes.delete(o); };
    },
    leer(p) { return Promise.resolve(copia(leer(base + p))); },
    escribir(p, v) { aplicar("set", base + p, v); return despues(); },
    actualizar(p, v) { aplicar("update", base + p, v); return despues(); },
    borrar(p) { aplicar("del", base + p, null); return despues(); },
    transaccion(p, fn) {
      const actual = copia(leer(base + p));
      const nuevo = fn(actual);
      if (nuevo === undefined) return despues({ hecho: false, valor: actual });
      aplicar("set", base + p, nuevo);
      return despues({ hecho: true, valor: copia(leer(base + p)) });
    },
    alDesconectar() { return Promise.resolve(); },
    cancelarDesconexion() { return Promise.resolve(); },
    conexion(cb) { setTimeout(() => cb(true), 0); return () => {}; },
    reiniciar() { arbol = {}; notificar(""); },
  };
}

async function crearTransporteFirebase(url, sala) {
  const [{ initializeApp }, D] = await Promise.all([
    import(`${FIREBASE_SDK}/firebase-app.js`),
    import(`${FIREBASE_SDK}/firebase-database.js`),
  ]);
  const app = initializeApp({ databaseURL: String(url).trim().replace(/\/+$/, "") });
  const db = D.getDatabase(app);
  if (window.__FB_EMULADOR__) { const [h, pto] = String(window.__FB_EMULADOR__).split(":"); D.connectDatabaseEmulator(db, h, Number(pto)); }
  let desfase = 0;
  D.onValue(D.ref(db, ".info/serverTimeOffset"), (s) => { desfase = Number(s.val()) || 0; });
  const r = (p) => D.ref(db, "salas/" + sala + "/" + p);
  return {
    tipo: "firebase",
    ahora: () => Date.now() + desfase,
    escuchar(p, cb) { return D.onValue(r(p), (s) => cb(s.val()), (err) => console.warn("No se pudo leer", p, err)); },
    leer(p) { return new Promise((ok, mal) => D.onValue(r(p), (s) => ok(s.val()), mal, { onlyOnce: true })); },
    escribir(p, v) { return D.set(r(p), limpio(v)); },
    actualizar(p, v) { return D.update(r(p), limpio(v)); },
    borrar(p) { return D.remove(r(p)); },
    transaccion(p, fn) {
      return D.runTransaction(r(p), (actual) => {
        const nuevo = fn(actual === undefined ? null : actual);
        return nuevo === undefined ? undefined : limpio(nuevo);
      }).then((res) => ({ hecho: res.committed, valor: res.snapshot.val() }));
    },
    alDesconectar(p, v) { return D.onDisconnect(r(p)).set(v); },
    cancelarDesconexion(p) { return D.onDisconnect(r(p)).cancel(); },
    conexion(cb) { return D.onValue(D.ref(db, ".info/connected"), (s) => cb(!!s.val())); },
  };
}

/* ---------- Estado compartido: lo que miran el centro de mando y los celulares ---------- */
function crearEstado(T, alCambiar) {
  const S = { agentes: undefined, puntos: {}, mision: undefined, final: null, duelos: {}, enfriamiento: {}, historial: {}, ajustes: {}, alerta: null, mj: {}, mjListo: null, conectado: true, caidaDesde: 0 };
  let desMj = null, idMj = null;
  T.escuchar("agentes", (v) => { S.agentes = v || {}; alCambiar("agentes"); });
  T.escuchar("puntos", (v) => { S.puntos = v || {}; S.totales = totalesDe(S.puntos); alCambiar("puntos"); });
  T.escuchar("mision", (v) => { S.mision = v || null; seguirMision(); alCambiar("mision"); });
  T.escuchar("final", (v) => { S.final = v || null; alCambiar("final"); });
  T.escuchar("duelos", (v) => { S.duelos = v || {}; alCambiar("duelos"); });
  T.escuchar("enfriamiento", (v) => { S.enfriamiento = v || {}; alCambiar("enfriamiento"); });
  T.escuchar("historial", (v) => { S.historial = v || {}; alCambiar("historial"); });
  T.escuchar("ajustes", (v) => { S.ajustes = v || {}; alCambiar("ajustes"); });
  T.escuchar("alerta", (v) => { S.alerta = v || null; alCambiar("alerta"); });
  T.conexion((c) => { S.conectado = c; S.caidaDesde = c ? 0 : S.caidaDesde || Date.now(); alCambiar("conexion"); });
  S.totales = {};
  function seguirMision() {
    const id = S.mision && S.mision.id;
    if (id === idMj) return;

}

/* =====================================================================
   MINIJUEGOS INDIVIDUALES: cada uno se juega en la "arena" del celular
   y entrega un puntaje. jugar(arena, terminar) devuelve una función
   para limpiar (detener temporizadores y oyentes).
   ===================================================================== */
function tiempoEvento(e) {
  const t = e && e.timeStamp;
  return t && t < 1e12 ? t : performance.now();
}
function textoArena(arena, html) {
  const t = document.createElement("div");
  t.className = "arena-texto";
  t.innerHTML = html || "";
  arena.appendChild(t);
  return t;
}
function flotar(arena, x, y, txt, mala) {
  const f = document.createElement("div");
  f.className = "flota" + (mala ? " mala" : "");
  f.textContent = txt;
  f.style.left = x + "px";
  f.style.top = y + "px";
  arena.appendChild(f);
  setTimeout(() => f.remove(), 720);
}
function relojArena(arena, ms, alTic, alFin) {
  const r = document.createElement("div");
  r.className = "arena-reloj";
  arena.appendChild(r);
  const fin = performance.now() + ms;
  let raf = 0, vivo = true;
  const paso = (ahora) => {
    if (!vivo) return;
    const queda = Math.max(0, fin - ahora);
    r.textContent = Math.ceil(queda / 1000);
    if (alTic) alTic(queda);
    if (queda <= 0) { vivo = false; alFin(); return; }
    raf = requestAnimationFrame(paso);
  };
  raf = requestAnimationFrame(paso);
  return () => { vivo = false; cancelAnimationFrame(raf); };
}
function marcadorArena(arena, texto) {
  const m = document.createElement("div");
  m.className = "arena-marcador";
  m.textContent = texto || "";
  arena.appendChild(m);
  return m;
}
// Cuenta 3, 2, 1 antes de empezar.
function cuentaAtras(arena, alTerminar) {
  const t = textoArena(arena, "3");
  const pasos = ["3", "2", "1", "¡YA!"];
  let i = 0, vivo = true;
  Sonido.tocar("tic");
  const id = setInterval(() => {
    if (!vivo) return;
    i++;
    if (i < pasos.length) { t.textContent = pasos[i]; Sonido.tocar(i === 3 ? "inicio" : "tic"); }
    else { clearInterval(id); t.remove(); alTerminar(); }
  }, 650);
  return () => { vivo = false; clearInterval(id); t.remove(); };
}
// Fotos de Salvador para los minijuegos (si faltan, cada juego usa su dibujo de siempre).
function imagenSalva(clave) { return (CONFIG.imagenes && CONFIG.imagenes[clave]) || ""; }
function imgSalva(clave, clase) {
  const src = imagenSalva(clave);
  if (!src) return null;
  const img = new Image();
  img.decoding = "async";
  img.draggable = false;
  img.alt = "";
  if (clase) img.className = clase;
  img.src = src;
  return img;
}

        if (intento >= 3) { vivo = false; terminar(Math.round(punterias.reduce((a, b) => a + b, 0) / punterias.length)); return; }
        intento++;
        m.textContent = `Intento ${intento} de 3`;
        const r = arena.getBoundingClientRect();
        const ancho = r.width * azar(0.36, 0.5);
        const alto = ancho * (473 / 330);
        const x = azar(8, Math.max(9, r.width - ancho - 8));
        const y = azar(46, Math.max(47, r.height - alto - 50));
        const img = document.createElement("img");
        img.className = "salva";
        img.alt = "";
        img.src = CONFIG.imagenes && CONFIG.imagenes.salvador ? CONFIG.imagenes.salvador : "";
        img.onerror = () => { img.src = "data:image/svg+xml," + encodeURIComponent(heroeRespaldo()); };
        Object.assign(img.style, { left: x + "px", top: y + "px", width: ancho + "px", height: alto + "px" });
        arena.appendChild(img);
        objetivo = { x: x + ancho * esc_.x, y: y + alto * esc_.y };
        aviso.innerHTML = "<small>¡Mira dónde está su escudo!</small>";
        estado = "mirando";
        luego(() => { img.remove(); estado = "tocar"; aviso.innerHTML = "<small>¡Toca donde estaba!</small>"; }, 1700);
      }
      function toque(e) {
        if (estado !== "tocar") return;
        e.preventDefault();
        estado = "pausa";
        const r = arena.getBoundingClientRect();
        const px = e.clientX - r.left, py = e.clientY - r.top;
        const d = Math.hypot(px - objetivo.x, py - objetivo.y);
        const diag = Math.hypot(r.width, r.height);
        const punteria = clamp(Math.round(100 - (d / diag) * 300), 0, 100);
        punterias.push(punteria);
        const linea = document.createElement("div");
        linea.className = "linea-error";
        Object.assign(linea.style, { left: px + "px", top: py + "px", width: d + "px", transform: `rotate(${Math.atan2(objetivo.y - py, objetivo.x - px)}rad)` });
        const t = document.createElement("div"); t.className = "marca-toque"; Object.assign(t.style, { left: px + "px", top: py + "px" });
        const o = document.createElement("div"); o.className = "marca-real"; Object.assign(o.style, { left: objetivo.x + "px", top: objetivo.y + "px" });
        arena.append(linea, t, o);
        aviso.innerHTML = `${punteria} %<small>${punteria >= 90 ? "¡En el blanco!" : punteria >= 70 ? "¡Muy cerca!" : "Casi…"}</small>`;
        vibrar(punteria >= 90 ? [30, 40, 30] : 40);
        luego(mostrar, 1500);
      }
      arena.addEventListener("pointerdown", toque);
      luego(mostrar, 500);
      return () => { vivo = false; timers.forEach(clearTimeout); arena.removeEventListener("pointerdown", toque); };
    },
  },

  impostor: {
    nombre: "¿Cuál Salvador es distinto?", icono: "lupa",
    resumen: "Todas las caras de Salvador son iguales menos una: encuéntrala en cinco niveles.",
    ayuda: "En cada nivel, todas las caras de Salvador son iguales menos una: puede ser una foto entre dibujos, un dibujo entre fotos o una cara al revés. Tócala lo más rápido posible. Cada error suma 2 segundos.",
    menorEsMejor: true,
    formato: (v) => `${(v / 1000).toFixed(1).replace(".", ",")} s`,
    jugar(arena, terminar) {
      arena.className = "arena papel";

      ] : null;
      const niveles = conFotos || [

      function pintar() {
        const n = niveles[nivel];
        const total = n.cols * n.filas;
        correcto = Math.floor(Math.random() * total);
        m.textContent = `Nivel ${nivel + 1} de 5`;
        caja.style.gridTemplateColumns = `repeat(${n.cols}, 1fr)`;
        caja.style.gridTemplateRows = `repeat(${n.filas}, 1fr)`;
        if (conFotos) {
          caja.innerHTML = Array.from({ length: total }, (_, i) => {
            const es = i === correcto;
            return `<button class="icono-celda cara-celda" data-i="${i}" aria-label="Cara ${i + 1}"><img src="${esc(es ? n.otro : n.base)}" alt="" draggable="false"${es && n.tr ? ` style="transform:${n.tr}"` : ""}></button>`;
          }).join("");
          return;
        }
        caja.innerHTML = Array.from({ length: total }, (_, i) => {
          const es = i === correcto;
          const nombre = es ? n.otro : n.base;
          const color = es && n.color2 ? n.color2 : n.color;
          const tr = es && n.giro ? ` style="transform:rotate(${n.giro}deg)"` : es && n.escala ? ` style="transform:scale(${n.escala})"` : "";
          return `<button class="icono-celda" data-i="${i}" aria-label="Símbolo ${i + 1}"><svg viewBox="0 0 24 24"${tr}><path d="${ICONOS[nombre]}" fill="${color}" fill-rule="evenodd"/></svg></button>`;
        }).join("");
      }
      caja.addEventListener("pointerdown", (e) => {
        const b = e.target.closest(".icono-celda");
        if (!b || !vivo) return;

        if (Number(b.dataset.i) === correcto) {
          vibrar(25);
          nivel++;
          if (nivel >= niveles.length) { vivo = false; caja.innerHTML = ""; m.textContent = "¡Las encontraste!"; terminar(Math.round(performance.now() - t0 + castigo)); return; }

        } else {

          b.classList.add("tiembla");

          setTimeout(() => b.classList.remove("tiembla"), 300);

      });
      const quitar = cuentaAtras(arena, () => { vivo = true; t0 = performance.now(); pintar(); });
      return () => { vivo = false; quitar(); };

  estrellas: {
    nombre: "Salvador atrapa estrellas", icono: "estrella",
    resumen: "Mueve a Salvador volando: atrapa estrellas y esquiva bombas.",
    ayuda: "Arrastra el dedo para mover a Salvador. Cada estrella que atrapa suma 1 y cada bomba resta 3. Dura 25 segundos.",
    menorEsMejor: false,
    formato: (v) => plural(v, "estrella", "estrellas"),
    jugar(arena, terminar) {
      arena.className = "arena noche";
      const lienzo = document.createElement("canvas");
      Object.assign(lienzo.style, { position: "absolute", inset: "0", width: "100%", height: "100%" });
      arena.appendChild(lienzo);
      const ctx = lienzo.getContext("2d");
      const m = marcadorArena(arena, "0");
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      let W = 0, H = 0;
      function medir() { const r = arena.getBoundingClientRect(); W = r.width; H = r.height; lienzo.width = W * dpr; lienzo.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
      medir();
      const pEstrella = new Path2D(ICONOS.estrella), pBomba = new Path2D(ICONOS.bomba), pEscudo = new Path2D(ICONOS.escudo);
      const salva = imgSalva("salvador");
      const SW = 64, SH = Math.round(64 * 473 / 330);
      let x = W / 2, puntos = 0, cosas = [], vivo = false, raf = 0, ultimo = 0, proximo = 0, t0 = 0, parar = () => {};
      function mover(e) { const r = arena.getBoundingClientRect(); x = clamp(e.clientX - r.left, 30, W - 30); }
      arena.addEventListener("pointerdown", mover);
      arena.addEventListener("pointermove", mover);
      function dibujar(path, cx, cy, tam, relleno) {
        ctx.save(); ctx.translate(cx - tam / 2, cy - tam / 2); ctx.scale(tam / 24, tam / 24);
        ctx.lineWidth = 2.2; ctx.strokeStyle = "#16130f"; ctx.fillStyle = relleno; ctx.stroke(path); ctx.fill(path, "evenodd"); ctx.restore();
      }
      function paso(t) {
        if (!vivo) return;
        const dt = Math.min(50, t - (ultimo || t));
        ultimo = t;
        const avance = (t - t0) / 25000;
        if (t >= proximo) {
          const bomba = Math.random() < 0.22 + avance * 0.12;
          cosas.push({ x: azar(22, W - 22), y: -20, v: (0.16 + avance * 0.2 + Math.random() * 0.08) * (H / 470), bomba, tam: bomba ? 34 : 30 });
          proximo = t + Math.max(260, 620 - avance * 380);
        }
        ctx.clearRect(0, 0, W, H);
        const conFoto = !!(salva && salva.complete && salva.naturalWidth);
        const ey = conFoto ? H - SH / 2 - 4 : H - 40;
        const arriba = conFoto ? SH / 2 + 8 : 26, abajo = conFoto ? 10 : 20, ancho = conFoto ? 38 : 42;
        for (const c of cosas) {
          c.y += c.v * dt;
          if (!c.fuera && c.y > ey - arriba && c.y < ey + abajo && Math.abs(c.x - x) < ancho) {
            c.fuera = true;
            if (c.bomba) { puntos -= 3; vibrar(120); flotar(arena, c.x - 10, ey - 70, "-3", true); }
            else { puntos += 1; vibrar(12); flotar(arena, c.x - 10, ey - 60, "+1"); }
            m.textContent = Math.max(0, puntos);
          }
          if (!c.fuera) dibujar(c.bomba ? pBomba : pEstrella, c.x, c.y, c.tam, c.bomba ? "#3b3b3b" : "#ffd21f");
        }
        cosas = cosas.filter((c) => !c.fuera && c.y < H + 30);
        if (conFoto) ctx.drawImage(salva, x - SW / 2, ey - SH / 2, SW, SH);
        else dibujar(pEscudo, x, ey, 64, "#2a5fd0");
        raf = requestAnimationFrame(paso);
      }
      const quitar = cuentaAtras(arena, () => {
        vivo = true;
        t0 = performance.now();
        proximo = t0;
        raf = requestAnimationFrame(paso);
        parar = relojArena(arena, 25000, null, () => { vivo = false; cancelAnimationFrame(raf); terminar(Math.max(0, puntos)); });
      });
      return () => { vivo = false; quitar(); parar(); cancelAnimationFrame(raf); };
    },
  },
};

/* =====================================================================
   MISIONES: cada tipo de juego que el anfitrión puede lanzar.
   Fases comunes: "sala" (opcional, para anotarse) -> "juego" -> "resultados".
   ===================================================================== */
const FORMAS_OPCION = [
  '<svg class="forma" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 22 20.5H2z"/></svg>',
  '<svg class="forma" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8 22.2 12 12 22.2 1.8 12z"/></svg>',
  '<svg class="forma" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.6"/></svg>',
  '<svg class="forma" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1.5"/></svg>',
];
const LECTURA_MS = 4000;
const GRACIA_MS = 1500;

function reloj(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
function nombreDe(S, id) { const a = S.agentes && S.agentes[id]; return a && a.nombre ? a.nombre : "Agente"; }
function poderDeAgente(S, id) { const a = S.agentes && S.agentes[id]; return a ? a.poder : "fuerza"; }
function chipAgente(S, id, clase) {
  return `<li class="${clase || ""}">${poderHTML(poderDeAgente(S, id))}<span>${esc(nombreDe(S, id))}</span></li>`;
}
function listosDe(ctx) { return Object.keys((ctx.mj && ctx.mj.listos) || {}).filter((id) => ctx.S.agentes && ctx.S.agentes[id] && ctx.S.agentes[id].nombre); }
function introHTML(tipo, extra) {
  return `<section class="pagina"><span class="cap">${tipo.cat === "fiesta" ? "Misión en la fiesta" : "Misión en el celular"}</span>` +
    `<h1 class="titulo">${esc(tipo.nombre)}</h1>${tipo.pasos ? `<p class="subtitulo">Cómo se juega</p>${pasosHTML(tipo.pasos)}` : `<p>${esc(tipo.ayuda)}</p>`}${extra || ""}</section>`;
}
function practicaHecha(id) { return almacenAgente.get(`liga2:practica:${id}`) === "1"; }
function marcarPractica(id) { almacenAgente.set(`liga2:practica:${id}`, "1"); }
// Puntos con signo: +100, −50 o 0.
function ptsTexto(p) { p = Math.round(Number(p) || 0); return p > 0 ? `+${fmt(p)}` : p < 0 ? `−${fmt(-p)}` : "0"; }
function filaResultado(S, r, i, yo) {
  return `<li class="${r.id === yo ? "yo" : ""}${Number(r.pts) < 0 ? " resta" : ""}"><span class="pos">${r.pos || i + 1}</span>${poderHTML(poderDeAgente(S, r.id))}` +
    `<span class="nom">${esc(nombreDe(S, r.id))}</span><span class="val">${ptsTexto(r.pts)}<small>${esc(r.txt || "")}</small></span></li>`;
}
function tablaParcial(S, filas, yo, limite) {
  const lista = limite ? filas.slice(0, limite) : filas;
  return `<ol class="tabla">${lista.map((r, i) => `<li class="${r.id === yo ? "yo" : ""}"><span class="pos">${r.pos || i + 1}</span>${poderHTML(poderDeAgente(S, r.id))}<span class="nom">${esc(nombreDe(S, r.id))}</span><span class="val">${esc(r.txt || "")}</span></li>`).join("")}</ol>`;

function botonSecreto(contenido) {

}
function marcaTiempo(ctx, t) {
  if (!ctx.m || !ctx.m.abierta || !t) return "";
  return reloj(t - ctx.m.abierta);
}

/* ---------- Minijuegos individuales: cada uno juega una vez mientras la misión está abierta ---------- */
function tipoSolo(id) {
  const mj = MINIJUEGOS[id];
  return {
    id, nombre: mj.nombre, icono: mj.icono, cat: "celular", resumen: mj.resumen, ayuda: mj.ayuda, solo: true,
    campos: [{ id: "minutos", tipo: "opciones", etiqueta: "Tiempo para jugar", opciones: [[2, "2 min"], [3, "3 min"], [5, "5 min"]], defecto: 3 }],
    lanzar(cfg, ctx) {
      return { mision: { fase: "juego", cierra: ctx.ahora() + (Number(cfg.minutos) || 3) * 60000 } };
    },
    filas(ctx) {
      const res = (ctx.mj && ctx.mj.res) || {};
      const entradas = Object.entries(res).filter(([aid]) => ctx.S.agentes && ctx.S.agentes[aid]).map(([aid, r]) => ({ id: aid, v: Number(r.v) || 0, v2: Number(r.v2) || 0 }));
      return rankear(entradas, mj.menorEsMejor, 1).map((e) => Object.assign(e, { txt: mj.formato(e.v, e.v2) }));
    },
    cerrar(ctx) { ctx.premiar(this.filas(ctx).map((e) => ({ id: e.id, pos: e.pos, pts: e.pts, txt: e.txt }))); },
    host: {
      clave() { return "solo"; },
      html(ctx) {
        return `<section class="pagina"><span class="cap">Abierta</span><h2 class="titulo chico">${esc(mj.nombre)}</h2>` +
          `<p>Cada agente juega una vez. Se cierra sola cuando termina el tiempo.</p>` +
          `<div class="mecha-fila"><div class="mecha"><i></i></div><span class="segundos" data-vivo="tiempo"></span></div>` +
          `<div class="fila"><button class="boton blanco" data-accion="mas-tiempo">+1 minuto</button><button class="boton rojo" data-accion="cerrar-ya">Cerrar y dar puntos</button></div></section>` +
          `<section class="pagina"><span class="cap">Marcas</span><div data-vivo="tabla"></div></section>`;
      },
      actualizar(ctx, raiz) {
        const queda = ctx.m.cierra - ctx.ahora(), total = ctx.m.cierra - ctx.m.abierta;
        const i = $(".mecha i", raiz); if (i) i.style.width = clamp((queda / total) * 100, 0, 100) + "%";
        const t = $('[data-vivo="tiempo"]', raiz); if (t) t.textContent = reloj(queda);
        const tabla = $('[data-vivo="tabla"]', raiz);
        if (tabla) {
          const filas = TIPOS[id].filas(ctx);
          const jugando = Object.keys((ctx.mj && ctx.mj.jugando) || {}).filter((a) => !(ctx.mj.res || {})[a]);
          const firma = JSON.stringify(filas.map((f) => f.id + f.txt)) + jugando.join();
          if (tabla.dataset.firma !== firma) {
            tabla.dataset.firma = firma;
            tabla.innerHTML = (filas.length ? tablaParcial(ctx.S, filas) : `<p class="suave">Todavía nadie terminó.</p>`) +
              (jugando.length ? `<p class="suave">Jugando ahora: ${jugando.map((a) => esc(nombreDe(ctx.S, a))).join(", ")}</p>` : "");
          }
        }
      },
      click(accion, el, ctx) {
        if (accion === "mas-tiempo") ctx.T.actualizar("mision", { cierra: Math.max(ctx.m.cierra, ctx.ahora()) + 60000 });
        if (accion === "cerrar-ya") ctx.cerrarMision();
      },
      tic(ctx) { if (ctx.ahora() > ctx.m.cierra) ctx.cerrarMision(); },
    },
    jugador: {
      clave(ctx) {
        const r = ctx.mj && ctx.mj.res && ctx.mj.res[ctx.yo];
        if (ctx.local.estado === "jugando") return "jugando";
        if (r) return "hecho";
        if (ctx.local.estado === "practica") return "practica";
        if (ctx.local.estado === "practicado") return "practicado";
        return "intro";
      },
      html(ctx) {
        const clave = this.clave(ctx);
        if (clave === "jugando") return `<div class="cinta-juego">¡En serio! Esta vez cuenta</div><div class="arena" data-arena></div><button class="enlace" data-accion="abandonar">Salir sin terminar</button>`;

/* ---------- Elegir preguntas: por tema y dificultad, sin repetir mientras queden ---------- */
function elegirPreguntas(n, tema, usadas) {
  const todas = PREGUNTAS.map((q, i) => ({ q, i }));
  const delTema = todas.filter((x) => tema === "mixta" || (x.q.tema || "heroes") === tema);
  let libres = barajar(delTema.filter((x) => !usadas.has(x.i)));
  if (libres.length < n) libres = libres.concat(barajar(delTema.filter((x) => usadas.has(x.i))));
  const porDificultad = (lista, cuantas) => {
    const grupos = { 1: [], 2: [], 3: [] };
    lista.forEach((x) => (grupos[x.q.d] || grupos[2]).push(x));
    const quiero = { 1: Math.ceil(cuantas * 0.4), 3: Math.floor(cuantas * 0.2) };
    quiero[2] = cuantas - quiero[1] - quiero[3];
    const out = [];
    for (const d of [1, 2, 3]) out.push(...grupos[d].splice(0, quiero[d]));
    const resto = grupos[1].concat(grupos[2], grupos[3]);
    while (out.length < cuantas && resto.length) out.push(resto.shift());
    return out;
  };
  let elegidas;
  if (tema === "mixta") {
    const deSalvador = libres.filter((x) => x.q.tema === "salvador").slice(0, Math.max(1, Math.round(n / 5)));
    elegidas = porDificultad(libres.filter((x) => x.q.tema !== "salvador"), n - deSalvador.length).concat(deSalvador);
  } else elegidas = porDificultad(libres, n);
  return elegidas.slice(0, n).sort((a, b) => (a.q.d || 2) - (b.q.d || 2)).map((x) => x.i);
}
// Preguntas que ya salieron en la fiesta (trivia y relámpago): no se repiten mientras queden otras.
function preguntasUsadas(S) { return new Set(Object.keys((S && S.triviaUsadas) || {}).map((k) => Number(String(k).replace("q", "")))); }
function estadoPreguntas(S) {
  const usadas = preguntasUsadas(S);
  const r = { total: PREGUNTAS.length, libres: 0, heroes: { total: 0, libres: 0 }, salvador: { total: 0, libres: 0 } };
  PREGUNTAS.forEach((q, i) => {
    const t = (q.tema || "heroes") === "salvador" ? r.salvador : r.heroes;
    t.total++;
    if (!usadas.has(i)) { t.libres++; r.libres++; }
  });
  return r;
}
function notaPreguntas(S, tema, n) {
  const e = estadoPreguntas(S);
  const libres = tema === "salvador" ? e.salvador.libres : tema === "heroes" ? e.heroes.libres : e.libres;
  return `<div class="contador-preguntas"><b>${fmt(e.libres)}</b><span>preguntas sin usar de ${fmt(e.total)}<small>${fmt(e.heroes.libres)} de superhéroes · ${fmt(e.salvador.libres)} de Salvador</small></span></div>` +
    `<p class="suave">Cada pregunta que sale queda marcada y no se repite en la fiesta.${e.libres < e.total ? ` Ya salieron ${fmt(e.total - e.libres)}.` : ""}</p>` +
    (n && libres < n ? `<p class="error">${libres ? `Solo quedan ${libres} sin usar de este tema: se completará con algunas que ya salieron.` : "Ya salieron todas las de este tema: se repetirán. Elige otro tema."}</p>` : "");
}
function segundosTexto(ms) { return `${(Math.max(0, Number(ms) || 0) / 1000).toFixed(1).replace(".", ",")} s`; }
// Las opciones se muestran en otro orden en cada ronda: así nadie aprende «la primera siempre es».

/* ---------- Pregunta relámpago: una pregunta sorpresa; gana quien acierta primero ---------- */
const PREMIOS_RELAMPAGO = [100, 50, 25];

function elegirRelampago(tema, usadas) {

  const lista = libres.length ? libres : delTema;

  notaLanzar(S, cfg) { return notaPreguntas(S, cfg.tema || "mixta", 1); },
  lanzar(cfg, ctx) {

      const queda = s.inicio + s.limiteMs - ahora;

function pintarMechaPregunta(raiz, s, ahora) {
  const t = ahora - s.inicio;
  let f;
  if (t < s.lecturaMs) f = { fase: "lectura", frac: clamp(t / s.lecturaMs, 0, 1), queda: null };
  else { const queda = s.lecturaMs + s.limiteMs - t; f = queda >= 0 ? { fase: "responder", frac: clamp(queda / s.limiteMs, 0, 1), queda } : { fase: "fin", frac: 0, queda: 0 }; }
  const barra = $(".mecha", raiz), seg = $(".segundos", raiz);
  if (barra) {
    barra.firstElementChild.style.width = (f.frac * 100).toFixed(1) + "%";
    barra.classList.toggle("lectura", f.fase === "lectura");
    barra.classList.toggle("urgente", f.fase === "responder" && f.queda < 5000);
  }
  if (seg) seg.textContent = f.fase === "responder" ? String(Math.ceil(f.queda / 1000)) : "";
  return f;
}

/* ---------- Foto en el lugar ---------- */
async function comprimirFoto(archivo, lado, calidad) {
  const url = URL.createObjectURL(archivo);
  try {
    const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
    const esc_ = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * esc_);
    c.height = Math.round(img.naturalHeight * esc_);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", calidad);
  } finally { URL.revokeObjectURL(url); }
}

        return reto + `<div class="estallido"><div><strong>¡Llegó!</strong><b data-vivo="puesto"></b></div></div>` +
          `<p class="centro">Tu foto llegó a los ${esc(marcaTiempo(ctx, l.t))}.</p><button class="boton bloque" data-accion="cuartel">Volver al cuartel</button>`;
      }
      return reto + (l ? `<div class="globo"><strong>Foto rechazada.</strong> El anfitrión dice que no cumple el reto. Puedes enviar otra.</div>` : "") +
        `<button class="boton rojo grande bloque" data-accion="tomar">${icono("camara")} Tomar foto</button>${input}<button class="enlace" data-accion="cuartel">Volver al cuartel</button>`;
    },
    actualizar(ctx, raiz) {
      const q = $('[data-vivo="queda"]', raiz);
      if (q) q.textContent = `Se cierra en ${reloj(ctx.m.cierra - ctx.ahora())}.`;
      const p = $('[data-vivo="puesto"]', raiz);
      if (p) {
        const validas = TIPOS.foto.ordenadas(ctx).filter((l) => l.estado !== "rechazada");
        const i = validas.findIndex((l) => l.id === ctx.yo);
        p.textContent = i >= 0 ? `${ordinal(i + 1)} lugar` : "";
      }
    },
    click(accion, el, ctx) {
      if (accion === "tomar" || accion === "otra") {
        const input = $("#archivo-foto", ctx.raiz);
        input.onchange = async () => {
          const f = input.files && input.files[0];
          if (!f) return;
          try {
            ctx.local.vista = await comprimirFoto(f, 960, 0.72);
            ctx.local.mini = await comprimirFoto(f, 260, 0.6);
          } catch (e) { avisar("No se pudo abrir la foto. Intenta otra vez.", ctx.capaAvisos()); return; }
          ctx.pintar();
        };
        input.click();
      }
      if (accion === "enviar" && ctx.local.vista) {
        ctx.local.subiendo = true;
        ctx.pintar();
        const id = ctx.m.id, yo = ctx.yo, full = ctx.local.vista, mini = ctx.local.mini || full;
        Promise.all([ctx.T.escribir(`fotos/${id}/${yo}`, full), ctx.T.escribir(`fotosMini/${id}/${yo}`, mini)])
          .then(() => ctx.T.escribir(`mj/${id}/llegadas/${yo}`, { t: ctx.ahora(), estado: "ok" }))
          .then(() => { ctx.local.subiendo = false; ctx.local.vista = null; vibrar([40, 50, 40]); Sonido.tocar("exito"); ctx.pintar(); })
          .catch(() => { ctx.local.subiendo = false; avisar("No se pudo subir. Revisa tu internet e intenta otra vez.", ctx.capaAvisos()); ctx.pintar(); });
      }
    },
  },
};

/* ---------- El último héroe en pie ---------- */
TIPOS.ultimo = {
  id: "ultimo", nombre: "El último héroe en pie", icono: "trofeo", cat: "celular", usaSala: true,
  resumen: "Rondas de reflejos con eliminación hasta que queda uno.",
  ayuda: "En cada ronda la pantalla se pone amarilla de golpe: toca lo más rápido que puedas. Los más lentos quedan eliminados, y también quien toque antes de tiempo.",
  campos: [],
  empezar(ctx) {
    const vivos = barajar(listosDe(ctx));
    if (vivos.length < 2) { avisar("Se necesitan al menos 2 agentes listos."); return false; }
    ctx.T.actualizar("mision", { fase: "juego", sub: { ronda: 1, estado: "ronda", go: ctx.ahora() + 3000 + azar(800, 3000), vivos, elim: {} } });
    return true;
  },
  resolverRonda(ctx) {
    const s = ctx.m.sub;
    if (ctx.local.resuelta === s.ronda) return;
    ctx.local.resuelta = s.ronda;
    const tiempos = ((ctx.mj && ctx.mj.t) || {})[`r${s.ronda}`] || {};
    const validos = s.vivos.filter((id) => Number(tiempos[id]) > 0).sort((a, b) => tiempos[a] - tiempos[b]);
    const fallan = s.vivos.filter((id) => !(Number(tiempos[id]) > 0));
    let fuera = fallan.slice();
    if (validos.length === 0) fuera = [];
    else {
      const cortar = Math.max(1, Math.ceil(validos.length * 0.25));
      const lentos = validos.slice(Math.max(1, validos.length - cortar));
      fuera = fallan.concat(validos.length > 1 ? lentos : []);
    }
    const vivos = s.vivos.filter((id) => !fuera.includes(id));
    const elim = Object.assign({}, s.elim || {});
    fuera.forEach((id) => { elim[id] = { r: s.ronda, ms: Number(tiempos[id]) > 0 ? Number(tiempos[id]) : 9999 }; });
    ctx.T.actualizar("mision", { "sub/estado": "pausa", "sub/vivos": vivos.length ? vivos : s.vivos, "sub/elim": elim, "sub/fuera": fuera, "sub/hasta": ctx.ahora() + 3000 });
  },
  cerrar(ctx) {
    const s = ctx.m.sub || {};
    const vivos = s.vivos || [];
    const elim = s.elim || {};
    const entradas = vivos.map((id) => ({ id, v: 1000, v2: 0 })).concat(Object.entries(elim).map(([id, e]) => ({ id, v: e.r, v2: e.ms })));
    ctx.premiar(rankear(entradas.filter((e) => ctx.S.agentes[e.id]), false, 1).map((e) => ({ id: e.id, pos: e.pos, pts: e.pts, txt: e.v === 1000 ? "¡último en pie!" : `cayó en la ronda ${e.v}` })));
  },
  host: {
    clave(ctx) { const s = ctx.m.sub; return `${s.ronda}:${s.estado}`; },
    html(ctx) {
      const s = ctx.m.sub;
      const elim = Object.keys(s.elim || {});
      return `<section class="pagina"><span class="cap">Ronda ${s.ronda}</span><h2 class="titulo chico">${s.estado === "pausa" ? "Resultados de la ronda" : "¡Atentos!"}</h2>` +
        `<p>Quedan <b>${s.vivos.length}</b> en pie.</p><ul class="chips">${s.vivos.map((id) => chipAgente(ctx.S, id, "listo")).join("")}${elim.map((id) => chipAgente(ctx.S, id, "fuera")).join("")}</ul>` +
        `<button class="boton blanco" data-accion="cerrar-ya">Terminar y dar puntos</button></section>`;
    },
    click(accion, el, ctx) { if (accion === "cerrar-ya") ctx.cerrarMision(); },
    tic(ctx) {
      const s = ctx.m.sub;
      if (ctx.m.fase !== "juego") return;
      const ahora = ctx.ahora();
      if (s.estado === "ronda") {
        const tiempos = ((ctx.mj && ctx.mj.t) || {})[`r${s.ronda}`] || {};
        const todos = s.vivos.every((id) => tiempos[id] !== undefined);
        if (ahora > s.go + 2500 || (todos && ahora > s.go)) TIPOS.ultimo.resolverRonda(ctx);
      } else if (s.estado === "pausa" && ahora > s.hasta && ctx.local.siguiente !== s.ronda) {
        ctx.local.siguiente = s.ronda;
        if (s.vivos.length <= 1) ctx.cerrarMision();
        else ctx.T.actualizar("mision", { "sub/ronda": s.ronda + 1, "sub/estado": "ronda", "sub/go": ahora + 2200 + azar(800, 3200), "sub/fuera": null });
      }
    },
  },
  jugador: {
    clave(ctx) {
      const s = ctx.m.sub;
      const elim = (s.elim || {})[ctx.yo];
      if (!s.vivos.includes(ctx.yo) && !elim) return "mirando";
      if (elim && s.estado !== "pausa") return `elim:${elim.r}`;
      if (elim && (s.fuera || []).includes(ctx.yo)) return `cae:${s.ronda}`;
      if (elim) return `elim:${elim.r}`;
      return `${s.estado}:${s.ronda}`;
    },
    html(ctx) {
      const s = ctx.m.sub;
      const clave = this.clave(ctx);
      if (clave === "mirando") return `<section class="pagina"><span class="cap">Ronda ${s.ronda}</span><p>Esta misión empezó sin ti. Quedan ${s.vivos.length} en pie.</p></section><button class="boton bloque" data-accion="cuartel">Volver al cuartel</button>`;
      if (clave.startsWith("cae:")) return `<div class="estallido rojo"><div><strong>¡Fuera!</strong></div></div><p class="centro">Quedaste eliminado en la ronda ${s.ronda}.</p>`;
      if (clave.startsWith("elim:")) return `<section class="pagina"><span class="cap">Eliminado</span><p>Caíste en la ronda ${(s.elim[ctx.yo] || {}).r}. Quedan <b>${s.vivos.length}</b> en pie.</p><ul class="chips">${s.vivos.map((id) => chipAgente(ctx.S, id, "listo")).join("")}</ul></section>`;
      if (s.estado === "pausa") return `<div class="estallido"><div><strong>¡Sigues!</strong><b>Ronda ${s.ronda}</b></div></div><p class="centro">Quedan ${s.vivos.length} en pie.</p>`;
      return `<p class="centro"><span class="cap">Ronda ${s.ronda} · quedan ${s.vivos.length}</span></p><div class="arena noche" data-arena><div class="arena-texto" data-vivo="aviso">Prepárate…<small>Toca cuando se ponga amarilla</small></div></div>`;
    },
    actualizar(ctx, raiz) {
      const s = ctx.m.sub;
      const arena = $("[data-arena]", raiz);
      if (!arena || s.estado !== "ronda") return;
      const L = ctx.local;
      if (L.ronda !== s.ronda) {
        L.ronda = s.ronda; L.t0 = 0; L.hecho = false;
        arena.onpointerdown = (e) => {
          e.preventDefault();
          if (L.hecho || L.ronda !== ctx.m.sub.ronda) return;
          const aviso = $('[data-vivo="aviso"]', arena);
          if (!L.t0 && !L.avisado) {
            // Primer toque antes de tiempo en la partida: solo un aviso.
            L.avisado = true;
            arena.className = "arena roja";
            aviso.innerHTML = "¡Todavía no!<small>Espera el amarillo. La próxima vez quedas fuera</small>";
            vibrar(150);
            Sonido.tocar("error");
            setTimeout(() => { if (!L.t0 && !L.hecho) { arena.className = "arena noche"; aviso.innerHTML = "Prepárate…<small>Toca cuando se ponga amarilla</small>"; } }, 1300);
            return;
          }
          L.hecho = true;
          if (!L.t0) { ctx.T.escribir(`mj/${ctx.m.id}/t/r${L.ronda}/${ctx.yo}`, -1); arena.className = "arena roja"; aviso.innerHTML = "¡Muy pronto!"; vibrar(200); return; }
          const ms = clamp(Math.round(tiempoEvento(e) - L.t0), 60, 2500);
          ctx.T.escribir(`mj/${ctx.m.id}/t/r${L.ronda}/${ctx.yo}`, ms);
          aviso.innerHTML = `${fmt(ms)} ms`;
          vibrar(30);
        };
      }
      if (!L.t0 && !L.hecho && ctx.ahora() >= s.go) {
        arena.className = "arena amarilla";
        $('[data-vivo="aviso"]', arena).innerHTML = yaHTML();
        L.t0 = performance.now();
        requestAnimationFrame((t) => { L.t0 = Math.max(L.t0, t); });
      }
    },
    efectos(ctx, clave) { if (clave.startsWith("cae:")) vibrar(300); },
  },
};

/* ---------- Carrera de la Liga ---------- */
const PASOS_META = 150;
TIPOS.carrera = {
  id: "carrera", nombre: "Carrera de la Liga", icono: "bandera", cat: "celular", usaSala: true,
  resumen: "Todos corren a la vez tocando dos botones alternados.",
  ayuda: "Toca los botones izquierdo y derecho alternados para correr. En la pantalla ves a todos los corredores en vivo. Gana quien llegue primero a la meta.",
  campos: [],
  empezar(ctx) {
    const corredores = listosDe(ctx);
    if (!corredores.length) { avisar("Primero tiene que haber agentes listos."); return false; }
    const inicio = ctx.ahora() + 4200;
    ctx.T.actualizar("mision", { fase: "juego", sub: { inicio, limite: inicio + 100000, corredores } });
    return true;
  },
  progreso(ctx) {
    const s = ctx.m.sub, pasos = (ctx.mj && ctx.mj.pasos) || {}, llegada = (ctx.mj && ctx.mj.llegada) || {};
    return s.corredores.filter((id) => ctx.S.agentes[id]).map((id) => ({ id, pasos: llegada[id] ? PASOS_META : Number(pasos[id]) || 0, llegada: Number(llegada[id]) || 0 }))
      .sort((a, b) => (a.llegada && b.llegada ? a.llegada - b.llegada : a.llegada ? -1 : b.llegada ? 1 : b.pasos - a.pasos));
  },
  pista(ctx, yo) {
    const lista = this.progreso(ctx);
    let mostrar = lista.slice(0, 6);
    if (yo && !mostrar.find((c) => c.id === yo)) { const mio = lista.find((c) => c.id === yo); if (mio) mostrar = mostrar.slice(0, 5).concat([mio]); }
    const resto = lista.length - mostrar.length;
    return `<div class="pista"><div class="meta-salva"><span>¡Salvador te espera en la meta!</span>${caraSalvadorHTML("cara-meta")}</div>${mostrar.map((c) => `<div class="carril ${c.id === yo ? "yo" : ""}"><span class="meta"></span><div class="corredor" style="left:calc(${(c.pasos / PASOS_META) * 100}% - ${(c.pasos / PASOS_META) * 96}px)">${poderHTML(poderDeAgente(ctx.S, c.id))}<span>${esc(nombreDe(ctx.S, c.id))}</span></div></div>`).join("")}</div>` +
      (resto > 0 ? `<p class="nota centro">y ${plural(resto, "corredor más", "corredores más")}</p>` : "");
  },
  cerrar(ctx) {
    const entradas = this.progreso(ctx).map((c) => ({ id: c.id, v: c.llegada ? c.llegada : 1e9 - c.pasos, llegada: c.llegada, pasos: c.pasos }));
    ctx.premiar(rankear(entradas, true, 1).map((e) => ({ id: e.id, pos: e.pos, pts: e.pts, txt: e.llegada ? `${(e.llegada / 1000).toFixed(1).replace(".", ",")} s` : `${e.pasos} de ${PASOS_META} pasos` })));
  },
  host: {
    clave() { return "carrera"; },
    html() { return `<section class="pagina"><span class="cap" data-vivo="estado">En sus marcas</span><div data-vivo="pista"></div><button class="boton blanco" data-accion="cerrar-ya">Terminar y dar puntos</button></section>`; },
    actualizar(ctx, raiz) {
      const s = ctx.m.sub, ahora = ctx.ahora();
      const e = $('[data-vivo="estado"]', raiz);
      if (e) e.textContent = ahora < s.inicio ? `Arranca en ${Math.ceil((s.inicio - ahora) / 1000)}` : `Carrera · ${reloj(ahora - s.inicio)}`;
      const p = $('[data-vivo="pista"]', raiz);
      if (p) { const h = TIPOS.carrera.pista(ctx, null); if (p.dataset.h !== h) { p.dataset.h = h; p.innerHTML = h; } }
    },
    click(accion, el, ctx) { if (accion === "cerrar-ya") ctx.cerrarMision(); },
    tic(ctx) {
      const s = ctx.m.sub, ahora = ctx.ahora();
      const lista = TIPOS.carrera.progreso(ctx);
      if (ahora > s.limite || (lista.length && lista.every((c) => c.llegada))) ctx.cerrarMision();
    },
  },
  jugador: {
    clave(ctx) { const s = ctx.m.sub; return s.corredores.includes(ctx.yo) ? "corre" : "mira"; },
    html(ctx) {
      const corre = ctx.m.sub.corredores.includes(ctx.yo);
      return `<p class="centro"><span class="cap" data-vivo="estado">En sus marcas</span></p><div data-vivo="pista"></div>` +
        (corre ? `<div class="pies"><button class="pie" data-pie="0" disabled>Izquierdo</button><button class="pie" data-pie="1" disabled>Derecho</button></div>` : `<p class="centro">Esta carrera empezó sin ti. ¡Mira cómo van!</p>`);
    },
    actualizar(ctx, raiz) {
      const s = ctx.m.sub, ahora = ctx.ahora(), L = ctx.local;
      const llegue = ((ctx.mj && ctx.mj.llegada) || {})[ctx.yo];
      const e = $('[data-vivo="estado"]', raiz);
      if (e) e.textContent = llegue ? `¡Llegaste! ${(llegue / 1000).toFixed(1).replace(".", ",")} s` : ahora < s.inicio ? `Arranca en ${Math.ceil((s.inicio - ahora) / 1000)}` : "¡CORRE!";
      const p = $('[data-vivo="pista"]', raiz);
      if (p) { const h = TIPOS.carrera.pista(ctx, ctx.yo); if (p.dataset.h !== h) { p.dataset.h = h; p.innerHTML = h; } }
      const pies = $$(".pie", raiz);
      if (!pies.length) return;
      const activo = ahora >= s.inicio && ahora < s.limite && !llegue;
      pies.forEach((b) => { if (b.disabled === activo) b.disabled = !activo; });
      if (activo && !L.arranque) { L.arranque = performance.now() - (ahora - s.inicio); L.pasos = 0; L.ultimo = 1; }
      if (!L.enlazado) {
        L.enlazado = true;
        raiz.addEventListener("pointerdown", (ev) => {
          const b = ev.target.closest(".pie");
          if (!b || b.disabled) return;
          ev.preventDefault();
          const lado = Number(b.dataset.pie);
          if (lado === L.ultimo) return;
          L.ultimo = lado;
          L.pasos = (L.pasos || 0) + 1;
          b.classList.add("toca");
          setTimeout(() => b.classList.remove("toca"), 70);
          if (L.pasos >= PASOS_META && !L.llego) {
            L.llego = true;
            const ms = Math.round(tiempoEvento(ev) - L.arranque);
            ctx.T.escribir(`mj/${ctx.m.id}/llegada/${ctx.yo}`, ms);
            ctx.T.escribir(`mj/${ctx.m.id}/pasos/${ctx.yo}`, PASOS_META);
            vibrar([40, 60, 40]);
            Sonido.tocar("exito");
          } else if (!L.enviando) {
            L.enviando = true;
            setTimeout(() => { L.enviando = false; if (!L.llego) ctx.T.escribir(`mj/${ctx.m.id}/pasos/${ctx.yo}`, L.pasos); }, 220);
          }
        });
      }
    },
  },
};

          `<p class="suave" data-vivo="tiempo"></p><button class="boton blanco" data-accion="saltar">Saltar esta palabra</button></section>`;

      return ultimo + `<section class="pagina"><span class="cap">Nueva ronda</span>${form}</section>` +
        (s.ronda > 0 ? `<button class="boton blanco" data-accion="cerrar-ya">Terminar charadas y dar puntos</button>` : "");
    },
    actualizar(ctx, raiz) {

      if (t && s.inicio) t.textContent = `Llevan ${reloj(ctx.ahora() - s.inicio)} adivinando.`;

    tic(ctx) {

      if (s.estado === "jugando" && g && ctx.local.anunciada !== s.ronda) { ctx.local.anunciada = s.ronda; Sonido.tocar("fanfarria"); ctx.T.actualizar("mision", { "sub/estado": "adivinada" }); }
    },
  },
  jugador: {
    clave(ctx) { const s = ctx.m.sub; const g = TIPOS.charadas.ganadorRonda(ctx, s.ronda); return `${s.ronda}:${s.estado === "saltada" ? "saltada" : g ? "g" + g.id : s.estado}`; },
