      const s = ctx.m.sub;
      const g = TIPOS.charadas.ganadorRonda(ctx, s.ronda);
      const mis = Object.values((ctx.mj && ctx.mj.ganadores) || {}).filter((x) => x && x.id === ctx.yo).length;
      const pie = `<p class="centro nota">Llevas ${plural(mis, "palabra", "palabras")} adivinadas.</p><button class="enlace" data-accion="cuartel">Volver al cuartel</button>`;
      if (g) {
        const yo = g.id === ctx.yo;
        return `<div class="estallido ${yo ? "" : "azul"}"><div><strong>${yo ? "¡La tienes!" : "¡Adivinada!"}</strong><b>${esc(revelar(s.palabra))}</b></div></div>` +
          `<p class="centro">${yo ? "¡Fuiste el primero!" : `La adivinó ${esc(nombreDe(ctx.S, g.id))}.`}</p>` + pie;
      }
      if (s.estado === "saltada") return `<section class="pagina"><span class="cap">Ronda ${s.ronda}</span><p>Nadie la adivinó. Era «${esc(revelar(s.palabra))}».</p></section>` + pie;
      if (s.estado !== "jugando") {
        return `<section class="pagina"><span class="cap">Charadas</span><h1 class="titulo chico">Atento al anfitrión</h1>${pasosHTML(TIPOS.charadas.pasos)}</section>` +
          `<section class="pagina"><span class="cap">Práctica · no cuenta</span><div data-practica="texto"></div></section>` + pie;
      }
      return `<section class="pagina"><span class="cap">Ronda ${s.ronda}</span><h1 class="titulo chico">¿Qué está actuando?</h1>${s.pista ? `<p>Pista: <b>${esc(s.pista)}</b></p>` : ""}` +
        `<form data-form="adivinar" class="columna"><div class="campo-grupo"><label class="etiqueta" for="intento">Tu respuesta</label><input class="campo" id="intento" autocomplete="off" autocapitalize="none" enterkeyhint="send"></div>` +
        `<p class="error" data-vivo="error"></p><button class="boton rojo grande bloque" type="submit">Enviar</button></form></section>` + pie;
    },
    enviar(form, ctx) {
      const s = ctx.m.sub, L = ctx.local;
      const input = $("#intento", ctx.raiz), err = $('[data-vivo="error"]', ctx.raiz);
      const txt = input.value;
      if (!normalizar(txt)) return;
      if (L.espera && Date.now() < L.espera) { err.textContent = "Espera un segundo…"; return; }
      L.espera = Date.now() + 1000;
      const resultado = compararRespuesta(txt, revelar(s.palabra));
      if (resultado !== "exacta") {
        err.textContent = resultado === "casi" ? "¡Casi! Revisa cómo lo escribiste." : "No es esa. ¡Sigue intentando!";
        vibrar(80);
        input.select();
        return;
      }
      const ronda = s.ronda;
      ctx.T.transaccion(`mj/${ctx.m.id}/ganadores/r${ronda}`, (actual) => (actual ? undefined : { id: ctx.yo, t: ctx.ahora(), ms: Math.max(0, ctx.ahora() - (s.inicio || ctx.ahora())) }))
        .then((r) => { if (r.hecho) { vibrar([60, 40, 60]); Sonido.tocar("exito"); } else err.textContent = "¡Alguien la escribió primero!"; });
    },
  },
};

/* ---------- El villano infiltrado ---------- */
TIPOS.infiltrado = {
  id: "infiltrado", nombre: "El villano infiltrado", icono: "antifaz", cat: "fiesta", usaSala: true,
  resumen: "Todos saben qué villano anda suelto, menos el infiltrado. Den pistas sin decir su nombre y voten.",
  ayuda: "Todos reciben en secreto el nombre de un villano (por ejemplo, Thanos), menos el infiltrado. Den pistas sobre ese villano sin decir su nombre: el infiltrado no sabe cuál es y tiene que disimular. Al final voten quién es el infiltrado.",
  campos: [
    { id: "minutos", tipo: "opciones", etiqueta: "Tiempo para conversar", opciones: [[2, "2 min"], [3, "3 min"], [5, "5 min"]], defecto: 3 },
    { id: "palabra", tipo: "texto", etiqueta: "Villano secreto (opcional: si lo dejas vacío, sale uno al azar)", sugerencias: PALABRAS_VILLANO, defecto: "" },
  ],
  empezar(ctx) {
    const jugadores = barajar(listosDe(ctx));
    if (jugadores.length < 3) { avisar("Se necesitan al menos 3 agentes listos."); return false; }
    const nv = jugadores.length <= 6 ? 1 : jugadores.length <= 12 ? 2 : 3;
    const villanos = jugadores.slice(0, nv);
    const palabra = (ctx.m.cfg && String(ctx.m.cfg.palabra || "").trim()) || PALABRAS_VILLANO[Math.floor(Math.random() * PALABRAS_VILLANO.length)];
    const roles = {};
    jugadores.forEach((id) => { roles[id] = villanos.includes(id) ? "v" : "l"; });
    ctx.T.escribir(`mj/${ctx.m.id}/roles`, roles);
    ctx.T.actualizar("mision", { fase: "juego", sub: { estado: "roles", palabra: ocultar(palabra), jugadores, nv } });
    return true;
  },
  resumen_(ctx) {
    const s = ctx.m.sub, roles = (ctx.mj && ctx.mj.roles) || {}, votos = (ctx.mj && ctx.mj.votos) || {}, adiv = (ctx.mj && ctx.mj.adivina) || {};
    const cuenta = {};
    for (const v of Object.values(votos)) cuenta[v] = (cuenta[v] || 0) + 1;
    const max = Math.max(0, ...Object.values(cuenta));
    const villanos = s.jugadores.filter((id) => roles[id] === "v");
    const atrapados = villanos.filter((id) => max > 0 && (cuenta[id] || 0) === max);
    const palabra = revelar(s.palabra);
    const acerto = {};
    const nombres = [palabra].concat(ALIAS_VILLANO[palabra] || []);
    villanos.forEach((id) => { acerto[id] = nombres.some((n) => compararRespuesta(adiv[id] || "", n) === "exacta"); });
    return { cuenta, villanos, atrapados, palabra, acerto, votos };
  },
  cerrar(ctx) {
    const r = this.resumen_(ctx);
    const filas = ctx.m.sub.jugadores.filter((id) => ctx.S.agentes[id]).map((id) => {
      let pts = 0, txt = "";
      if (r.villanos.includes(id)) {
        if (!r.atrapados.includes(id)) { pts += 150; txt = "infiltrado que escapó"; } else txt = "infiltrado atrapado";
        if (r.acerto[id]) { pts += 100; txt += " y adivinó el villano"; }
      } else if (r.villanos.includes(r.votos[id])) { pts = 100; txt = "descubrió al infiltrado"; }
      else txt = r.votos[id] ? "votó mal" : "no votó";
      return { id, pts, txt };
    }).sort((a, b) => b.pts - a.pts);
    ctx.premiar(filas, true);
  },
  host: {
    clave(ctx) { return ctx.m.sub.estado; },
    html(ctx) {
      const s = ctx.m.sub;
      if (s.estado === "roles") return `<section class="pagina"><span class="cap">Roles repartidos</span><p>${plural(s.jugadores.length, "agente", "agentes")}, ${plural(s.nv, "infiltrado", "infiltrados")}. Pídeles que miren su secreto sin mostrarlo.</p><p>Villano secreto: <b>${esc(revelar(s.palabra))}</b></p><button class="boton rojo" data-accion="charla">Empezar a conversar</button></section>`;
      if (s.estado === "charla") return `<section class="pagina"><span class="cap">Conversación</span><p>Que den pistas sobre el villano sin decir su nombre. El infiltrado tiene que disimular.</p><div class="mecha-fila"><div class="mecha"><i></i></div><span class="segundos" data-vivo="tiempo"></span></div><button class="boton rojo" data-accion="votar">Pasar a la votación</button></section>`;
      if (s.estado === "votacion") return `<section class="pagina"><span class="cap">Votación</span><p data-vivo="votos"></p><div class="mecha-fila"><div class="mecha"><i></i></div><span class="segundos" data-vivo="tiempo"></span></div><button class="boton rojo" data-accion="revelar">Revelar al villano</button></section>`;
      const r = TIPOS.infiltrado.resumen_(ctx);
      return `<section class="pagina"><span class="cap">Revelación</span><h2 class="titulo chico">${r.villanos.length > 1 ? "Los infiltrados eran" : "El infiltrado era"}</h2><ul class="chips">${r.villanos.map((id) => chipAgente(ctx.S, id, r.atrapados.includes(id) ? "fuera" : "yo")).join("")}</ul>` +
        `<p>El villano secreto era <b>${esc(r.palabra)}</b>.</p><button class="boton rojo" data-accion="cerrar-ya">Dar puntos</button></section>`;
    },
    actualizar(ctx, raiz) {
      const s = ctx.m.sub;
      if (s.fin) {
        const t = $('[data-vivo="tiempo"]', raiz); if (t) t.textContent = reloj(s.fin - ctx.ahora());
        const i = $(".mecha i", raiz); if (i) i.style.width = clamp(((s.fin - ctx.ahora()) / (s.dur || 1)) * 100, 0, 100) + "%";
      }
      const v = $('[data-vivo="votos"]', raiz);
      if (v) v.textContent = `Votaron ${Object.keys((ctx.mj && ctx.mj.votos) || {}).length} de ${s.jugadores.length}.`;
    },
    click(accion, el, ctx) {
      const min = Number((ctx.m.cfg || {}).minutos) || 3;
      if (accion === "charla") ctx.T.actualizar("mision", { "sub/estado": "charla", "sub/fin": ctx.ahora() + min * 60000, "sub/dur": min * 60000 });
      if (accion === "votar") ctx.T.actualizar("mision", { "sub/estado": "votacion", "sub/fin": ctx.ahora() + 60000, "sub/dur": 60000 });
      if (accion === "revelar") { ctx.T.actualizar("mision", { "sub/estado": "revelacion", "sub/fin": null }); Sonido.tocar("redoble"); }
      if (accion === "cerrar-ya") ctx.cerrarMision();
    },
    tic(ctx) {
      const s = ctx.m.sub, ahora = ctx.ahora();
      if (s.estado === "charla" && ahora > s.fin) ctx.T.actualizar("mision", { "sub/estado": "votacion", "sub/fin": ahora + 60000, "sub/dur": 60000 });
      if (s.estado === "votacion") {
        const votos = (ctx.mj && ctx.mj.votos) || {};
        if (ahora > s.fin || s.jugadores.every((id) => votos[id])) { ctx.T.actualizar("mision", { "sub/estado": "revelacion", "sub/fin": null }); Sonido.tocar("redoble"); }
      }
    },
  },
  jugador: {
    clave(ctx) {
      const s = ctx.m.sub;
      if (!s.jugadores.includes(ctx.yo)) return "fuera";
      const voto = ((ctx.mj && ctx.mj.votos) || {})[ctx.yo];
      return `${s.estado}:${voto ? "v" : ""}`;
    },
    html(ctx) {
      const s = ctx.m.sub;
      if (!s.jugadores.includes(ctx.yo)) return `<section class="pagina"><span class="cap">En curso</span><p>Esta misión empezó sin ti. Espera la siguiente.</p></section><button class="boton bloque" data-accion="cuartel">Volver al cuartel</button>`;
      const rol = ((ctx.mj && ctx.mj.roles) || {})[ctx.yo];
      const secreto = rol === "v"
        ? botonSecreto(`<p class="palabra">¡Eres el infiltrado!</p><p>No sabes qué villano anda suelto. Escucha las pistas, disimula y trata de adivinarlo.</p>`)
        : botonSecreto(`<p>Eres de la Liga. El villano que anda suelto es:</p><p class="palabra">${esc(revelar(s.palabra))}</p><p>Da pistas sin decir su nombre.</p>`);
      if (s.estado === "roles") return `<section class="pagina"><span class="cap">Tu secreto</span><p>Míralo sin que nadie vea tu pantalla.</p>${secreto}</section><p class="centro nota">Espera a que el anfitrión diga que empiecen a conversar.</p>`;
      if (s.estado === "charla") return `<section class="pagina"><span class="cap">A conversar</span><p>Den pistas y háganse preguntas sobre el villano, sin decir su nombre. El infiltrado tratará de disimular.</p><div class="mecha-fila"><div class="mecha"><i></i></div><span class="segundos" data-vivo="tiempo"></span></div></section><section class="pagina"><span class="cap">Tu secreto</span>${secreto}</section>`;
      if (s.estado === "votacion") {
        const voto = ((ctx.mj && ctx.mj.votos) || {})[ctx.yo];
        if (voto) return `<section class="pagina"><span class="cap">Votaste</span><p>Votaste por <b>${esc(nombreDe(ctx.S, voto))}</b>. Esperando a los demás…</p></section>`;
        const otros = s.jugadores.filter((id) => id !== ctx.yo && ctx.S.agentes[id]);
        return `<section class="pagina"><span class="cap">¿Quién es el infiltrado?</span><div class="mecha-fila"><div class="mecha"><i></i></div><span class="segundos" data-vivo="tiempo"></span></div>` +
          (rol === "v" ? `<div class="campo-grupo"><label class="etiqueta" for="adivina">¿Qué villano crees que era? Si aciertas, ganas 100 más</label><input class="campo" id="adivina" autocomplete="off"></div>` : "") +
          `<div class="lista-objetivos">${otros.map((id) => `<button class="boton blanco" data-accion="votar" data-id="${id}">${esc(nombreDe(ctx.S, id))}</button>`).join("")}</div></section>`;
      }
      const r = TIPOS.infiltrado.resumen_(ctx);
      const soyV = rol === "v";
      const gane = soyV ? !r.atrapados.includes(ctx.yo) : r.villanos.includes(r.votos[ctx.yo]);
      return `<div class="estallido ${gane ? "" : "rojo"}"><div><strong>${gane ? "¡Bien hecho!" : "¡Fallaste!"}</strong></div></div>` +
        `<section class="pagina"><span class="cap">Revelación</span><p>${r.villanos.length > 1 ? "Los infiltrados eran" : "El infiltrado era"}: <b>${r.villanos.map((id) => esc(nombreDe(ctx.S, id))).join(" y ")}</b>.</p><p>El villano secreto era <b>${esc(r.palabra)}</b>.</p></section>`;
    },
    actualizar(ctx, raiz) {
      const s = ctx.m.sub;
      if (!s.fin) return;

      const i = $(".mecha i", raiz); if (i) i.style.width = clamp(((s.fin - ctx.ahora()) / (s.dur || 1)) * 100, 0, 100) + "%";

    efectos(ctx, clave) { if (clave.startsWith("revelacion")) Sonido.tocar("revelar"); },
  },
};

/* ---------- La bomba de la Liga: papa caliente con preguntas ---------- */
function preguntaBomba(evitar) {
  const posibles = PREGUNTAS.map((_, i) => i).filter((i) => (PREGUNTAS[i].d || 2) <= 2 && i !== evitar);
  return posibles[Math.floor(Math.random() * posibles.length)];
}
function destinoBomba(jugadores, S, yo, de) {
  const otros = jugadores.filter((id) => id !== yo && S.agentes[id]);
  const posibles = otros.length > 1 ? otros.filter((id) => id !== de) : otros;
  return posibles[Math.floor(Math.random() * posibles.length)];
}
function opcionesBomba(b) {
  const q = PREGUNTAS[b.q] || PREGUNTAS[0];
  const orden = b.o || [0, 1, 2, 3];
  return { q, opciones: orden.map((i) => q.opciones[i]), correcta: orden.indexOf(q.correcta) };
}
const PUNTOS_BOMBA = 50;
TIPOS.bomba = {
  id: "bomba", nombre: "La bomba de la Liga", icono: "bomba", cat: "fiesta", usaSala: true,
  resumen: "Papa caliente con preguntas: respóndela bien para que la bomba salte a otro. A quien le explota, pierde puntos.",
  ayuda: `Si te cae la bomba, tu celular suena y te sale una pregunta. Respóndela bien y la bomba salta a otro agente al azar; si fallas, te toca otra pregunta. Explota en un momento al azar que nadie conoce. Son 3 bombas: a quien le explote en las manos se le restan ${PUNTOS_BOMBA} puntos.`,
  campos: [],
  nuevaBomba(ctx, k, jugadores, evitar) {
    const posibles = jugadores.filter((id) => id !== evitar && ctx.S.agentes[id]);
    const holder = posibles[Math.floor(Math.random() * posibles.length)] || jugadores[0];
    const inicio = ctx.ahora() + 2500;
    ctx.T.escribir(`mj/${ctx.m.id}/bomba`, { k, holder, de: "", t: inicio, q: preguntaBomba(-1), o: barajar([0, 1, 2, 3]) });
    return { k, inicio, explota: inicio + azar(30000, 90000) };
  },
  empezar(ctx) {
    const jugadores = listosDe(ctx);
    if (jugadores.length < 2) { avisar("Se necesitan al menos 2 agentes listos."); return false; }
    const b = this.nuevaBomba(ctx, 1, jugadores, "");
    ctx.T.actualizar("mision", { fase: "juego", sub: { estado: "bomba", jugadores, k: 1, inicio: b.inicio, explota: b.explota, victimas: {} } });
    return true;
  },
  cerrar(ctx) {
    const s = ctx.m.sub, vict = Object.values(s.victimas || {});
    const mult = ctx.m.doble ? 2 : 1;
    const filas = s.jugadores.filter((id) => ctx.S.agentes[id]).map((id) => {
      const quemado = vict.filter((v) => v === id).length;
      // Se restan 50 por explosión, sin bajar de cero (premiar multiplica por 2 si vale doble).
      const tiene = Math.max(0, totalDe(ctx.S, id));
      const resta = Math.min(quemado * PUNTOS_BOMBA * mult, tiene);
      const pts = -Math.floor(resta / mult);
      const txt = !quemado ? "¡se salvó!" : `le explotó ${quemado === 1 ? "una vez" : quemado + " veces"}${resta < quemado * PUNTOS_BOMBA * mult ? (tiene ? " (perdió lo que tenía)" : " (no tenía puntos)") : ""}`;
      return { id, pts, txt };
    }).sort((a, b) => b.pts - a.pts);
    ctx.premiar(filas, true);
  },
  detalleHistorial(ctx) {
    const v = Array.from(new Set(Object.values((ctx.m.sub && ctx.m.sub.victimas) || {})));
    return v.length ? `Explotó a ${v.map((id) => nombreDe(ctx.S, id)).join(", ")}` : "";
  },
  host: {
    clave(ctx) { const s = ctx.m.sub; return `${s.k}:${s.estado}`; },
    html(ctx) {
      const s = ctx.m.sub;
      if (s.estado === "pausa") return `<section class="pagina"><span class="cap">¡BOOM!</span><h2 class="titulo chico">Le explotó a ${esc(nombreDe(ctx.S, s.victimas["b" + s.k]))}</h2><p>Pierde ${PUNTOS_BOMBA} puntos. ${s.k < 3 ? "La siguiente bomba sale en unos segundos." : "Fue la última bomba."}</p></section>`;
      return `<section class="pagina"><span class="cap">Bomba ${s.k} de 3</span><p data-vivo="quien"></p><p class="suave">Explota sola en un momento al azar. Puedes leer la pregunta en voz alta para darle suspenso.</p><div data-vivo="pregunta"></div>` +
        `<button class="boton blanco" data-accion="cerrar-ya">Terminar y dar puntos</button></section>`;
    },
    actualizar(ctx, raiz) {
      const b = (ctx.mj && ctx.mj.bomba) || {};
      const q = $('[data-vivo="quien"]', raiz);
      if (q) { const h = `La tiene: <b>${esc(nombreDe(ctx.S, b.holder))}</b>`; if (q.dataset.h !== h) { q.dataset.h = h; q.innerHTML = h; } }
      const p = $('[data-vivo="pregunta"]', raiz);
      if (p && b.q !== undefined) {
        const { q: preg, opciones, correcta } = opcionesBomba(b);
        const h = `<p class="pregunta-texto">${esc(preg.pregunta)}</p><p class="suave">Respuesta: <b>${esc(opciones[correcta])}</b></p>`;
        if (p.dataset.h !== h) { p.dataset.h = h; p.innerHTML = h; }
      }
    },
    click(accion, el, ctx) { if (accion === "cerrar-ya") ctx.cerrarMision(); },
    tic(ctx) {
      const s = ctx.m.sub, ahora = ctx.ahora(), b = (ctx.mj && ctx.mj.bomba) || {};
      if (s.estado === "bomba" && ahora > s.explota + 600 && ctx.local.explotada !== s.k) {
        ctx.local.explotada = s.k;
        const victimas = Object.assign({}, s.victimas || {}, { ["b" + s.k]: b.holder });
        ctx.T.actualizar("mision", { "sub/estado": "pausa", "sub/victimas": victimas, "sub/hasta": ahora + 6000 });
        Sonido.tocar("boom");
      }
      if (s.estado === "pausa" && ahora > s.hasta && ctx.local.siguiente !== s.k) {
        ctx.local.siguiente = s.k;
        if (s.k >= 3) { ctx.cerrarMision(); return; }
        const nb = TIPOS.bomba.nuevaBomba(ctx, s.k + 1, s.jugadores, s.victimas["b" + s.k]);
        ctx.T.actualizar("mision", { "sub/estado": "bomba", "sub/k": nb.k, "sub/inicio": nb.inicio, "sub/explota": nb.explota });
      }
    },
  },
  jugador: {
    clave(ctx) {
      const s = ctx.m.sub, b = (ctx.mj && ctx.mj.bomba) || {};
      if (!s.jugadores.includes(ctx.yo)) return "fuera";
      if (s.estado === "pausa") return `pausa:${s.k}`;

      const dibujo = `<svg class="bomba tiembla" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11.3" fill="#ffd21f" stroke="#16130f" stroke-width="1"/><g transform="translate(3.6 3.4) scale(0.7)"><path d="${ICONOS.bomba}" fill="#16130f" fill-rule="evenodd"/></g></svg>`;
      if (s.estado === "pausa" || ctx.ahora() >= s.explota) {

          `<p class="centro">${yo ? `Te explotó en las manos: pierdes ${PUNTOS_BOMBA} puntos.` : `Le explotó a ${esc(nombreDe(ctx.S, victima))}: pierde ${PUNTOS_BOMBA} puntos. ¡Tú te salvaste!`}</p>` +
          `<p class="centro nota">${s.k < 3 ? "Atento: viene otra bomba." : "Esa fue la última bomba."}</p>`;
      }
      if (b.q === undefined) return `<p class="centro latido">Encendiendo la mecha…</p>`;
      const { q, opciones } = opcionesBomba(b);
      if (b.holder === ctx.yo) {
        const castigo = (ctx.local.castigo || 0) > Date.now();
        return `<div class="alarma-bomba"><div class="estallido rojo latido"><div><strong>¡TIENES LA BOMBA!</strong></div></div>${dibujo}</div>` +
          `<section class="pagina"><span class="cap roja">¡Respóndela y se va!</span><p class="pregunta-texto">${esc(q.pregunta)}</p>` +
          `<div class="opciones">${opciones.map((t, i) => `<button class="opcion" data-o="${i}" data-accion="responder-bomba"${castigo ? " disabled" : ""}>${FORMAS_OPCION[i]}<span>${esc(t)}</span></button>`).join("")}</div>` +
          `<p class="error" data-vivo="error" role="alert">${castigo ? "¡Incorrecto! Ya te toca otra pregunta…" : ""}</p></section>`;
      }
      return `<section class="pagina"><span class="cap">Bomba ${s.k} de 3</span><p>La tiene <b>${esc(nombreDe(ctx.S, b.holder))}</b>. Está respondiendo:</p>` +
        `<p class="pregunta-texto">${esc(q.pregunta)}</p><div class="opciones mirando">${opciones.map((t, i) => `<div class="opcion" data-o="${i}">${FORMAS_OPCION[i]}<span>${esc(t)}</span></div>`).join("")}</div></section>` +
        `${dibujo}<p class="centro nota">Si la bomba te cae a ti, tu celular suena.</p>`;
    },
    actualizar(ctx) {
      const s = ctx.m.sub, b = (ctx.mj && ctx.mj.bomba) || {};
      // Mientras tengas la bomba, suena un tic-tac (no depende de la vibración, que los iPhone no tienen).
      if (b.holder === ctx.yo && s.estado === "bomba" && ctx.ahora() < s.explota && ctx.ahora() >= s.inicio) {
        const L = ctx.local;
        if (!L.tic || performance.now() - L.tic > 650) { L.tic = performance.now(); Sonido.tocar("tictac"); }
      }
    },
    click(accion, el, ctx) {
      if (accion !== "responder-bomba") return;
      const s = ctx.m.sub, b = (ctx.mj && ctx.mj.bomba) || {}, L = ctx.local;
      if (b.holder !== ctx.yo || ctx.ahora() >= s.explota || (L.castigo || 0) > Date.now()) return;
      const { correcta } = opcionesBomba(b);
      if (Number(el.dataset.o) === correcta) {
        const destino = destinoBomba(s.jugadores, ctx.S, ctx.yo, b.de);
        if (!destino) return;
        ctx.T.escribir(`mj/${ctx.m.id}/bomba`, { k: s.k, holder: destino, de: ctx.yo, t: ctx.ahora(), q: preguntaBomba(b.q), o: barajar([0, 1, 2, 3]) });
        Sonido.tocar("exito");
        vibrar(30);
        avisar(`¡Bien! La bomba saltó a ${nombreDe(ctx.S, destino)}`, ctx.capaAvisos());
        return;
      }
      // Respuesta equivocada: 2 segundos de castigo y otra pregunta.
      L.castigo = Date.now() + 2000;
      Sonido.tocar("error");
      vibrar(150);
      ctx.pintar();
      const id = ctx.m.id, k = s.k, q = b.q;
      setTimeout(() => {
        const f = ctx.fresco(), bb = (f.mj && f.mj.bomba) || {};
        if (f.m && f.m.id === id && bb.holder === f.yo && bb.k === k && bb.q === q) f.T.actualizar(`mj/${id}/bomba`, { q: preguntaBomba(q), o: barajar([0, 1, 2, 3]) });
        else f.pintar();
      }, 2000);
    },
    efectos(ctx, clave) {
      if (/:tengo:/.test(clave)) {
        // Suena una vez cada vez que la bomba te cae (no cuando solo cambia la pregunta).
        const llegada = clave.split(":").slice(0, 4).join(":");
        if (ctx.local.avisoTengo !== llegada) {
          ctx.local.avisoTengo = llegada;
          vibrar([200, 100, 200, 100, 200]);
          Sonido.tocar("alerta");
        }
      }
      if (clave.startsWith("boom") || clave.startsWith("pausa")) {
        const s = ctx.m.sub;
        const v = s.estado === "pausa" ? s.victimas["b" + s.k] : ((ctx.mj || {}).bomba || {}).holder;
        if (v === ctx.yo) vibrar(700);
        if (!ctx.local["boom" + s.k]) { ctx.local["boom" + s.k] = true; Sonido.tocar("boom"); }
      }
    },
  },
};

/* ---------- Bingo de la Liga: el anfitrión canta superhéroes ---------- */
const LINEAS_BINGO = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
const posicionBingo = (j) => (j < 4 ? j : j + 1); // el centro (4) es Salvador
function caraSalvadorHTML(clase) {
  const src = CONFIG.imagenes && CONFIG.imagenes.cara;
  return src ? `<img class="${clase || "cara-salva"}" src="${esc(src)}" alt="Salvador">` : `<span class="${clase || "cara-salva"} sin-foto">S</span>`;
}
function estadoBingo(marcas) {
  const m = Object.assign({ c4: true }, marcas || {});
  const linea = LINEAS_BINGO.some((l) => l.every((c) => m["c" + c]));
  const n = Object.keys(marcas || {}).length;
  return { linea, lleno: n >= 8, n };
}
TIPOS.bingo = {
  id: "bingo", nombre: "Bingo de la Liga", icono: "bingo", cat: "fiesta",
  resumen: "Tú cantas superhéroes y ellos los marcan en su cartón. El centro es Salvador.",
  ayuda: "El anfitrión canta superhéroes. Si el que cantan está en tu cartón, tócalo para marcarlo. El centro es Salvador y ya viene marcado. Gana quien llene su cartón primero.",
  campos: [{ id: "modo", tipo: "opciones", etiqueta: "¿Quién canta?", opciones: [["manual", "Yo, con un botón"], ["auto", "Solo, cada 10 s"]], defecto: "manual" }],
  lanzar(cfg) { return { mision: { fase: "juego", sub: { cantadas: [], modo: cfg.modo === "auto" ? "auto" : "manual", cada: 10000 } } }; },
  cantar(ctx) {
    const s = ctx.m.sub, ya = s.cantadas || [];
    if (ya.length >= HEROES_BINGO.length) return;
    if (ctx.local.cantando && Date.now() - ctx.local.cantando < 900) return;
    ctx.local.cantando = Date.now();
    const libres = HEROES_BINGO.map((_, i) => i).filter((i) => !ya.includes(i));
    const i = libres[Math.floor(Math.random() * libres.length)];
    ctx.T.actualizar("mision", { "sub/cantadas": ya.concat([i]), "sub/ultimo": i, "sub/tUltimo": ctx.ahora() });
    Sonido.tocar("toque");
  },
  tabla(ctx) {
    const cartones = (ctx.mj && ctx.mj.carton) || {}, marcas = (ctx.mj && ctx.mj.marcas) || {};
    const lineas = (ctx.mj && ctx.mj.linea) || {}, llenos = (ctx.mj && ctx.mj.lleno) || {};
    return Object.keys(cartones).filter((id) => ctx.S.agentes[id]).map((id) => {
      const n = Object.keys(marcas[id] || {}).length;
      const v = llenos[id] ? llenos[id] : lineas[id] ? 1e13 + lineas[id] : 2e13 - n;
      return { id, v, n, linea: lineas[id], lleno: llenos[id] };
    });
  },
  cerrar(ctx) {
    ctx.premiar(rankear(this.tabla(ctx), true, 1).map((e) => ({ id: e.id, pos: e.pos, pts: e.pts, txt: e.lleno ? `¡bingo! a los ${marcaTiempo(ctx, e.lleno)}` : e.linea ? `línea y ${plural(e.n, "casilla", "casillas")}` : plural(e.n, "casilla", "casillas") })));
  },
  host: {
    clave(ctx) { return `bingo:${(ctx.m.sub.cantadas || []).length}`; },
    html(ctx) {
      const s = ctx.m.sub, ya = s.cantadas || [];
      const ultimo = ya.length ? HEROES_BINGO[s.ultimo] : null;
      return `<section class="pagina"><span class="cap">Cantados: ${ya.length} de ${HEROES_BINGO.length}</span>` +
        (ultimo ? `<p class="suave">Léelo en voz alta:</p><p class="cantado">${esc(ultimo)}</p>` : `<p>Toca «¡Cantar!» y lee en voz alta el superhéroe que salga.</p>`) +
        (s.modo === "auto" ? `<p class="suave">Modo automático: sale uno cada 10 segundos.</p>` : `<button class="boton rojo grande" data-accion="cantar">¡Cantar!</button>`) +
        `<ul class="chips cantados">${ya.slice().reverse().map((i) => `<li><span>${esc(HEROES_BINGO[i])}</span></li>`).join("")}</ul></section>` +
        `<section class="pagina"><span class="cap">Cómo van</span><div data-vivo="lista"></div><button class="boton blanco" data-accion="cerrar-ya">Cerrar y dar puntos</button></section>`;
    },
    actualizar(ctx, raiz) {
      const l = $('[data-vivo="lista"]', raiz);
      if (!l) return;
      const filas = rankear(TIPOS.bingo.tabla(ctx), true, 1).slice(0, 12).map((e) => ({ id: e.id, pos: e.pos, txt: e.lleno ? "¡BINGO!" : e.linea ? `línea · ${e.n}/8` : `${e.n}/8` }));
      const h = filas.length ? tablaParcial(ctx.S, filas) : `<p class="suave">Repartiendo cartones…</p>`;
      if (l.dataset.h !== h) { l.dataset.h = h; l.innerHTML = h; }
    },
    click(accion, el, ctx) {
      if (accion === "cantar") TIPOS.bingo.cantar(ctx);
      if (accion === "cerrar-ya") ctx.cerrarMision();
    },
    tic(ctx) {
      const s = ctx.m.sub, ahora = ctx.ahora(), ya = s.cantadas || [];
      if (s.modo === "auto" && ya.length < HEROES_BINGO.length && ahora - (s.tUltimo || 0) > (s.cada || 10000)) TIPOS.bingo.cantar(ctx);
      const llenos = Object.values((ctx.mj && ctx.mj.lleno) || {});
      if (llenos.length && ahora - Math.min(...llenos) > 8000) ctx.cerrarMision();
      if (ya.length >= HEROES_BINGO.length && ahora - (s.tUltimo || 0) > 20000) ctx.cerrarMision();
    },
  },
  jugador: {
    entrar(ctx) {
      if (((ctx.mj && ctx.mj.carton) || {})[ctx.yo]) return;
      ctx.T.escribir(`mj/${ctx.m.id}/carton/${ctx.yo}`, barajar(HEROES_BINGO.map((_, i) => i)).slice(0, 8));
    },
    clave(ctx) {
      const carton = (((ctx.mj && ctx.mj.carton) || {})[ctx.yo]);
      const marcas = (((ctx.mj && ctx.mj.marcas) || {})[ctx.yo]) || {};
      const llenos = Object.keys((ctx.mj && ctx.mj.lleno) || {}).sort().join(",");
      return `${carton ? 1 : 0}:${(ctx.m.sub.cantadas || []).length}:${Object.keys(marcas).sort().join(",")}:${(((ctx.mj && ctx.mj.linea) || {})[ctx.yo]) ? "L" : ""}:${llenos}`;
    },
    html(ctx) {
      const carton = (((ctx.mj && ctx.mj.carton) || {})[ctx.yo]);
      if (!carton) return `<p class="centro latido">Repartiendo tu cartón…</p>`;
      const s = ctx.m.sub, ya = s.cantadas || [];
      const marcas = (((ctx.mj && ctx.mj.marcas) || {})[ctx.yo]) || {};
      const lineas = (ctx.mj && ctx.mj.linea) || {}, llenos = (ctx.mj && ctx.mj.lleno) || {};
      const celdas = [];
      for (let pos = 0, j = 0; pos < 9; pos++) {

        const h = carton[j++];
        celdas.push(`<button class="casilla ${marcas["c" + pos] ? "marcada" : ""}" data-accion="marcar" data-pos="${pos}" data-h="${h}"><span>${esc(HEROES_BINGO[h])}</span></button>`);
      }

      const cabeza = llenos[ctx.yo] ? `<div class="estallido"><div><strong>¡BINGO!</strong><b>¡Cartón lleno!</b></div></div>`
        : primero ? `<div class="globo"><strong>¡BINGO de ${esc(nombreDe(ctx.S, primero[0]))}!</strong> El bingo está por cerrarse.</div>`

      return cabeza + `<section class="pagina"><span class="cap">Cantaron</span><p class="cantado">${ya.length ? esc(HEROES_BINGO[s.ultimo]) : "Todavía nada"}</p><p class="suave">${ya.length} de ${HEROES_BINGO.length} cantados</p></section>` +
        `<section class="pagina"><span class="cap">Tu cartón</span><div class="carton">${celdas.join("")}</div><p class="error" data-vivo="error" role="alert"></p></section>` +
        `<button class="enlace" data-accion="cuartel">Volver al cuartel</button>`;
    },
    click(accion, el, ctx) {

      const h = Number(el.dataset.h), pos = Number(el.dataset.pos);
      const ya = ctx.m.sub.cantadas || [];

      }
      const marcas = Object.assign({}, (((ctx.mj && ctx.mj.marcas) || {})[ctx.yo]) || {}, { ["c" + pos]: true });
      ctx.T.escribir(`mj/${ctx.m.id}/marcas/${ctx.yo}/c${pos}`, true);
      const e = estadoBingo(marcas);

      if (e.lleno && !llenos[ctx.yo]) { ctx.T.escribir(`mj/${ctx.m.id}/lleno/${ctx.yo}`, ctx.ahora()); vibrar([60, 40, 60, 40, 200]); Sonido.tocar("fanfarria"); }
      else if (e.linea && !lineas[ctx.yo]) { ctx.T.escribir(`mj/${ctx.m.id}/linea/${ctx.yo}`, ctx.ahora()); vibrar([60, 40, 60]); Sonido.tocar("exito"); }

    },
    efectos(ctx, clave) {
      const n = (ctx.m.sub.cantadas || []).length;
      if (ctx.local.cantadas !== undefined && n > ctx.local.cantadas) { Sonido.tocar("campana"); vibrar(40); }
      ctx.local.cantadas = n;
      void clave;
    },
  },
};

/* ---------- Códigos de agente: 3 cifras, sin repetir ---------- */
async function asignarCodigo(T, id) {
  for (let i = 0; i < 40; i++) {
    const c = String(azarEntero(100, 999));
    const r = await T.transaccion(`codigos/${c}`, (a) => (a ? undefined : id));
    if (r.hecho && r.valor === id) return c;
  }
  throw new Error("No hay códigos libres");
}

/* ---------- Robo de puntos: duelos de reflejos ---------- */
const DUELO_ACEPTAR_MS = 30000; // tiempo para aceptar un reto
const DUELO_PREPARAR_MS = 30000; // tiempo para practicar y tocar «¡Listo!» antes de que arranque solo
const DUELO_TOQUE_MS = 6000; // después del ¡YA!, tiempo máximo para tocar
const DUELO_VIGENTE_MS = 120000; // un duelo resuelto se sigue mostrando hasta 2 minutos

function totalDe(S, id) { return Number((S.totales || {})[id]) || 0; }
function dueloActivoDe(S, id) {
  for (const [did, d] of Object.entries(S.duelos || {})) {
    if (d && (d.de === id || d.a === id) && (d.estado === "pendiente" || d.estado === "aceptado")) return [did, d];
  }
  return null;
}
function enfriamientoHasta(S, de, a) { return Number(((S.enfriamiento || {})[de] || {})[a]) || 0; }
function apuestaDuelo(S, a, b) { return Math.max(0, Math.min(CONFIG.puntosDuelo, totalDe(S, a), totalDe(S, b))); }

// ¿Puedo retar yo a este agente ahora? -> { ok, motivo }
function puedoRetar(S, yo, otro, ahora) {
  const a = S.agentes && S.agentes[otro];
  if (!a || !a.nombre || otro === yo) return { ok: false, motivo: "" };
  const hasta = enfriamientoHasta(S, yo, otro);
  if (hasta > ahora) return { ok: false, motivo: `podrás retarlo en ${reloj(hasta - ahora)}` };
  if (a.conectado === false) return { ok: false, motivo: "sin conexión" };
  if (a.ocupado) return { ok: false, motivo: "está en una misión" };
  if (dueloActivoDe(S, otro)) return { ok: false, motivo: "está en otro duelo" };
  if (totalDe(S, otro) < 1) return { ok: false, motivo: "todavía no tiene puntos" };
  return { ok: true, motivo: `${fmt(apuestaDuelo(S, yo, otro))} puntos en juego` };
}
// ¿Puedo retar a alguien? (mirando solo mi lado)
function puedoRetarYo(S, yo) {
  const a = S.agentes && S.agentes[yo];
  if (!a) return { ok: false, motivo: "" };
  if (S.final) return { ok: false, motivo: "Los duelos se cerraron: llegó la gran final." };
  if (totalDe(S, yo) < 1) return { ok: false, motivo: "Gana puntos en una misión para poder apostar en un duelo." };
  if (a.ocupado) return { ok: false, motivo: "Termina tu misión y luego reta a quien quieras." };
  if (dueloActivoDe(S, yo)) return { ok: false, motivo: "Ya tienes un duelo en curso." };
  return { ok: true, motivo: "" };
}

const PASOS_DUELO = [
  "Primero practica abajo: no cuenta.",
  "En el duelo, la pantalla se pone oscura: espera con el dedo listo.",
  "Cuando se ponga AMARILLA, toca. Si tocas antes, te avisamos una vez; la segunda, pierdes.",
];
function crearDuelo(T, S, de, a) {
  const did = nuevoId("d");
  T.escribir(`duelos/${did}`, { de, a, estado: "pendiente", creado: T.ahora(), apuesta: apuestaDuelo(S, de, a) });
  return did;
}
function cambiarDuelo(T, did, desde, cambios) {
  return T.transaccion(`duelos/${did}`, (d) => {
    if (!d) return null;
    if (desde && d.estado !== desde) return undefined;
    return Object.assign({}, d, typeof cambios === "function" ? cambios(d) : cambios);
  });
}
// Al aceptar, los dos practican y tocan «¡Listo!». El duelo arranca cuando ambos están listos
// (o solo, pasado el tiempo de preparación).
function aceptarDuelo(T, did) {
  return cambiarDuelo(T, did, "pendiente", () => ({ estado: "aceptado", aceptadoT: T.ahora() }));
}
function marcarListoDuelo(T, did, id) {
  return cambiarDuelo(T, did, "aceptado", (d) => {
    const listo = Object.assign({}, d.listo || {}, { [id]: true });
    const cambios = { listo };
    if (!d.go && listo[d.de] && listo[d.a]) cambios.go = T.ahora() + 2500 + azar(600, 2600);
    return cambios;
  });
}
function largarDuelo(T, did) {
  return cambiarDuelo(T, did, "aceptado", (d) => (d.go ? {} : { go: T.ahora() + 3000 + azar(400, 1600), forzado: true }));
}
function rechazarDuelo(T, did, estado) {
  return cambiarDuelo(T, did, "pendiente", { estado: estado || "rechazado", cerrado: T.ahora() }).then((r) => {
    const d = r.valor;
    if (r.hecho && d && (d.estado === "rechazado" || d.estado === "expirado")) {
      T.escribir(`enfriamiento/${d.de}/${d.a}`, T.ahora() + CONFIG.esperaTrasRechazoMin * 60000);
    }
    return r;
  });
}
function cancelarDuelo(T, did) { return cambiarDuelo(T, did, "pendiente", { estado: "cancelado", cerrado: T.ahora() }); }

function ganadorDuelo(d) {
  const r = d.r || {};
  const ta = Number(r[d.de]), tb = Number(r[d.a]);
  const va = ta > 0, vb = tb > 0;
  if (va && vb) return ta < tb ? d.de : tb < ta ? d.a : "";
  if (va) return d.de;
  if (vb) return d.a;
  return "";
}
function dueloListo(d, ahora) {
  const r = d.r || {};
  return d.estado === "aceptado" && !!d.go && ((r[d.de] !== undefined && r[d.a] !== undefined) || ahora > d.go + DUELO_TOQUE_MS);
}
// Cierra el duelo una sola vez (transacción) y mueve los puntos.
function resolverDuelo(T, S, did, quien) {
  return T.transaccion(`duelos/${did}`, (d) => {
    if (!d) return null;
    if (d.estado !== "aceptado") return undefined;
    const ganador = ganadorDuelo(d);
    const perdedor = ganador ? (ganador === d.de ? d.a : d.de) : "";
    const robo = ganador ? Math.max(0, Math.min(Number(d.apuesta) || CONFIG.puntosDuelo, totalDe(S, perdedor))) : 0;
    return Object.assign({}, d, { estado: "resuelto", ganador, perdedor, robo, resuelto: T.ahora(), por: quien });
  }).then((res) => {
    const d = res.valor;
    if (!res.hecho || !d || d.estado !== "resuelto" || d.por !== quien) return res;
    if (d.ganador && d.robo > 0) {
      const g = nombreDe(S, d.ganador), p = nombreDe(S, d.perdedor);
      T.actualizar("puntos", {
        [`${d.ganador}/d_${did}`]: { p: d.robo, m: `Duelo: le ganó a ${p}`, t: d.resuelto },
        [`${d.perdedor}/d_${did}`]: { p: -d.robo, m: `Duelo: perdió con ${g}`, t: d.resuelto },
      });
    }
    return res;
  });
}
function duelosRecientes(S, n) {
  return Object.entries(S.duelos || {}).filter(([, d]) => d && d.estado === "resuelto" && d.ganador)
    .map(([did, d]) => Object.assign({ did }, d)).sort((a, b) => b.resuelto - a.resuelto).slice(0, n || 3);
}
function textoDuelo(S, d) {
  const g = esc(nombreDe(S, d.ganador)), p = esc(nombreDe(S, d.perdedor));
  return d.robo > 0 ? `<b>${g}</b> le robó ${fmt(d.robo)} puntos a <b>${p}</b>` : `<b>${g}</b> le ganó un duelo a <b>${p}</b>`;
}

/* ---------- Tabla de posiciones con empates ---------- */
function clasificacion(S) {
  const lista = ordenarAgentes(S.agentes, S.totales);
  let pos = 0;
  lista.forEach((a, i) => { if (i === 0 || lista[i - 1].total !== a.total) pos = i + 1; a.pos = pos; });
  return lista;
}
function tablaClasificacion(lista, yo, limite) {
  let filas = limite ? lista.slice(0, limite) : lista;
  if (yo && limite && !filas.find((a) => a.id === yo)) { const mio = lista.find((a) => a.id === yo); if (mio) filas = filas.concat([mio]); }
  if (!filas.length) return `<p class="suave">Todavía no hay agentes.</p>`;
  return `<ol class="tabla">${filas.map((a) => `<li class="${a.id === yo ? "yo" : ""}"><span class="pos">${a.pos}</span>${poderHTML(a.poder)}<span class="nom">${esc(a.nombre)}</span><span class="val">${fmt(a.total)}</span></li>`).join("")}</ol>`;
}

/* ---------- Podio de la gran final ---------- */
// podio: [{id, nombre, poder, total, pos}] ordenado del 1.º al 3.º; paso: cuántos puestos ya se revelaron (desde el 3.º)
function podioHTML(podio, paso, yo) {
  const n = podio.length;
  const revelado = (i) => i >= n - paso;
  const peldano = (i, clase) => {
    const p = podio[i];
    if (!p) return "";
    const quien = revelado(i)

/* =====================================================================
   AGENTES DE PRUEBA: juegan solos todas las misiones.
   Sirven para ensayar antes de la fiesta y para la demo.
   Solo los mueve el centro de mando que tiene el control.
   ===================================================================== */
const NOMBRES_PRUEBA = [
  "Capitán Papá", "Mamá Maravilla", "Tío Trueno", "Abuela Rayo", "Doctora Risa", "Flash Fernández",
  "Señor Escudo", "Chica Láser", "Primo Invisible", "Madrina Vuelo", "Súper Suegra", "Hulk Gómez",
];

function crearBots(T, S, opc) {
  opc = opc || {};
  const plan = new Map(); // clave -> momento en que toca actuar, o true si ya actuó, o null si nunca
  function cuando(clave, crear) { if (!plan.has(clave)) plan.set(clave, crear()); return plan.get(clave); }
  function toca(clave, ahora, crear) {
    const v = cuando(clave, crear);
    if (v === true || v === null || v === undefined) return false;
    if (ahora >= v) { plan.set(clave, true); return true; }
    return false;
  }
  const alAzar = (lista) => lista[Math.floor(Math.random() * lista.length)];
  const bots = () => agentesValidos(S.agentes).filter((a) => a.bot);
  const esBot = (id) => !!(S.agentes && S.agentes[id] && S.agentes[id].bot);

  async function agregar(n, extra) {
    const usados = new Set(agentesValidos(S.agentes).map((a) => normalizar(a.nombre)));
    const libres = NOMBRES_PRUEBA.filter((x) => !usados.has(normalizar(x)));
    const creados = [];
    for (let i = 0; i < n; i++) {
      const nombre = libres[i] || `Agente de prueba ${azarEntero(10, 99)}`;
      const id = nuevoId("b");
      const codigo = await asignarCodigo(T, id);
      await T.escribir(`agentes/${id}`, Object.assign({
        nombre, poder: alAzar(PODERES).id, codigo, unido: T.ahora() - (n - i), conectado: true,
        bot: Number(azar(0.3, 0.95).toFixed(2)),
      }, extra || {}));
      creados.push(id);
    }
    return creados;
  }
  async function quitar() {
    for (const a of bots()) {
      await T.borrar(`agentes/${a.id}`);
      await T.borrar(`puntos/${a.id}`);
      if (a.codigo) await T.borrar(`codigos/${a.codigo}`);
    }
  }

  /* ---------- resultados creíbles para los minijuegos ---------- */
  function valorSolo(tipo, s) {
    let v = 0, v2 = 0;
    switch (tipo) {
      case "reflejos": v = Math.round(470 - 210 * s + azar(-35, 35)); break;
      case "supervelocidad": v = Math.round(38 + 42 * s + azar(-5, 5)); break;
      case "villano": v = Math.max(0, Math.round(5 + 15 * s + azar(-3, 3))); break;
      case "reloj": v = Math.round(Math.abs(azar(-1, 1)) * (950 - 880 * s)); break;
      case "memoria": v = Math.max(1, Math.round(3 + 7 * s + azar(-1, 1.4))); v2 = Math.round(v * azar(3200, 4800)); break;
      case "rescate": v = Math.round((36 - 18 * s + azar(-2.5, 2.5)) * 1000); break;
      case "capa": v = clamp(Math.round(42 + 52 * s + azar(-6, 6)), 0, 100); break;
      case "impostor": v = Math.round((28 - 15 * s + azar(-2.5, 2.5)) * 1000); break;
      case "estrellas": v = Math.max(0, Math.round(7 + 28 * s + azar(-4, 4))); break;
      default: v = azarEntero(1, 100);
    }

  }
  function adivinarNumero(pregunta) {
    const p = normalizar(pregunta);
    if (/gramo/.test(p)) return azarEntero(2700, 4000);
    if (/globo/.test(p)) return azarEntero(15, 120);
    if (/invitado|persona/.test(p)) return azarEntero(20, 70);
    if (/caramelo|dulce/.test(p)) return azarEntero(50, 320);
    return azarEntero(5, 200);
  }
  function fotoDePrueba(b, reto) {
    try {
      const c = document.createElement("canvas");
      c.width = 240; c.height = 320;
      const g = c.getContext("2d");
      const tonos = { fuerza: "#d62b1f", rayo: "#ffd21f", vuelo: "#2a5fd0", invisible: "#8e44ad", abrazos: "#e84393", risa: "#ff7a1a", laser: "#00a6b4", escudo: "#27a35a" };
      const fondo = g.createLinearGradient(0, 0, 0, 320);
      fondo.addColorStop(0, tonos[b.poder] || "#2a5fd0");
      fondo.addColorStop(1, "#070d27");
      g.fillStyle = fondo; g.fillRect(0, 0, 240, 320);
      g.save(); g.translate(48, 70); g.scale(6, 6);
      g.fillStyle = "#fffdf4"; g.strokeStyle = "#16130f"; g.lineWidth = 0.6;
      const trazo = new Path2D(ICONOS[b.poder] || ICONOS.estrella);
      g.fill(trazo, "evenodd"); g.stroke(trazo);
      g.restore();
      g.fillStyle = "#fffdf4"; g.font = "bold 22px sans-serif"; g.textAlign = "center";
      g.fillText(b.nombre.slice(0, 18), 120, 260);
      g.font = "14px sans-serif";
      g.fillText(String(reto || "").slice(0, 30), 120, 290);
      return c.toDataURL("image/jpeg", 0.7);
    } catch (e) {
      return "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 4"><rect width="3" height="4" fill="#2a5fd0"/></svg>`);
    }
  }

  /* ---------- cada tic: los agentes de prueba juegan ---------- */
  function paso() {
    const lista = bots();
    if (!lista.length || S.agentes === undefined) return;
    const ahora = T.ahora();
    const m = S.mision;
    if (m && S.mjListo === m.id && TIPOS[m.tipo]) {
      try { mision(m, S.mj || {}, lista, ahora); } catch (e) { console.error(e); }
    }
    try { duelos(lista, ahora); } catch (e) { console.error(e); }
  }

  function mision(m, mj, lista, ahora) {
    const tipo = TIPOS[m.tipo];
    if (m.fase === "sala") {
      for (const b of lista) {
        if (toca(`sala:${m.id}:${b.id}`, ahora, () => (Math.random() < 0.94 ? ahora + azar(900, 6000) : null))) T.escribir(`mj/${m.id}/listos/${b.id}`, T.ahora());

          T.escribir(`mj/${m.id}/res/${b.id}`, valorSolo(m.tipo, b.bot));

      }
      return;
    }
    switch (m.tipo) {
      case "trivia": {

        if (!q) return;
        const listos = mj.listos || {};

          if (toca(`tq:${m.id}:${sub.k}:${b.id}`, ahora, () => (Math.random() < 0.95 ? ini + azar(1300, Math.max(2000, sub.limiteMs * (0.85 - 0.45 * b.bot))) : null))) {
            const acierta = Math.random() < 0.4 + 0.5 * b.bot;
            const buena = correctaMostrada(sub, sub.k);
            const o = acierta ? buena : alAzar([0, 1, 2, 3].filter((x) => x !== buena));
            T.escribir(`mj/${m.id}/resp/q${sub.k}/${b.id}`, { o, ms: clamp(Math.round(T.ahora() - ini), 0, sub.limiteMs) });

      }
      case "relampago": {
        if (ahora < sub.inicio) return;

        for (const b of lista) {
          if (resp[b.id]) continue;
          if (toca(`rl:${m.id}:${b.id}`, ahora, () => (Math.random() < 0.85 ? sub.inicio + azar(2200, Math.max(3000, sub.limiteMs * (0.9 - 0.5 * b.bot))) : null))) {
            const o = Math.random() < 0.35 + 0.5 * b.bot ? correcta : alAzar([0, 1, 2, 3].filter((x) => x !== correcta));
            T.escribir(`mj/${m.id}/resp/${b.id}`, { o, ms: clamp(Math.round(T.ahora() - sub.inicio), 0, sub.limiteMs) });
          }
        }
        return;
      }
      case "cuanto": {
        if (sub.estado !== "abierta") return;
        for (const b of lista) {
          if (toca(`cu:${m.id}:${b.id}`, ahora, () => (Math.random() < 0.92 ? ahora + azar(2500, 30000) : null))) T.escribir(`mj/${m.id}/resp/${b.id}`, { n: adivinarNumero(sub.pregunta), t: T.ahora() });
        }
        return;
      }
      case "foto": {
        for (const b of lista) {
          if (toca(`fo:${m.id}:${b.id}`, ahora, () => (Math.random() < 0.85 ? Math.min(ahora + azar(12000, 90000), (m.cierra || Infinity) - 4000) : null))) {

          }
        }

      }
      case "ultimo": {
        if (sub.estado !== "ronda") return;
        for (const b of lista) {

          const v = cuando(k + ":v", () => (Math.random() < 0.05 ? -1 : Math.round(520 - 250 * b.bot + azar(-60, 60))));

            }
