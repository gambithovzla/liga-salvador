        if (toca(`ch:${m.id}:${sub.ronda}`, ahora, () => (Math.random() < 0.85 ? (sub.inicio || ahora) + azar(7000, 26000) : null))) {
          const b = alAzar(lista);
          T.transaccion(`mj/${m.id}/ganadores/r${sub.ronda}`, (a) => (a ? undefined : { id: b.id, t: T.ahora(), ms: Math.max(0, T.ahora() - (sub.inicio || T.ahora())) }));
        }
        return;
      }
      case "infiltrado": {
        if (sub.estado !== "votacion") return;
        const roles = mj.roles || {}, votos = mj.votos || {}, jug = sub.jugadores || [];
        const villanos = jug.filter((id) => roles[id] === "v");
        for (const b of lista) {
          if (!jug.includes(b.id) || votos[b.id]) continue;
          if (toca(`iv:${m.id}:${b.id}`, ahora, () => ahora + azar(2500, 18000))) {
            const otros = jug.filter((id) => id !== b.id);
            if (!otros.length) continue;
            let voto;
            if (roles[b.id] === "v") {
              voto = alAzar(otros.filter((id) => roles[id] !== "v")) || alAzar(otros);
              T.escribir(`mj/${m.id}/adivina/${b.id}`, Math.random() < 0.35 ? revelar(sub.palabra) : alAzar(PALABRAS_VILLANO));
            } else {
              const sospechosos = villanos.filter((id) => id !== b.id);
              voto = Math.random() < 0.55 && sospechosos.length ? alAzar(sospechosos) : alAzar(otros);
            }
            T.escribir(`mj/${m.id}/votos/${b.id}`, voto);
          }
        }
        return;
      }
      case "bomba": {
        if (sub.estado !== "bomba") return;
        const bomba = mj.bomba || {};
        if (!esBot(bomba.holder) || ahora >= sub.explota || bomba.k !== sub.k || bomba.q === undefined) return;
        const b = S.agentes[bomba.holder];
        const desde = Math.max(Number(bomba.t) || 0, Number(sub.inicio) || 0);
        const clave = `bo:${m.id}:${sub.k}:${bomba.holder}:${bomba.t}:${bomba.q}`;
        // Responde la pregunta: acierta más o menos según su «habilidad»; si falla, le toca otra.
        const acierta = cuando(clave + ":ok", () => Math.random() < 0.45 + 0.4 * (b.bot || 0.5));
        if (toca(clave, ahora, () => Math.max(desde, ahora) + azar(2500, 7000) + (acierta ? 0 : 2000))) {
          if (acierta) {
            const destino = destinoBomba(sub.jugadores || [], S, bomba.holder, bomba.de);
            if (destino) T.escribir(`mj/${m.id}/bomba`, { k: sub.k, holder: destino, de: bomba.holder, t: T.ahora(), q: preguntaBomba(bomba.q), o: barajar([0, 1, 2, 3]) });
          } else T.actualizar(`mj/${m.id}/bomba`, { q: preguntaBomba(bomba.q), o: barajar([0, 1, 2, 3]) });
        }
        return;
      }
      case "agente": {
        const asig = mj.asig || {}, cumple = mj.cumple || {};
        for (const b of lista) {
          if (!asig[b.id]) continue;
          const c = cumple[b.id];
          if (!c || c.estado === "no") {
            if (toca(`ag:${m.id}:${b.id}:${c ? c.t : 0}`, ahora, () => (Math.random() < 0.85 ? ahora + azar(15000, 120000) : null))) {
              T.escribir(`mj/${m.id}/cumple/${b.id}`, { t: T.ahora(), estado: "pendiente" });
            }
          }
        }
        for (const [id, c] of Object.entries(cumple)) {
          if (!c || c.estado !== "pendiente" || !asig[id] || !esBot(asig[id].o)) continue;
          if (toca(`agc:${m.id}:${id}:${c.t}`, ahora, () => ahora + azar(1500, 6000))) T.actualizar(`mj/${m.id}/cumple/${id}`, { estado: Math.random() < 0.88 ? "si" : "no" });
        }
        return;
      }
      case "duo": {
        const grupos = sub.grupos || [], completo = mj.completo || {};
        grupos.forEach((g, i) => {
          if (completo["g" + i]) return;
          const suyos = (g.miembros || []).filter(esBot);
          if (!suyos.length) return;
          const todos = suyos.length === g.miembros.length;
          if (toca(`du:${m.id}:${i}`, ahora, () => ahora + (todos ? azar(15000, 100000) : azar(40000, 110000)))) {
            T.transaccion(`mj/${m.id}/completo/g${i}`, (a) => (a ? undefined : { t: T.ahora(), por: suyos[0] }));
          }
        });
        return;
      }
      case "bingo": {
        const cartones = mj.carton || {}, marcas = mj.marcas || {}, lineas = mj.linea || {}, llenos = mj.lleno || {};
        const ya = sub.cantadas || [];
        for (const b of lista) {
          const carton = cartones[b.id];
          if (!carton) {
            if (toca(`bi0:${m.id}:${b.id}`, ahora, () => (Math.random() < 0.92 ? ahora + azar(800, 5000) : null))) {
              T.escribir(`mj/${m.id}/carton/${b.id}`, barajar(HEROES_BINGO.map((_, i) => i)).slice(0, 8));
            }
            continue;
          }
          if (llenos[b.id]) continue;
          const mias = Object.assign({}, marcas[b.id] || {});
          let cambio = false;
          carton.forEach((h, j) => {
            const pos = posicionBingo(j);
            if (mias["c" + pos] || !ya.includes(h)) return;
            // Los más atentos marcan rápido; alguno se distrae y lo marca tarde (o nunca).
            const demora = () => (Math.random() < 0.88 + 0.1 * b.bot ? ahora + azar(900, 3500) * (1.5 - 0.7 * b.bot) + (Math.random() < 0.12 ? azar(8000, 25000) : 0) : null);
            if (toca(`bim:${m.id}:${b.id}:${pos}`, ahora, demora)) {
              T.escribir(`mj/${m.id}/marcas/${b.id}/c${pos}`, true);
              mias["c" + pos] = true;
              cambio = true;
            }
          });
          if (!cambio) continue;
          const e = estadoBingo(mias);
          if (e.lleno) T.escribir(`mj/${m.id}/lleno/${b.id}`, T.ahora());
          else if (e.linea && !lineas[b.id]) T.escribir(`mj/${m.id}/linea/${b.id}`, T.ahora());
        }
        return;
      }
      default:
    }
  }

  /* ---------- duelos: aceptan, juegan y (en la demo) retan ---------- */
  function duelos(lista, ahora) {
    for (const [did, d] of Object.entries(S.duelos || {})) {
      if (!d) continue;
      if (d.estado === "pendiente" && esBot(d.a)) {
        if (toca(`da:${did}`, ahora, () => d.creado + azar(1500, 5000))) {
          if (Math.random() < 0.75) aceptarDuelo(T, did); else rechazarDuelo(T, did, "rechazado");
        }
      }
      if (d.estado === "aceptado" && !d.go) {
        for (const id of [d.de, d.a]) {
          if (esBot(id) && !((d.listo || {})[id]) && toca(`dl:${did}:${id}`, ahora, () => ahora + azar(1500, 4500))) marcarListoDuelo(T, did, id);
        }
      }
      if (d.estado === "aceptado" && d.go) {
        for (const id of [d.de, d.a]) {
          if (!esBot(id) || (d.r || {})[id] !== undefined) continue;
          const b = S.agentes[id];
          const v = cuando(`dv:${did}:${id}`, () => (Math.random() < 0.05 ? -1 : Math.round(480 - 220 * (b.bot || 0.5) + azar(-50, 50))));
          if (toca(`dr:${did}:${id}`, ahora, () => (v < 0 ? d.go - azar(100, 600) : d.go + v))) T.escribir(`duelos/${did}/r/${id}`, v);
        }
        // Duelos entre dos agentes de prueba: los cierra el centro de mando.
        if (esBot(d.de) && esBot(d.a) && dueloListo(d, ahora) && toca(`dz:${did}`, ahora, () => ahora + 300)) resolverDuelo(T, S, did, "prueba");
      }
    }
    if (opc.retarA) retarAlJugador(lista, ahora);
  }
  // Solo en la demo: un agente de prueba reta a quien está probando el celular.
  function retarAlJugador(lista, ahora) {
    const yo = opc.retarA();
    if (!yo || !S.agentes[yo] || S.final) return;
    const desde = cuando(`reto-desde:${yo}`, () => ahora + 45000);
    if (ahora < desde || plan.get(`reto-hecho:${yo}`)) return;
    if (!puedoRetarYo(S, yo).ok) return;
    const candidatos = lista.filter((b) => totalDe(S, b.id) > 0 && puedoRetar(S, b.id, yo, ahora).ok && !dueloActivoDe(S, b.id));
    if (!candidatos.length) return;
    plan.set(`reto-hecho:${yo}`, true);
    crearDuelo(T, S, alAzar(candidatos).id, yo);
  }

  return { agregar, quitar, paso, bots, valorSolo };
}

/* =====================================================================
   CELULAR DEL JUGADOR: tarjeta de miembro, cuartel, misiones, duelos y gran final
   ===================================================================== */
function crearJugador(raiz, T, opc) {
  opc = opc || {};
  const CLAVE_ID = `liga2:agente:${SALA}`;
  const CLAVE_VISTAS = `liga2:vistas:${SALA}`;
  const guardado = opc.demo ? { get: () => null, set() {}, del() {} } : almacenAgente;

  // Enlace de recuperación que entrega el anfitrión: ?yo=<id>
  const yoEnlace = PARAMS.get("yo");
  if (yoEnlace && !opc.demo) {
    guardado.set(CLAVE_ID, yoEnlace);
    try { const u = new URL(location.href); u.searchParams.delete("yo"); history.replaceState(null, "", u.toString()); } catch (e) { /* sin historial */ }
  }
  let vistasGuardadas = [];
  try { vistasGuardadas = JSON.parse(guardado.get(CLAVE_VISTAS) || "[]") || []; } catch (e) { vistasGuardadas = []; }

  const L = {
    yo: guardado.get(CLAVE_ID) || null,
    perdido: false,
    dentro: null,
    sub: null,
    vistas: new Set(vistasGuardadas),
    alertasVistas: new Set(),
    duelosVistos: new Set(),
    estadosDuelo: {},
    confirmadas: new Set(),
    locales: {},
    entradas: {},
    clave: "",
    claveCapa: "",
    claveModulo: {},
    forzar: false,
    pintando: false,
    pendiente: false,
    soloJugando: false,
    pantallaMision: null,
    ctxMision: null,
    presencia: false,
    conectadoAntes: true,
    misionAntes: undefined,
    faseAntes: null,
    finalAntes: { paso: null, redoble: null },
    sonoAlerta: null,
    duelo: null,
    practicas: [],
  };
  if (!opc.demo) Sonido.activo = almacen.get("liga2:sonido") !== "no";

  // Firebase puede avisar de cambios en el mismo instante en que nos suscribimos.
  let programado = false;
  function programar() {
    if (programado) return;
    programado = true;
    requestAnimationFrame(() => { programado = false; refrescar(); });
  }
  const S = crearEstado(T, () => programar());

  raiz.innerHTML = `<div class="jugador"><div class="zona" data-zona="banda"></div><div class="zona" data-zona="principal"></div></div><div class="zona" data-zona="capa"></div>`;
  const zBanda = $('[data-zona="banda"]', raiz);
  const zPrincipal = $('[data-zona="principal"]', raiz);
  const zCapa = $('[data-zona="capa"]', raiz);

  const intervalo = setInterval(refrescar, 200);

  /* ---------- utilidades ---------- */
  function miAgente() { const a = S.agentes && L.yo && S.agentes[L.yo]; return a && a.nombre ? a : null; }
  function tipoDe(m) { return m ? TIPOS[m.tipo] : null; }
  function localDe(id) { return L.locales[id] || (L.locales[id] = {}); }
  function desplazarArriba() { if (opc.desplazar) opc.desplazar(); else window.scrollTo(0, 0); }
  function ctxMision() {
    const m = S.mision;
    return {
      T, S, m, mj: S.mj || {}, yo: L.yo, ahora: () => T.ahora(),
      local: localDe(m ? m.id : "-"), raiz: zPrincipal,
      pintar: () => { L.forzar = true; if (L.pintando) L.pendiente = true; else refrescar(); },
      fresco: ctxMision,
      marcarOcupado: (v) => { L.soloJugando = !!v; revisarOcupado(); },
      capaAvisos: () => raiz,
    };
  }
  function aviso(t) { avisar(t, raiz); }
  function marcarVista(id) {
    if (!id) return;
    L.vistas.add(id);
    guardado.set(CLAVE_VISTAS, JSON.stringify(Array.from(L.vistas).slice(-40)));
  }

  /* ---------- qué pantalla toca ---------- */
  function dueloEnPantalla() {
    const ahora = T.ahora();
    let resuelto = null;
    for (const [did, d] of Object.entries(S.duelos || {})) {
      if (!d || (d.de !== L.yo && d.a !== L.yo)) continue;
      if (d.estado === "aceptado") return [did, d];
      if (d.estado === "resuelto" && !L.duelosVistos.has(did) && ahora - (Number(d.resuelto) || 0) < DUELO_VIGENTE_MS) resuelto = [did, d];
    }
    return resuelto;
  }
  function pantalla() {
    if (S.agentes === undefined || S.mision === undefined) return { id: "cargando" };
    if (!miAgente()) return { id: "registro" };
    if (S.final) return { id: "final" };
    const d = dueloEnPantalla();
    if (d) return { id: "duelo", did: d[0], d: d[1] };
    const m = S.mision;
    if (m && L.dentro === m.id) return { id: "mision", m };
    return { id: "cuartel" };
  }
  function claveDe(p, ctx) {
    if (p.id === "final") return `final:${S.final.paso || 0}`;
    if (p.id === "duelo") {
      const mio = ((p.d.r || {})[L.yo]);
      const prep = p.d.estado === "aceptado" && !p.d.go ? `prep${((p.d.listo || {})[L.yo]) ? "L" : ""}` : "go";
      return `duelo:${p.did}:${p.d.estado}:${prep}:${mio === undefined ? "" : "t"}`;
    }
    if (p.id === "cuartel") return `cuartel:${L.sub || ""}`;
    if (p.id !== "mision") return p.id;
    const m = p.m, tipo = tipoDe(m);
    if (!tipo) return `mision:${m.id}:desconocida`;
    if (S.mjListo !== m.id) return `mision:${m.id}:cargando`;
    if (m.fase === "sala") return `mision:${m.id}:sala:${((S.mj.listos || {})[L.yo]) ? 1 : 0}`;
    if (m.fase === "resultados") return `mision:${m.id}:resultados`;
    return `mision:${m.id}:juego:${tipo.jugador.clave(ctx)}`;
  }

  /* ---------- pintar ---------- */
  function refrescar() {
    if (L.pintando) { L.pendiente = true; return; }
    L.pintando = true;
    try {
      revisarTodo();
      pintarPrincipal();
      pintarCapa();
      pintarBanda();
    } catch (e) { console.error(e); }
    finally { L.pintando = false; }
    if (L.pendiente) { L.pendiente = false; setTimeout(refrescar, 0); }
  }

  function pintarPrincipal() {
    const p = pantalla();
    const ctx = p.id === "mision" ? ctxMision() : null;
    const clave = claveDe(p, ctx);
    if (clave !== L.clave || L.forzar) {
      const antes = L.clave;
      L.forzar = false;
      if (L.pantallaMision && (p.id !== "mision" || p.m.id !== L.pantallaMision)) salirMision();
      // Durante una misión o un duelo la pantalla no se apaga; en el cuartel sí puede.
      if (p.id === "mision" || p.id === "duelo" || p.id === "final") pantallaEncendida(); else soltarPantalla();
      L.clave = clave;
      desmontarPracticas(L.practicas);
      zPrincipal.innerHTML = htmlDe(p, ctx);
      montarPracticas(zPrincipal, { S, yo: L.yo }, L.practicas);
      const cambioGrande = antes.split(":").slice(0, 3).join(":") !== clave.split(":").slice(0, 3).join(":");
      if (cambioGrande) desplazarArriba();
      if (p.id === "mision") {
        L.pantallaMision = p.m.id;
        L.ctxMision = ctx;
        trasPintarMision(p.m, ctx, clave);
      }
      if (p.id === "duelo") L.duelo = null;
    }
    actualizarDe(p, ctx);
  }

  function htmlDe(p, ctx) {
    switch (p.id) {
      case "cargando": return `<div class="cargando">${logoHTML()}<p class="latido">Conectando con la Liga…</p></div>`;
      case "registro": return htmlRegistro();
      case "final": return htmlFinal();
      case "duelo": return htmlDuelo(p.did, p.d);
      case "mision": return htmlMision(p.m, ctx);
      default: return L.sub === "retar" ? htmlRetar() : htmlCuartel();
    }
  }
  function actualizarDe(p, ctx) {
    if (p.id === "cuartel") { if (L.sub === "retar") actualizarRetar(); else actualizarCuartel(); }
    else if (p.id === "mision") actualizarMision(p.m, ctx);
    else if (p.id === "duelo") actualizarDuelo(p.did, p.d);
    const mp = $('[data-vivo="mini-puntos"]', zPrincipal);
    if (mp) { const t = `${fmt(totalDe(S, L.yo))} pts`; if (mp.textContent !== t) mp.textContent = t; }
  }

  function pintarBanda() {
    const caida = !S.conectado && S.caidaDesde && Date.now() - S.caidaDesde > 2500;
    const h = caida ? `<div class="banda-conexion" role="status">Sin conexión… reconectando</div>` : "";
    if (zBanda.dataset.h !== h) { zBanda.dataset.h = h; zBanda.innerHTML = h; }
  }

  /* ---------- registro: la tarjeta de miembro ---------- */
  function htmlRegistro() {
    return `${logoHTML()}<section class="pagina"><span class="cap">Tarjeta de miembro</span>` +
      `<h1 class="titulo">Únete a la Liga</h1>` +
      (L.perdido ? `<div class="globo"><strong>Tu tarjeta ya no está.</strong> El anfitrión la quitó de la partida. Puedes crear una nueva.</div>` : "") +
      `<p>Cada invitado juega por su cuenta. Suma puntos de Liga en las misiones de la fiesta: quien termine 1.º gana el premio, para sí o para el pequeño héroe que elija.</p>` +
      `<form data-form="registro" class="columna" novalidate>` +
      `<div class="campo-grupo"><label class="etiqueta" for="nombre-heroe">Nombre de héroe</label><input class="campo" id="nombre-heroe" maxlength="22" autocomplete="nickname" autocapitalize="words" enterkeyhint="done" placeholder="Por ejemplo: Capitán Papá"></div>` +
      `<div class="campo-grupo" role="radiogroup" aria-labelledby="et-poder"><span class="etiqueta" id="et-poder">Superpoder</span>` +
      `<div class="poderes-rejilla">${PODERES.map((p) => `<label class="opcion-poder"><input type="radio" name="poder" value="${p.id}">${poderHTML(p.id)}<span>${esc(p.nombre)}</span></label>`).join("")}</div></div>` +
      `<p class="error" data-vivo="error" role="alert"></p>` +
      `<button class="boton rojo grande bloque" type="submit">¡Unirme a la Liga!</button></form></section>` +
      `<button class="enlace centro" data-accion="como">¿Cómo se juega?</button>`;
  }
  async function registrar(form) {
    if (L.registrando) return;
    const err = $('[data-vivo="error"]', form);
    const nombre = $("#nombre-heroe", form).value.replace(/\s+/g, " ").trim();
    const marcado = form.querySelector('input[name="poder"]:checked');
    if (normalizar(nombre).length < 2) { err.textContent = "Escribe tu nombre de héroe."; $("#nombre-heroe", form).focus(); return; }
    if (!marcado) { err.textContent = "Elige tu superpoder."; return; }
    if (agentesValidos(S.agentes).some((a) => normalizar(a.nombre) === normalizar(nombre))) {
      err.textContent = "Ya hay un héroe con ese nombre. Agrégale algo, como tu inicial.";
      return;
    }
    const boton = $('button[type="submit"]', form);
    L.registrando = true;
    boton.disabled = true;
    boton.textContent = "Creando tu tarjeta…";
    err.textContent = "";
    try {
      const id = nuevoId("a");
      const codigo = await asignarCodigo(T, id);
      await T.escribir(`agentes/${id}`, { nombre, poder: marcado.value, codigo, unido: T.ahora(), conectado: true, visto: T.ahora() });
      L.yo = id;
      L.perdido = false;
      L.presencia = false;
      guardado.set(CLAVE_ID, id);
      L.bienvenida = true;
      refrescar();
    } catch (e) {
      err.textContent = "No se pudo crear tu tarjeta. Revisa tu internet e intenta otra vez.";
      boton.disabled = false;
      boton.textContent = "¡Unirme a la Liga!";
    } finally { L.registrando = false; }
  }

  /* ---------- cuartel ---------- */
  function htmlCuartel() {
    const a = miAgente();
    return `${logoHTML()}<section class="pagina tarjeta-agente"><span class="cap">Tarjeta de miembro</span>` +
      `<div class="cabeza">${poderHTML(a.poder)}<div><div class="nombre">${esc(a.nombre)}</div><div class="poder-nombre">${esc(poderDe(a.poder).nombre)}</div></div></div>` +
      `<div class="codigo-banda"><span>Tu código<br>de agente</span><b>${esc(a.codigo || "–")}</b></div>` +
      `<div class="datos"><div class="dato"><b class="numero" data-vivo="total">0</b><span>puntos</span></div>` +
      `<div class="dato"><b class="numero" data-vivo="puesto">–</b><span>puesto</span></div></div></section>` +
      `<div class="zona" data-vivo="mision"></div>` +
      `<div class="zona" data-vivo="duelo"></div>` +
      `<section class="pagina"><span class="cap">Clasificación</span><div data-vivo="ranking"></div></section>` +
      `<p class="nota centro" data-vivo="nota-sonido">Deja esta página abierta: cuando empiece una misión, tu celular suena.</p>` +
      `<div class="fila centro pie-cuartel"><button class="enlace" data-accion="sonido" data-vivo="sonido"></button><button class="enlace" data-accion="como">¿Cómo se juega?</button></div>`;
  }
  function htmlBannerMision() {
    const m = S.mision, tipo = tipoDe(m);
    if (!m || !tipo) {
      return `<section class="pagina"><span class="cap">Sin misión</span><p>Por ahora, ¡a disfrutar la fiesta! Cuando el anfitrión lance una misión, aparecerá aquí.</p></section>`;
    }
    if (m.fase === "resultados") {
      const mia = (m.resultados || []).find((f) => f.id === L.yo);
      return `<section class="pagina alerta-mision"><span class="cap">Terminó</span><h2 class="titulo chico">${esc(m.nombre)}</h2>` +
        `<p>${mia ? (mia.pts > 0 ? `Sumaste <b>+${fmt(mia.pts)}</b> puntos (${ordinal(mia.pos)} lugar).` : mia.pts < 0 ? `Perdiste <b>${fmt(-mia.pts)}</b> puntos.` : "Esta vez no sumaste puntos.") : "No participaste en esta misión."}</p>` +
        `<button class="boton bloque" data-accion="entrar">Ver resultados</button></section>`;
    }
    return `<section class="pagina alerta-mision"><span class="cap roja">¡Misión en curso!</span>` +
      `<div class="mision-cabeza"><span class="icono-mision">${icono(tipo.icono)}</span><h2 class="titulo chico">${esc(m.nombre)}</h2></div>` +
      `<p>${esc(tipo.resumen)}</p>${m.doble ? `<p class="doble">¡Vale doble!</p>` : ""}` +
      `<button class="boton rojo grande bloque" data-accion="entrar">Entrar a la misión</button></section>`;
  }
  function htmlBannerDuelo() {
    const activo = dueloActivoDe(S, L.yo);
    const recientes = duelosRecientes(S, 3);
    const feed = recientes.length ? `<ul class="feed">${recientes.map((d) => `<li>${icono("duelo")}<span>${textoDuelo(S, d)}</span></li>`).join("")}</ul>` : "";
    let cuerpo;
    if (activo && activo[1].de === L.yo && activo[1].estado === "pendiente") {
      cuerpo = `<p>Retaste a <b>${esc(nombreDe(S, activo[1].a))}</b>. Esperando su respuesta… <span data-vivo="reto-queda"></span></p>` +
        `<button class="boton blanco" data-accion="cancelar-duelo" data-id="${activo[0]}">Cancelar el reto</button>`;
    } else {
      const yo = puedoRetarYo(S, L.yo);
      cuerpo = `<p>Reta a otro agente a un duelo de reflejos: el más rápido le roba hasta ${fmt(CONFIG.puntosDuelo)} puntos al otro.</p>` +
        `<button class="boton azul bloque" data-accion="retar"${yo.ok ? "" : " disabled"}>${icono("duelo")} Retar a un duelo</button>` +
        (yo.ok ? "" : `<p class="suave">${esc(yo.motivo)}</p>`);
    }
    return `<section class="pagina"><span class="cap">Robo de puntos</span>${cuerpo}${feed}</section>`;
  }
  function actualizarCuartel() {
    const a = miAgente();
    if (!a) return;
    const oculto = !!(S.ajustes && S.ajustes.ocultarRanking);
    const lista = clasificacion(S);
    const yo = lista.find((x) => x.id === L.yo);
    const t = $('[data-vivo="total"]', zPrincipal);
    if (t) { const v = fmt(totalDe(S, L.yo)); if (t.textContent !== v) t.textContent = v; }
    const p = $('[data-vivo="puesto"]', zPrincipal);
    if (p) { const v = oculto ? "?" : yo ? `${yo.pos}.º` : "–"; if (p.textContent !== v) p.textContent = v; }
    pintarVivo("mision", htmlBannerMision());
    pintarVivo("duelo", htmlBannerDuelo());
    pintarVivo("ranking", oculto ? `<p>¡Suspenso! El anfitrión ocultó la clasificación hasta la gran final.</p>` : tablaClasificacion(lista, L.yo, 10));
    const s = $('[data-vivo="sonido"]', zPrincipal);
    if (s) { const v = Sonido.activo ? "Sonido: activado" : "Sonido: apagado"; if (s.textContent !== v) s.textContent = v; }
    pintarVivo("nota-sonido", Sonido.activo && !Sonido.listo
      ? "Toca la pantalla una vez para activar el sonido de las alertas. Y deja esta página abierta."
      : "Deja esta página abierta: cuando empiece una misión, tu celular suena.");
    const q = $('[data-vivo="reto-queda"]', zPrincipal);
    const activo = dueloActivoDe(S, L.yo);
    if (q && activo) q.textContent = `(${clamp(Math.ceil((activo[1].creado + DUELO_ACEPTAR_MS - T.ahora()) / 1000), 0, DUELO_ACEPTAR_MS / 1000)} s)`;
  }
  function pintarVivo(nombre, html) {
    const el = $(`[data-vivo="${nombre}"]`, zPrincipal);
    if (el && el.dataset.h !== html) { el.dataset.h = html; el.innerHTML = html; }
  }

  /* ---------- retar a un duelo ---------- */
  function htmlRetar() {
    return `<section class="pagina"><span class="cap">Robo de puntos</span><h1 class="titulo chico">¿A quién retas?</h1>` +
      `<p>Duelo de reflejos: el más rápido le roba hasta ${fmt(CONFIG.puntosDuelo)} puntos al otro. Si rechaza tu reto, no podrás retarlo de nuevo por ${CONFIG.esperaTrasRechazoMin} minutos.</p>` +
      `<div class="columna" data-vivo="retables"></div></section>` +
      `<button class="boton bloque" data-accion="cuartel">Volver al cuartel</button>`;
  }
  function actualizarRetar() {
    const ahora = T.ahora();
    const yo = puedoRetarYo(S, L.yo);
    if (!yo.ok) { pintarVivo("retables", `<p>${esc(yo.motivo)}</p>`); return; }
    const otros = clasificacion(S).filter((a) => a.id !== L.yo);
    if (!otros.length) { pintarVivo("retables", `<p>Todavía no hay otros agentes.</p>`); return; }
    const filas = otros.map((a) => {
      const r = puedoRetar(S, L.yo, a.id, ahora);
      const motivo = r.motivo.replace(/\d+:\d\d/, (m) => `${Math.ceil(Number(m.split(":")[0]) + Number(m.split(":")[1]) / 60)} min`);
      return `<button class="agente-fila" data-accion="retar-a" data-id="${a.id}"${r.ok ? "" : " disabled"}>${poderHTML(a.poder)}<span class="nom">${esc(a.nombre)}<small>${esc(motivo)}</small></span><span class="val">${fmt(a.total)}</span></button>`;
    }).join("");
    pintarVivo("retables", filas);
  }
  async function retarA(id) {
    const r = puedoRetar(S, L.yo, id, T.ahora());
    if (!r.ok) { aviso(r.motivo || "No se puede retar a este agente."); return; }
    const apuesta = apuestaDuelo(S, L.yo, id);
    const ok = await confirmar({ titulo: `Retar a ${nombreDe(S, id)}`, texto: `Si acepta, juegan un duelo de reflejos y el más rápido se lleva ${fmt(apuesta)} puntos del otro.`, si: "¡Retar!" }, raiz);
    if (!ok) return;
    if (!puedoRetar(S, L.yo, id, T.ahora()).ok) { aviso("Ya no se puede: intenta con otro agente."); return; }
    crearDuelo(T, S, L.yo, id);
    Sonido.tocar("toque");
    vibrar(30);
    L.sub = null;
    refrescar();
  }

  /* ---------- duelo en pantalla ---------- */
  function htmlDuelo(did, d) {
    const rival = d.de === L.yo ? d.a : d.de;
    const nr = esc(nombreDe(S, rival));
    const r = d.r || {};
    if (d.estado === "aceptado" && !d.go) {
      const listo = !!((d.listo || {})[L.yo]);
      return `<section class="pagina"><span class="cap roja">¡Duelo aceptado!</span><h1 class="titulo chico">Tú contra ${nr}</h1>` +
        `<p>${fmt(d.apuesta)} puntos en juego. Así se juega:</p>${pasosHTML(PASOS_DUELO)}</section>` +
        `<section class="pagina practica"><span class="cap">Práctica · no cuenta</span><div data-practica="reflejos"></div></section>` +
        (listo
          ? `<p class="centro">¡Listo! Esperando a ${nr}… <span data-vivo="prep-queda"></span></p>`
          : `<button class="boton rojo grande bloque" data-accion="listo-duelo" data-id="${did}">¡Estoy listo para el duelo!</button><p class="centro nota" data-vivo="prep-queda"></p>`);
    }
    if (d.estado === "aceptado") {
      const mio = r[L.yo];
      if (mio !== undefined) {
        return `<section class="pagina"><span class="cap roja">Duelo</span><h1 class="titulo">${Number(mio) > 0 ? `${fmt(mio)} ms` : "¡Muy pronto!"}</h1>` +
          `<p>${Number(mio) > 0 ? "¡Buen toque!" : "Tocaste antes de tiempo dos veces."} Esperando a ${nr}…</p></section>`;
      }
      return `<div class="duelo-cabeza"><span class="cap roja">¡Va en serio!</span><p>Tú contra <b>${nr}</b> · ${fmt(d.apuesta)} puntos en juego</p></div>` +
        `<div class="arena noche" data-duelo><div class="arena-texto" data-vivo="aviso-duelo">Prepárate…<small>Toca cuando se ponga amarilla</small></div></div>`;
    }
    const gane = d.ganador === L.yo, empate = !d.ganador;
    const t = (id) => (Number(r[id]) > 0 ? `${fmt(r[id])} ms` : Number(r[id]) === -1 ? "tocó antes" : "no tocó");
    const texto = empate ? "Nadie se lleva puntos esta vez."
      : gane ? (d.robo > 0 ? `Le robaste ${fmt(d.robo)} puntos a ${nr}.` : `Ganaste, pero ${nr} no tenía puntos para robarle.`)
        : (d.robo > 0 ? `${nr} te robó ${fmt(d.robo)} puntos.` : `${nr} ganó el duelo.`);
    return `<div class="estallido ${empate ? "azul" : gane ? "" : "rojo"}"><div><strong>${empate ? "¡Empate!" : gane ? "¡Ganaste!" : "¡Perdiste!"}</strong>` +
      `<b>${empate ? "0" : `${gane ? "+" : "−"}${fmt(d.robo)}`}</b></div></div>` +
      `<section class="pagina"><span class="cap">Duelo</span><ol class="tabla">` +
      `<li class="yo"><span class="pos">${d.ganador === L.yo ? 1 : 2}</span>${poderHTML(poderDeAgente(S, L.yo))}<span class="nom">Tú</span><span class="val">${t(L.yo)}</span></li>` +
      `<li><span class="pos">${d.ganador === rival ? 1 : 2}</span>${poderHTML(poderDeAgente(S, rival))}<span class="nom">${nr}</span><span class="val">${t(rival)}</span></li></ol>` +
      `<p>${texto}</p></section><button class="boton bloque" data-accion="cerrar-duelo" data-id="${did}">Volver al cuartel</button>`;
  }
  function actualizarDuelo(did, d) {
    if (d.estado !== "aceptado") return;
    if (!d.go) {
      const q = $('[data-vivo="prep-queda"]', zPrincipal);
      if (q) { const t = `Empieza solo en ${Math.max(0, Math.ceil(((d.aceptadoT || 0) + DUELO_PREPARAR_MS - T.ahora()) / 1000))} s.`; if (q.textContent !== t) q.textContent = t; }
      return;
    }
    const arena = $("[data-duelo]", zPrincipal);
    if (!arena) return;
    const D = L.duelo && L.duelo.did === did ? L.duelo : (L.duelo = { did, t0: 0, hecho: false, avisado: false });
    if (!arena.dataset.enlazado) {
      arena.dataset.enlazado = "1";
      arena.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (D.hecho) return;
        const aviso_ = $('[data-vivo="aviso-duelo"]', arena);
        if (!D.t0 && !D.avisado) {
          // Primer toque antes de tiempo: solo un aviso.
          D.avisado = true;
          arena.className = "arena roja";
          if (aviso_) aviso_.innerHTML = "¡Todavía no!<small>Espera el amarillo. La próxima vez pierdes</small>";
          vibrar(150);
          Sonido.tocar("error");
          setTimeout(() => { if (!D.t0 && !D.hecho) { arena.className = "arena noche"; if (aviso_) aviso_.innerHTML = "Prepárate…<small>Toca cuando se ponga amarilla</small>"; } }, 1300);
          return;
        }
        D.hecho = true;
        if (!D.t0) {
          T.escribir(`duelos/${did}/r/${L.yo}`, -1);
          arena.className = "arena roja";
          if (aviso_) aviso_.innerHTML = "¡Muy pronto!";
          vibrar(200);
          return;
        }
        const ms = clamp(Math.round(tiempoEvento(e) - D.t0), 60, DUELO_TOQUE_MS);
        if (aviso_) aviso_.innerHTML = `${fmt(ms)} ms`;
        vibrar(30);
        T.escribir(`duelos/${did}/r/${L.yo}`, ms);
      });
    }
    if (!D.programado) {
      D.programado = true;
      const encender = () => {
        const a = $("[data-duelo]", zPrincipal);
        if (!a || D.hecho || D.t0) return;
        a.className = "arena amarilla";
        const av = $('[data-vivo="aviso-duelo"]', a);
        if (av) av.innerHTML = yaHTML();
        D.t0 = performance.now();
        requestAnimationFrame((t) => { if (!D.hecho) D.t0 = Math.max(D.t0, t); });
      };
      D.timer = setTimeout(encender, Math.max(0, d.go - T.ahora()));
    }
  }

  /* ---------- misión ---------- */
  function cabeceraMision() {
    const a = miAgente();
    return `<div class="cabecera-mision"><span class="mini-agente">${poderHTML(a.poder)}<span>${esc(a.nombre)}</span></span>` +
      `<span class="mini-codigo" title="Tu código de agente">Agente <b>${esc(a.codigo || "–")}</b></span><span class="mini-puntos" data-vivo="mini-puntos"></span></div>`;
  }
  function htmlMision(m, ctx) {
    const tipo = tipoDe(m);
    const cab = cabeceraMision();
    if (!tipo) return cab + `<section class="pagina"><span class="cap">Misión</span><p>Esta misión necesita una versión más nueva de la página. Recárgala.</p></section><button class="boton bloque" data-accion="cuartel">Volver al cuartel</button>`;
    if (S.mjListo !== m.id) return cab + `<p class="centro latido">Cargando la misión…</p>`;
    if (m.fase === "sala") return cab + htmlSala(m, tipo);
    if (m.fase === "resultados") return cab + htmlResultados(m);
    return cab + tipo.jugador.html(ctx);
  }
  function htmlPractica(practica) {
    if (!practica) return "";
    const [nombre, para] = String(practica).split(":");
    return `<section class="pagina practica"><span class="cap">Práctica · no cuenta</span><p class="suave">Prueba aquí mientras esperan la largada.</p>` +
      `<div data-practica="${esc(nombre)}"${para ? ` data-para="${esc(para)}"` : ""}></div></section>`;
  }
  function htmlSala(m, tipo) {
    const listo = !!((S.mj.listos || {})[L.yo]);
    return introHTML(tipo, m.doble ? `<p class="doble">¡Esta misión vale doble!</p>` : "") +
      (listo
        ? `<div class="estallido azul"><div><strong>¡Listo!</strong><b>Atento</b></div></div><p class="centro">Espera a que el anfitrión dé la largada…</p>`
        : `<button class="boton rojo grande bloque" data-accion="listo">¡Estoy listo!</button>`) +
      htmlPractica(tipo.practica) +
      `<section class="pagina"><span class="cap" data-vivo="n-listos">Listos</span><ul class="chips" data-vivo="listos"></ul></section>` +
      (listo ? `<button class="enlace centro" data-accion="no-listo">Mejor no participo</button>` : `<button class="enlace centro" data-accion="cuartel">Volver al cuartel</button>`);
  }
  function htmlResultados(m) {
    const filas = m.resultados || [];
    const mia = filas.find((f) => f.id === L.yo);
    const bomba = m.tipo === "bomba";
    const cabeza = mia && mia.pts > 0
      ? `<div class="estallido"><div><strong>${mia.pos === 1 ? "¡Ganaste!" : `¡${ordinal(mia.pos)} lugar!`}</strong><b>+${fmt(mia.pts)}</b></div></div>`
      : mia && mia.pts < 0 ? `<div class="estallido rojo"><div><strong>${bomba ? "¡BOOM!" : "¡Ay!"}</strong><b>${ptsTexto(mia.pts)}</b></div></div>`
        : mia ? `<div class="estallido azul"><div><strong>${bomba ? "¡Te salvaste!" : "¡A la próxima!"}</strong><b>${bomba ? "0" : "+0"}</b></div></div>` : "";
    const tipo = tipoDe(m);
    return cabeza + `<section class="pagina"><span class="cap">Resultados</span><h2 class="titulo chico">${esc(m.nombre)}</h2>${m.doble ? `<p class="doble">¡Valía doble!</p>` : ""}` +
      (filas.length ? `<ol class="tabla">${filas.map((r, i) => filaResultado(S, r, i, L.yo)).join("")}</ol>` : `<p>Nadie sumó puntos en esta misión.</p>`) +
      `</section>${tipo && tipo.resultadoExtra ? tipo.resultadoExtra(m) : ""}<button class="boton bloque" data-accion="cuartel">Volver al cuartel</button>`;
  }
  function trasPintarMision(m, ctx, clave) {
    const tipo = tipoDe(m);
    if (!tipo || S.mjListo !== m.id) return;
    if (m.fase === "juego") {
      if (!L.entradas[m.id] && tipo.jugador.entrar) { L.entradas[m.id] = true; try { tipo.jugador.entrar(ctx); } catch (e) { console.error(e); } }
      const cm = clave.split(":").slice(3).join(":");
      if (L.claveModulo[m.id] !== cm) {
        L.claveModulo[m.id] = cm;
        if (tipo.jugador.efectos) { try { tipo.jugador.efectos(ctx, cm); } catch (e) { console.error(e); } }
      }
    }
    if (m.fase === "resultados" && L.claveModulo[m.id] !== "resultados") {
      L.claveModulo[m.id] = "resultados";
      const mia = (m.resultados || []).find((f) => f.id === L.yo);
      if (mia && mia.pts > 0) { Sonido.tocar(mia.pos === 1 ? "fanfarria" : "revelar"); vibrar([40, 50, 40]); if (mia.pos === 1) confeti(raiz); }
    }
  }
  function actualizarMision(m, ctx) {
    const tipo = tipoDe(m);
    if (!tipo || S.mjListo !== m.id) return;
    if (m.fase === "sala") {
      const listos = listosDe(ctx);
      const n = $('[data-vivo="n-listos"]', zPrincipal);
      if (n) { const t = `Listos: ${listos.length}`; if (n.textContent !== t) n.textContent = t; }
      pintarVivo("listos", listos.map((id) => chipAgente(S, id, id === L.yo ? "yo" : "listo")).join(""));
      return;
    }
    if (m.fase === "juego" && tipo.jugador.actualizar) {
      try { tipo.jugador.actualizar(ctx, zPrincipal); } catch (e) { console.error(e); }
    }
  }
  function salirMision() {
    const ctx = L.ctxMision;
    L.pantallaMision = null;
    L.ctxMision = null;
    if (!ctx || !ctx.m) return;
    const tipo = tipoDe(ctx.m);
    if (tipo && tipo.jugador && tipo.jugador.salir) { try { tipo.jugador.salir(ctx); } catch (e) { console.error(e); } }
    if (L.soloJugando) { L.soloJugando = false; revisarOcupado(); }
  }
  function entrarMision() {
    const m = S.mision;
    if (!m) return;
    marcarVista(m.id);
    L.dentro = m.id;
    L.sub = null;
    refrescar();
  }
  function irCuartel() {
    L.dentro = null;
    L.sub = null;
    refrescar();
  }

  /* ---------- gran final ---------- */
  function htmlFinal() {
    const f = S.final, paso = Number(f.paso) || 0, podio = f.podio || [];
    const fila = (f.tabla || []).find((x) => x.id === L.yo);
    const completo = podio.length > 0 && paso >= podio.length;
    let cabeza;
    if (!completo) {
      cabeza = `<section class="pagina"><span class="cap roja">Gran final</span><h1 class="titulo">¡El podio de la Liga!</h1>` +
        `<p>${paso === 0 ? "El anfitrión va a revelar a los ganadores, del 3.º al 1.º. ¿Quién se llevará el premio?" : "¡Atentos! Falta revelar…"}</p></section>`;
    } else if (podio[0].id === L.yo) {
      cabeza = `<div class="estallido"><div><strong>¡Ganaste!</strong><b>${fmt(podio[0].total)} pts</b></div></div>` +
        `<section class="pagina"><span class="cap roja">Campeón de la Liga</span><h1 class="titulo chico">¡Felicitaciones, ${esc(podio[0].nombre)}!</h1>` +
        `<p>El premio es tuyo o del pequeño héroe que elijas. ¡Acércate al anfitrión!</p></section>`;
    } else {
      cabeza = `<section class="pagina"><span class="cap">Gran final</span><h1 class="titulo chico">¡Felicitaciones, ${esc(podio[0].nombre)}!</h1>` +
        (fila ? `<p>Terminaste en el <b>${ordinal(fila.pos)} lugar</b> con <b>${fmt(fila.total)}</b> puntos.</p>` : "") +
        `<p>¡Gracias por jugar en La Liga de Salvador!</p></section>`;
    }
    return cabeza + `<section class="pagina podio-pagina"><span class="cap">Podio</span>${podioHTML(podio, paso, L.yo)}</section>`;
  }
  function revisarFinal() {
    const f = S.final;
    if (!f) { L.finalAntes = { paso: null, redoble: null }; return; }
    const antes = L.finalAntes;
    if (antes.redoble !== null && f.redoble && f.redoble !== antes.redoble) Sonido.tocar("redoble");
    if (antes.paso !== null && (f.paso || 0) !== antes.paso) {
      const podio = f.podio || [];
      if ((f.paso || 0) >= podio.length && podio.length) {
        Sonido.tocar("fanfarria");
        setTimeout(() => confeti(raiz), 150);
        vibrar(podio[0].id === L.yo ? [80, 60, 80, 60, 300] : [60]);
      } else Sonido.tocar("revelar");
    }
    L.finalAntes = { paso: f.paso || 0, redoble: f.redoble || 0 };
  }

  /* ---------- capas: alertas, retos y confirmaciones ---------- */
  function capaActual(p) {
    if (p.id === "cargando" || p.id === "registro") return null;
    if (L.bienvenida) return { tipo: "bienvenida", id: L.yo };
    const ahora = T.ahora();
    const al = S.alerta;
    if (al && al.id && !L.alertasVistas.has(al.id) && ahora - (Number(al.t) || 0) < 90000 && p.id !== "final") return { tipo: "sirena", id: al.id };
    if (p.id === "final" || p.id === "duelo") return null;
    for (const [did, d] of Object.entries(S.duelos || {})) {
      if (d && d.a === L.yo && d.estado === "pendiente" && ahora - d.creado < DUELO_ACEPTAR_MS) return { tipo: "reto", id: did };
    }
    const m = S.mision;
    if (m && m.tipo === "agente" && m.fase === "juego" && S.mjListo === m.id) {
      const pend = TIPOS.agente.pendientesPara(ctxMision()).filter((id) => !L.confirmadas.has(id + ":" + ((S.mj.cumple || {})[id] || {}).t));
      if (pend.length) return { tipo: "agente", id: pend[0] };
    }
    if (m && m.fase !== "resultados" && !L.vistas.has(m.id) && L.dentro !== m.id && TIPOS[m.tipo]) return { tipo: "mision", id: m.id };
    return null;
  }
  function pintarCapa() {
    const p = pantalla();
    const c = capaActual(p);
    const clave = c ? `${c.tipo}:${c.id}` : "";
    if (clave !== L.claveCapa) {
      L.claveCapa = clave;
      zCapa.innerHTML = c ? htmlCapa(c) : "";
      if (c) efectosCapa(c);
      const b = $("[data-foco]", zCapa);
      if (b) b.focus({ preventScroll: true });
    }
    if (c && c.tipo === "reto") {
      const d = S.duelos[c.id];
      const queda = d ? d.creado + DUELO_ACEPTAR_MS - T.ahora() : 0;
      const s = $('[data-vivo="reto-queda"]', zCapa);
      if (s) s.textContent = String(clamp(Math.ceil(queda / 1000), 0, DUELO_ACEPTAR_MS / 1000));
      const i = $(".mecha i", zCapa);
      if (i) i.style.width = clamp((queda / DUELO_ACEPTAR_MS) * 100, 0, 100) + "%";
    }
  }
  function htmlCapa(c) {
    if (c.tipo === "bienvenida") {
      const a = miAgente();
      const img = CONFIG.imagenes && CONFIG.imagenes.salvador;
      return `<div class="alerta-total bienvenida" role="alertdialog" aria-labelledby="capa-t"><div class="bienvenida-caja">` +
        (img ? `<img class="bienvenida-salva" src="${esc(img)}" alt="">` : "") +
        `<span class="cap roja">¡Te damos la bienvenida!</span>` +
        `<h2 class="titulo" id="capa-t">${esc(a.nombre)}</h2>` +
        `<p class="bienvenida-poder">${poderHTML(a.poder)}<span>${esc(poderDe(a.poder).nombre)}</span></p>` +
        `<p class="bienvenida-texto">Ya eres parte de <b>La Liga de Salvador</b></p>` +
        `<div class="mi-codigo"><span>Tu código de agente</span><b>${esc(a.codigo || "–")}</b><small>Lo verás siempre en tu tarjeta y arriba en cada misión. En algunos juegos te lo van a pedir.</small></div>` +
        `<button class="boton rojo grande bloque" data-accion="bienvenida-ok" data-foco>¡A la fiesta!</button></div></div>`;
    }
    if (c.tipo === "sirena") {
      const m = S.mision;
      const enMision = m && m.fase !== "resultados" && L.dentro !== m.id;
      return `<div class="alerta-total sirena" role="alertdialog" aria-labelledby="capa-t"><div class="pagina"><span class="cap roja">¡Atención, Liga!</span>` +
        `<h2 class="titulo" id="capa-t">${esc((S.alerta && S.alerta.texto) || "¡Todos al juego!")}</h2>` +
        `<button class="boton rojo grande bloque" data-accion="sirena-ok" data-foco>${enMision ? "¡Voy a la misión!" : "¡Voy!"}</button></div></div>`;
    }
    if (c.tipo === "reto") {
      const d = S.duelos[c.id];
      return `<div class="capa-modal" role="alertdialog" aria-labelledby="capa-t"><div class="pagina"><span class="cap roja">¡Te retan!</span>` +
        `<h2 class="titulo chico" id="capa-t">${esc(nombreDe(S, d.de))} te reta a un duelo</h2>` +
        `<p>Duelo de reflejos: cuando la pantalla se ponga <b>amarilla</b>, toca. El más rápido le roba <b>${fmt(d.apuesta)}</b> puntos al otro.</p>` +
        `<p class="suave">Antes de empezar tendrás una práctica que no cuenta.</p>` +
        `<div class="mecha-fila"><div class="mecha"><i></i></div><span class="segundos" data-vivo="reto-queda"></span></div>` +
        `<div class="fila"><button class="boton blanco" data-accion="rechazar-duelo" data-id="${c.id}">Rechazar</button><button class="boton rojo" data-accion="aceptar-duelo" data-id="${c.id}" data-foco>¡Acepto!</button></div>` +
        `<p class="suave">Si no aceptas, no podrá retarte de nuevo por ${CONFIG.esperaTrasRechazoMin} minutos.</p></div></div>`;
    }
    if (c.tipo === "agente") {
      return `<div class="capa-modal" role="alertdialog" aria-labelledby="capa-t"><div class="pagina"><span class="cap roja">Agente secreto</span>` +
        `<h2 class="titulo chico" id="capa-t">¡Confírmalo!</h2><p>${esc(TIPOS.agente.texto(ctxMision(), c.id, "objetivo"))}</p>` +
        `<p class="suave">Era su misión secreta. Responde con la verdad.</p>` +
        `<div class="fila"><button class="boton blanco" data-accion="agente-no" data-id="${c.id}">Todavía no</button><button class="boton rojo" data-accion="agente-si" data-id="${c.id}" data-foco>¡Sí, lo logró!</button></div></div></div>`;
    }
    const m = S.mision, tipo = tipoDe(m);
    return `<div class="alerta-total" role="alertdialog" aria-labelledby="capa-t"><div class="pagina alerta-mision"><span class="cap roja">¡Nueva misión!</span>` +
      `<div class="mision-cabeza"><span class="icono-mision grande">${icono(tipo.icono)}</span><h2 class="titulo" id="capa-t">${esc(m.nombre)}</h2></div>` +
      `<p>${esc(tipo.resumen)}</p>${m.doble ? `<p class="doble">¡Vale doble!</p>` : ""}` +
      `<button class="boton rojo grande bloque" data-accion="alerta-entrar" data-foco>¡Vamos!</button>` +
      `<button class="enlace centro" data-accion="alerta-cerrar">Ahora no</button></div></div>`;
  }
  function efectosCapa(c) {
    if (c.tipo === "bienvenida") { Sonido.tocar("fanfarria"); vibrar([40, 60, 40]); setTimeout(() => confeti(raiz), 250); }
    if (c.tipo === "sirena") { Sonido.tocar("sirena"); vibrar([400, 150, 400, 150, 400, 150, 800]); }
    if (c.tipo === "reto") { Sonido.tocar("alerta"); vibrar([200, 100, 200, 100, 200]); }
    if (c.tipo === "agente") { Sonido.tocar("toque"); vibrar([80, 60, 80]); }
    if (c.tipo === "mision" && L.sonoAlerta !== c.id) { L.sonoAlerta = c.id; Sonido.tocar("alerta"); vibrar([300, 150, 300, 150, 600]); }
  }

  /* ---------- revisiones periódicas ---------- */
  function revisarTodo() {
    if (S.agentes === undefined) return;
    const a = miAgente();
    if (L.yo && !a && !L.registrando) {
      // El anfitrión quitó esta tarjeta (o se borró todo).
      L.yo = null;
      L.perdido = true;
      L.presencia = false;
      guardado.del(CLAVE_ID);
    }
    if (!miAgente()) return;
    if (S.conectado && !L.conectadoAntes) L.presencia = false;
    L.conectadoAntes = S.conectado;
    asegurarPresencia();
    revisarMision();
    revisarOcupado();
    revisarDuelos();
    revisarFinal();
  }
  function asegurarPresencia() {
    const a = miAgente();
    if (!a || !S.conectado) return;
    if (!L.presencia) {
      L.presencia = true;
      T.alDesconectar(`agentes/${L.yo}/conectado`, false);
      T.alDesconectar(`agentes/${L.yo}/ocupado`, null);
      T.actualizar(`agentes/${L.yo}`, { conectado: true, visto: T.ahora() });
    } else if (a.conectado === false && document.visibilityState === "visible" && !L.reconectando) {
      L.reconectando = true;
      T.actualizar(`agentes/${L.yo}`, { conectado: true, visto: T.ahora() }).finally(() => { L.reconectando = false; });
    }
  }
  function revisarMision() {
    const m = S.mision;
    if (m === undefined) return;
    const id = m ? m.id : null;
    if (L.misionAntes !== undefined && L.misionAntes && L.misionAntes !== id && L.dentro === L.misionAntes) {
      L.dentro = null;
      if (!id) aviso("La misión terminó.");
    }
    if (m && L.dentro === m.id && m.fase === "resultados" && L.faseAntes !== "resultados") { /* los resultados se muestran solos */ }
    // La pregunta relámpago salta sola en la pantalla: no espera a que toquen «¡Vamos!».
    const tm = m && TIPOS[m.tipo];
    if (m && tm && tm.entraSolo && m.fase === "juego" && !L.vistas.has(m.id) && L.dentro !== m.id) { marcarVista(m.id); L.dentro = m.id; L.sub = null; }
    if (m && m.fase === "resultados" && L.faseAntes && L.faseAntes !== "resultados" && L.dentro !== m.id && L.misionAntes === id) {
      const mia = (m.resultados || []).find((f) => f.id === L.yo);
      if (mia && mia.pts) { aviso(`«${m.nombre}» terminó: ${ptsTexto(mia.pts)} puntos`); vibrar(60); }
    }
    if (m && m.fase === "resultados" && !L.vistas.has(m.id) && L.dentro !== m.id && L.faseAntes === null) marcarVista(m.id);
    L.misionAntes = id;
    L.faseAntes = m ? m.fase : null;
  }
  function revisarOcupado() {
    const a = miAgente();
    if (!a) return;
    let ocupado = L.soloJugando;
    const m = S.mision, tipo = tipoDe(m);
    if (!ocupado && m && tipo && tipo.usaSala && m.fase !== "resultados" && S.mjListo === m.id && (S.mj.listos || {})[L.yo]) ocupado = true;
    const actual = !!a.ocupado;
    if (ocupado !== actual && L.ocupadoEscrito !== ocupado) {
      L.ocupadoEscrito = ocupado;
      T.escribir(`agentes/${L.yo}/ocupado`, ocupado ? true : null).then(() => { L.ocupadoEscrito = null; });
    }
  }
  function revisarDuelos() {
    const ahora = T.ahora();
    for (const [did, d] of Object.entries(S.duelos || {})) {
      if (!d || (d.de !== L.yo && d.a !== L.yo)) continue;
      const antes = L.estadosDuelo[did];
      if (antes && antes !== d.estado && d.de === L.yo) {
        if (d.estado === "rechazado") aviso(`${nombreDe(S, d.a)} rechazó tu reto.`);
        if (d.estado === "expirado") aviso(`${nombreDe(S, d.a)} no respondió a tu reto.`);
      }
      if (antes && antes !== d.estado && d.estado === "aceptado") { Sonido.tocar("inicio"); vibrar([60, 40, 60]); }
      if (antes && antes !== d.estado && d.estado === "resuelto") {
        if (d.ganador === L.yo) { Sonido.tocar("fanfarria"); vibrar([40, 50, 40]); } else if (d.ganador) { Sonido.tocar("error"); vibrar(200); }
      }
      L.estadosDuelo[did] = d.estado;
      if (d.estado === "pendiente" && ahora - d.creado > DUELO_ACEPTAR_MS + (d.de === L.yo ? 1000 : 2500) && !L["exp" + did]) {
        L["exp" + did] = true;
        rechazarDuelo(T, did, "expirado");
      }
      if (d.estado === "aceptado" && !d.go && ahora > (Number(d.aceptadoT) || 0) + DUELO_PREPARAR_MS + (d.de === L.yo ? 0 : 1500) && !L["go" + did]) {
        L["go" + did] = true;
        largarDuelo(T, did);
      }
      if (dueloListo(d, ahora) && !L["res" + did]) {
        L["res" + did] = true;
        resolverDuelo(T, S, did, L.yo).finally(() => { setTimeout(() => { L["res" + did] = false; }, 1500); });
      }
    }
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", (e) => {
    const b = e.target.closest("[data-accion]");
    if (!b || !raiz.contains(b) || b.disabled) return;
    accion(b.dataset.accion, b);
  });
  raiz.addEventListener("submit", (e) => {
    const f = e.target.closest("form[data-form]");
    if (!f) return;
    e.preventDefault();
    if (f.dataset.form === "registro") { registrar(f); return; }
    const m = S.mision, tipo = tipoDe(m);
    if (m && m.fase === "juego" && L.dentro === m.id && tipo && tipo.jugador.enviar) tipo.jugador.enviar(f, ctxMision());
  });
  // Los campos de código se envían solos al escribir el tercer número.
  raiz.addEventListener("input", (e) => {
    const i = e.target;
    if (!i.matches || !i.matches("[data-auto]") || !i.form) return;
    if (i.value.replace(/\D/g, "").length >= (Number(i.maxLength) || 3)) {
      if (i.form.requestSubmit) i.form.requestSubmit(); else i.form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
    }
  });
  raiz.addEventListener("change", (e) => {
    if (e.target.name === "poder") $$(".opcion-poder", raiz).forEach((o) => o.classList.toggle("activa", !!$("input", o).checked));
  });
  raiz.addEventListener("pointerdown", (e) => {
    const s = e.target.closest("[data-secreto]");
    if (s) { s.classList.add("visible"); vibrar(15); }
  });
  const tapar = () => $$("[data-secreto].visible", raiz).forEach((s) => s.classList.remove("visible"));
  document.addEventListener("pointerup", tapar);
  document.addEventListener("pointercancel", tapar);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { L.presencia = false; refrescar(); } });

  function accion(a, el) {
    const m = S.mision;
    switch (a) {
      case "entrar": entrarMision(); return;
      case "cuartel": irCuartel(); return;
      case "listo":
        if (m) { T.escribir(`mj/${m.id}/listos/${L.yo}`, T.ahora()); vibrar(30); Sonido.tocar("toque"); }
        return;
      case "no-listo":
        if (m) T.borrar(`mj/${m.id}/listos/${L.yo}`);
        irCuartel();
        return;
      case "retar": L.sub = "retar"; refrescar(); desplazarArriba(); return;
      case "retar-a": retarA(el.dataset.id); return;
      case "cancelar-duelo": cancelarDuelo(T, el.dataset.id); return;
      case "listo-duelo": marcarListoDuelo(T, el.dataset.id, L.yo); Sonido.tocar("toque"); vibrar(30); return;
      case "aceptar-duelo": {
        const did = el.dataset.id;
        aceptarDuelo(T, did).then((r) => {
          if (!r.hecho || !r.valor || r.valor.estado !== "aceptado") { aviso("Ese reto ya no está disponible."); return; }
          for (const [otro, d] of Object.entries(S.duelos || {})) {
            if (otro !== did && d && d.estado === "pendiente" && (d.a === L.yo || d.de === L.yo)) cancelarDuelo(T, otro);
          }
        });
        return;
      }
      case "rechazar-duelo": rechazarDuelo(T, el.dataset.id, "rechazado"); refrescar(); return;
      case "cerrar-duelo": L.duelosVistos.add(el.dataset.id); L.sub = null; refrescar(); return;
      case "alerta-entrar": if (m) { marcarVista(m.id); entrarMision(); } return;
      case "alerta-cerrar": if (m) marcarVista(m.id); refrescar(); return;
      case "sirena-ok": {
        if (S.alerta) L.alertasVistas.add(S.alerta.id);
        if (m && m.fase !== "resultados" && L.dentro !== m.id) entrarMision(); else refrescar();
        return;
      }
      case "agente-si":
      case "agente-no": {
        if (!m) return;
        const id = el.dataset.id;
        const c = (S.mj.cumple || {})[id] || {};
        L.confirmadas.add(id + ":" + c.t);
        T.actualizar(`mj/${m.id}/cumple/${id}`, { estado: a === "agente-si" ? "si" : "no" });
        vibrar(30);
        refrescar();
        return;
      }
      case "sonido":
        Sonido.activo = !Sonido.activo;
        if (!opc.demo) almacen.set("liga2:sonido", Sonido.activo ? "si" : "no");
        if (Sonido.activo) { Sonido.despertar(); Sonido.tocar("exito"); }
        refrescar();
        return;
      case "como": ventanaInfo(reglasHTML(), raiz); return;
      case "bienvenida-ok": L.bienvenida = false; Sonido.tocar("toque"); refrescar(); desplazarArriba(); return;
      default: {
        const tipo = tipoDe(m);
        if (m && m.fase === "juego" && L.dentro === m.id && tipo && tipo.jugador.click) {
          try { tipo.jugador.click(a, el, ctxMision()); } catch (e) { console.error(e); }
          programar();
        }
      }
    }
  }

  refrescar();
  return {
    S, T,
    get yo() { return L.yo; },
    destruir() { clearInterval(intervalo); salirMision(); },
  };
}

/* =====================================================================
   CENTRO DE MANDO: el anfitrión lanza misiones, da la largada, reparte
   puntos, maneja a los agentes y revela el podio. Pensado para el celular.
   ===================================================================== */
const PESTANAS = [["mision", "Misión", "mision"], ["lanzar", "Lanzar", "lanzar"], ["agentes", "Agentes", "agentes"], ["marcador", "Marcador", "trofeo"]];

function crearComando(raiz, T, opc) {
  opc = opc || {};
  const CLAVE_PIN = `liga2:pin:${SALA}`;
  let dispositivo = almacen.get("liga2:dispositivo");
  if (!dispositivo) { dispositivo = nuevoId("d"); almacen.set("liga2:dispositivo", dispositivo); }
  if (opc.demo) dispositivo = "demo";
  const huella = (pin) => String(hash("liga-salvador:" + String(pin).trim()));

  const L = {
    autorizado: !!opc.demo || almacen.get(CLAVE_PIN) === huella(CONFIG.pinComando),
    pestana: "mision",
    elegido: null,
    cfg: {},
    doble: false,
    clave: "",
    forzar: false,
    pintando: false,
    pendiente: false,
    locales: {},
    fotosMini: {},
    idFotos: null,
    desFotos: null,
    cerrando: null,
    premiada: null,
    empezando: null,
    revelando: false,
    album: null,
    cargandoAlbum: false,
    trabajando: false,
    duelosHechos: {},
  };
  if (!opc.demo) Sonido.activo = almacen.get("liga2:sonido-comando") !== "no";

  // Firebase puede avisar de cambios en el mismo instante en que nos suscribimos.
  let zControl, zBarra, zContenido, zNav;
  let programado = false;
  function programar() {
    if (programado) return;
    programado = true;
    requestAnimationFrame(() => { programado = false; refrescar(); });
  }
  const S = crearEstado(T, () => programar());
  S.comando = undefined;
  S.triviaUsadas = {};
  T.escuchar("comando", (v) => { S.comando = v || null; programar(); });
  T.escuchar("trivia/usadas", (v) => { S.triviaUsadas = v || {}; });
  const bots = crearBots(T, S, { retarA: opc.retarA });


  /* ---------- montaje y clave ---------- */
  function montar() {
    if (!L.autorizado) {
      raiz.innerHTML = `<div class="comando">${logoHTML()}<section class="pagina"><span class="cap">Centro de mando</span><h1 class="titulo chico">Solo para el anfitrión</h1>` +
        `<p>Escribe la clave para controlar los juegos de la fiesta.</p><form data-form="pin" class="columna"><div class="campo-grupo"><label class="etiqueta" for="pin">Clave</label>` +
        `<input class="campo" id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12"></div><p class="error" data-vivo="error" role="alert"></p>` +
        `<button class="boton rojo grande bloque" type="submit">Entrar</button></form></section>` +
        `<a class="enlace centro" href="${esc(enlaceJuego())}">Ir a la página de los jugadores</a></div>`;
      zControl = zBarra = zContenido = zNav = null;
      return;
    }
    raiz.innerHTML = `<div class="comando"><header class="c-cabecera">${logoHTML()}<div class="c-estado"><span class="cap">Centro de mando</span>` +
      `<span class="punto-conexion" data-vivo="conexion"></span><button class="boton chico blanco" data-accion="sonido" data-vivo="sonido"></button></div></header>` +
      `<div class="zona" data-zona="control"></div><div class="zona" data-zona="barra"></div><div class="zona" data-zona="contenido"></div></div>` +
      `<nav class="pestanas" role="tablist" aria-label="Secciones del centro de mando" data-zona="nav"></nav>`;
    zControl = $('[data-zona="control"]', raiz);
    zBarra = $('[data-zona="barra"]', raiz);
    zContenido = $('[data-zona="contenido"]', raiz);
    zNav = $('[data-zona="nav"]', raiz);
    L.clave = "";
    tomarControl();
    pantallaEncendida();
  }
  function entrarPin(form) {
    const pin = $("#pin", form).value;
    if (huella(pin) !== huella(CONFIG.pinComando)) {
      $('[data-vivo="error"]', form).textContent = "Clave incorrecta.";
      vibrar(120);
      $("#pin", form).select();
      return;
    }
    almacen.set(CLAVE_PIN, huella(pin));
    L.autorizado = true;
    montar();
    refrescar();
  }

  /* ---------- quién tiene el control ---------- */
  function activo() { return !!opc.demo || (S.comando !== undefined && (!S.comando || S.comando.dispositivo === dispositivo)); }
  function tomarControl() { if (!opc.demo) T.escribir("comando", { dispositivo, t: T.ahora() }); }

  /* ---------- contexto para las misiones ---------- */
  function localDe(id) { return L.locales[id] || (L.locales[id] = {}); }
  function ctxHost() {
    const m = S.mision;
    return {
      T, S, m, mj: S.mj || {}, yo: null, ahora: () => T.ahora(),
      local: localDe(m ? m.id : "-"), raiz: zContenido,
      pintar: () => { L.forzar = true; if (L.pintando) L.pendiente = true; else refrescar(); },
      fresco: ctxHost, premiar, cerrarMision, verFoto,
      fotosMini: (m && L.fotosMini[m.id]) || {},
      capaAvisos: () => raiz,
    };
  }
  function desplazarArriba() { if (opc.desplazar) opc.desplazar(); else window.scrollTo(0, 0); }
  function aviso(t) { avisar(t, raiz); }

  /* ---------- puntos: cerrar una misión ---------- */
  function premiar(filas, directo) {
    const m = S.mision;
    if (!m || L.premiada === m.id) return;
    L.premiada = m.id;
    const mult = m.doble ? 2 : 1;
    const lista = (filas || []).filter((f) => f && S.agentes && S.agentes[f.id]).map((f) => ({ id: f.id, pos: Number(f.pos) || 0, pts: Math.round((Number(f.pts) || 0) * mult), txt: f.txt || "" }));
    if (directo) {
      lista.sort((a, b) => b.pts - a.pts);
      let pos = 0;
      lista.forEach((f, i) => { if (i === 0 || lista[i - 1].pts !== f.pts) pos = i + 1; f.pos = pos; });
    } else lista.sort((a, b) => a.pos - b.pos || b.pts - a.pts);
    const t = T.ahora();
    const cambios = {};
    lista.forEach((f) => { if (f.pts) cambios[`${f.id}/m_${m.id}`] = { p: f.pts, m: m.nombre, t }; });
    if (Object.keys(cambios).length) T.actualizar("puntos", cambios);
    const tipo = TIPOS[m.tipo];
    let detalle = m.sub && (m.sub.reto || m.sub.pregunta) ? String(m.sub.reto || m.sub.pregunta) : "";
    try { if (tipo && tipo.detalleHistorial) detalle = tipo.detalleHistorial(ctxHost()) || detalle; } catch (e) { /* sin detalle */ }
    T.escribir(`historial/${m.id}`, { tipo: m.tipo, nombre: m.nombre, t, doble: !!m.doble, n: lista.length, detalle, top: lista.slice(0, 3).map((f) => ({ id: f.id, pts: f.pts })) });
    T.actualizar("mision", { fase: "resultados", resultados: lista, cerrada: t });
    Sonido.tocar("fanfarria");
  }
  function cerrarMision() {
    const m = S.mision;
    if (!m || m.fase === "resultados" || L.cerrando === m.id) return;
    L.cerrando = m.id;
    const tipo = TIPOS[m.tipo];
    try { if (tipo) tipo.cerrar(ctxHost()); } catch (e) { console.error(e); }
    if (L.premiada !== m.id) premiar([]);
  }

  /* ---------- lanzar, empezar, cancelar ---------- */
  function cfgDe(id) {
    if (!L.cfg[id]) {
      const c = {};
      for (const campo of TIPOS[id].campos || []) c[campo.id] = campo.defecto !== undefined ? campo.defecto : "";
      L.cfg[id] = c;
    }
    return L.cfg[id];
  }
  async function lanzar() {
    const tipo = TIPOS[L.elegido];
    if (!tipo || L.trabajando) return;
    const cfg = Object.assign({}, cfgDe(tipo.id));
    const err = $('[data-vivo="error"]', zContenido);
    for (const c of tipo.campos || []) {
      if (c.tipo === "texto") { const i = $(`#campo-${c.id}`, zContenido); cfg[c.id] = i ? i.value.trim() : String(cfg[c.id] || "").trim(); }
      if (c.requerido && !String(cfg[c.id] || "").trim()) { if (err) err.textContent = `Falta: ${c.etiqueta.toLowerCase()}.`; return; }
    }
    const actual = S.mision;
    if (actual && actual.fase !== "resultados") {
      const ok = await confirmar({ titulo: "Hay una misión en curso", texto: `«${actual.nombre}» todavía no termina. Si lanzas otra, se cancela sin dar puntos.`, si: "Cancelar y lanzar" }, raiz);
      if (!ok) return;
    }
    L.trabajando = true;
    try {
      const id = nuevoId("m");
      const base = { id, tipo: tipo.id, nombre: tipo.nombre, cat: tipo.cat, abierta: T.ahora(), cfg, doble: !!L.doble, fase: tipo.usaSala ? "sala" : "juego" };
      const ctx = ctxHost();
      ctx.m = base;
      const r = (tipo.lanzar && tipo.lanzar(cfg, ctx)) || {};
      await T.escribir("mision", Object.assign(base, r.mision || {}));
      L.doble = false;
      L.elegido = null;
      L.pestana = "mision";
      Sonido.tocar("alerta");
      desplazarArriba();
      if (opc.alLanzar) opc.alLanzar();
    } finally { L.trabajando = false; refrescar(); }
  }
  function empezar() {
    const m = S.mision;
    if (!m || m.fase !== "sala" || L.empezando === m.id) return;
    const tipo = TIPOS[m.tipo];
    let r;
    try { r = tipo.empezar ? tipo.empezar(ctxHost()) : (T.actualizar("mision", { fase: "juego" }), true); } catch (e) { console.error(e); r = false; }
    if (r === false) return;
    L.empezando = m.id;
    T.actualizar("mision", { abierta: T.ahora() });
    Sonido.tocar("inicio");
  }
  async function cancelarMision() {
    const m = S.mision;
    if (!m) return;
    const ok = await confirmar({ titulo: "¿Cancelar la misión?", texto: `«${m.nombre}» se cierra sin dar puntos.`, si: "Sí, cancelar" }, raiz);
    if (ok && S.mision && S.mision.id === m.id) T.borrar("mision");
  }
  function sirena() {
    const m = S.mision;
    const texto = m && m.fase !== "resultados" ? `¡Misión «${m.nombre}»! Entra ya.` : "¡Atención, Liga! Miren sus celulares.";
    T.escribir("alerta", { id: nuevoId("s"), t: T.ahora(), texto });
    Sonido.tocar("sirena");
    aviso("¡Sirena enviada a todos los celulares!");
  }
  function textoAviso() {
    const m = S.mision;
    return m ? `¡Misión de la Liga! «${m.nombre}» ya empezó. Entra aquí para jugar: ${enlaceJuego()}` : `¡Juegos de La Liga de Salvador! Entra aquí: ${enlaceJuego()}`;
  }

  /* ---------- fotos ---------- */
  function seguirFotos() {
    const m = S.mision;
    const id = m && m.tipo === "foto" ? m.id : null;
    if (id === L.idFotos) return;
    if (L.desFotos) L.desFotos();
    L.desFotos = null;
    L.idFotos = id;
    if (id) L.desFotos = T.escuchar(`fotosMini/${id}`, (v) => { L.fotosMini[id] = v || {}; programar(); });
  }
  function verFoto(mid, aid) {
    const capa = document.createElement("div");
    capa.className = "capa-modal";
    capa.innerHTML = `<div class="pagina" role="dialog" aria-modal="true"><span class="cap">Foto</span><h2 class="titulo chico">${esc(nombreDe(S, aid))}</h2>` +
      `<div class="foto-grande"><p class="latido">Cargando…</p></div><button class="boton bloque" data-cerrar>Cerrar</button></div>`;
    raiz.appendChild(capa);
    capa.addEventListener("click", (e) => { if (e.target === capa || e.target.closest("[data-cerrar]")) capa.remove(); });
    T.leer(`fotos/${mid}/${aid}`).then((src) => {
      const c = $(".foto-grande", capa);
      if (c) c.innerHTML = src ? `<img class="foto-propia" src="${esc(src)}" alt="Foto de ${esc(nombreDe(S, aid))}">` : `<p>No se encontró la foto.</p>`;
    });
  }
  async function cargarAlbum() {
    if (L.cargandoAlbum) return;
    L.cargandoAlbum = true;
    refrescar();
    const misiones = Object.entries(S.historial || {}).filter(([, h]) => h && h.tipo === "foto").sort((a, b) => a[1].t - b[1].t).map(([id, h]) => ({ id, reto: h.detalle || h.nombre }));
    if (S.mision && S.mision.tipo === "foto" && !misiones.find((x) => x.id === S.mision.id)) misiones.push({ id: S.mision.id, reto: (S.mision.sub || {}).reto || S.mision.nombre });
    const grupos = [];
    for (const x of misiones) {
      const v = await T.leer(`fotosMini/${x.id}`);
      if (v && Object.keys(v).length) grupos.push(Object.assign({ fotos: v }, x));
    }
    L.album = grupos;
    L.cargandoAlbum = false;
    refrescar();
  }

  /* ---------- gran final ---------- */
  async function empezarFinal() {
    const m = S.mision;
    const lista = clasificacion(S);
    if (!lista.length) { aviso("Todavía no hay agentes."); return; }
    const texto = (m && m.fase !== "resultados" ? `La misión «${m.nombre}» se cancelará sin dar puntos. ` : "") + "Todos los celulares pasan a la gran final y se cierran los duelos.";
    const ok = await confirmar({ titulo: "¿Revelar el podio?", texto, si: "¡A la gran final!" }, raiz);
    if (!ok) return;
    const fresca = clasificacion(S);
    const podio = fresca.slice(0, 3).map((a) => ({ id: a.id, nombre: a.nombre, poder: a.poder, total: a.total, pos: a.pos }));
    const tabla = fresca.map((a) => ({ id: a.id, total: a.total, pos: a.pos }));
    if (S.mision) await T.borrar("mision");
    await T.escribir("final", { paso: 0, t: T.ahora(), podio, tabla });
    L.pestana = "mision";
    desplazarArriba();
    refrescar();
  }
  function revelarPaso() {
    const f = S.final;
    if (!f || L.revelando) return;
    const n = (f.podio || []).length, paso = Number(f.paso) || 0;
    if (paso >= n) return;
    L.revelando = true;
    T.actualizar("final", { redoble: T.ahora() });
    Sonido.tocar("redoble");
    refrescar();
    setTimeout(() => {
      T.actualizar("final", { paso: paso + 1 }).finally(() => { L.revelando = false; refrescar(); });
      if (paso + 1 >= n) { Sonido.tocar("fanfarria"); setTimeout(() => confeti(), 150); } else Sonido.tocar("revelar");
    }, 2400);
  }
  async function cancelarFinal() {
    const ok = await confirmar({ titulo: "¿Quitar el podio?", texto: "Los celulares vuelven al cuartel y puedes seguir lanzando misiones.", si: "Volver a la fiesta" }, raiz);
    if (ok) T.borrar("final");
  }

  /* ---------- agentes ---------- */
  function abrirAgente(id) {
    const a = S.agentes && S.agentes[id];
    if (!a) return;
    const capa = document.createElement("div");
    capa.className = "capa-modal";
    const pintar = () => {
      const ag = S.agentes[id];
      if (!ag) { capa.remove(); return; }
      capa.innerHTML = `<div class="pagina" role="dialog" aria-modal="true"><span class="cap">Agente ${esc(ag.codigo || "")}</span>` +
        `<div class="mision-cabeza">${poderHTML(ag.poder)}<h2 class="titulo chico">${esc(ag.nombre)}</h2></div>` +
        `<p><b>${fmt(totalDe(S, id))}</b> puntos · ${ag.conectado === false ? "sin conexión" : "conectado"}${ag.bot ? " · de prueba" : ""}</p>` +
        `<div class="campo-grupo"><span class="etiqueta">Ajustar puntos</span><div class="segmentado">${[-50, -10, 10, 50].map((v) => `<button data-ajuste="${v}">${v > 0 ? "+" : "−"}${Math.abs(v)}</button>`).join("")}</div></div>` +
        `<button class="boton blanco" data-m="enlace">Copiar su enlace de recuperación</button>` +
        `<p class="suave">Si se le apaga el celular, que abra ese enlace en otro y sigue con su tarjeta y sus puntos.</p>` +
        `<div class="fila"><button class="boton blanco" data-m="quitar">Quitar de la partida</button><button class="boton" data-m="cerrar">Listo</button></div></div>`;
    };
    pintar();
    raiz.appendChild(capa);
    capa.addEventListener("click", async (e) => {
      if (e.target === capa) { capa.remove(); return; }
      const aj = e.target.closest("[data-ajuste]");
      if (aj) {
        const v = Number(aj.dataset.ajuste);
        await T.escribir(`puntos/${id}/a_${nuevoId("")}`, { p: v, m: "Ajuste del anfitrión", t: T.ahora() });
        vibrar(20);
        setTimeout(pintar, 50);
        return;
      }
      const b = e.target.closest("[data-m]");
      if (!b) return;
      if (b.dataset.m === "cerrar") capa.remove();
      if (b.dataset.m === "enlace") {
        const base = enlaceJuego();
        const ok = await copiar(`${base}${base.includes("?") ? "&" : "?"}yo=${encodeURIComponent(id)}`);
        aviso(ok ? "Enlace copiado: envíaselo por WhatsApp." : "No se pudo copiar.");
      }
      if (b.dataset.m === "quitar") {
        capa.remove();
        const ag = S.agentes[id];
        const ok = await confirmar({ titulo: `¿Quitar a ${ag ? ag.nombre : "este agente"}?`, texto: "Se borran su tarjeta y sus puntos.", si: "Sí, quitar" }, raiz);
        if (!ok) return;
        await T.borrar(`agentes/${id}`);
        await T.borrar(`puntos/${id}`);
        if (ag && ag.codigo) await T.borrar(`codigos/${ag.codigo}`);
      }
    });
  }
  async function reiniciarTodo() {
    const ok = await confirmar({ titulo: "¿Borrar todo?", texto: "Se borran agentes, puntos, misiones, fotos y duelos, y las preguntas de la trivia vuelven a estar todas sin usar. Los invitados tendrán que registrarse de nuevo.", si: "Sí, borrar todo" }, raiz);
    if (!ok) return;
    for (const p of ["final", "mision", "mj", "puntos", "historial", "duelos", "enfriamiento", "fotos", "fotosMini", "trivia", "alerta", "ajustes", "codigos", "agentes"]) await T.borrar(p);
    L.album = null;
    aviso("Listo: la Liga quedó vacía.");
  }

  /* ---------- pintar ---------- */
  function refrescar() {
    if (L.pintando) { L.pendiente = true; return; }
    L.pintando = true;
    try {
      seguirFotos();
      if (!zContenido) return;
      pintarCabecera();
      pintarZona(zControl, activo() || S.comando === undefined ? "" : `<div class="globo pausa"><strong>En pausa.</strong> El centro de mando se abrió en otro dispositivo, así que aquí no corre el tiempo de las misiones. <button class="boton chico" data-accion="tomar-control">Usar este</button></div>`);
      pintarZona(zBarra, htmlBarra());
      pintarNav();
      pintarContenido();
    } catch (e) { console.error(e); }
    finally { L.pintando = false; }
    if (L.pendiente) { L.pendiente = false; setTimeout(refrescar, 0); }
  }
  function pintarZona(z, html) { if (z && z.dataset.h !== html) { z.dataset.h = html; z.innerHTML = html; } }
  function pintarVivo(nombre, html) {
    const el = $(`[data-vivo="${nombre}"]`, zContenido);
    if (el && el.dataset.h !== html) { el.dataset.h = html; el.innerHTML = html; }
  }
  function conectados() { return agentesValidos(S.agentes).filter((a) => a.conectado !== false).length; }
  function pintarCabecera() {
    const c = $('[data-vivo="conexion"]', raiz);
    if (c) {
      const t = S.conectado ? `${plural(conectados(), "agente", "agentes")}` : "Sin conexión";
      if (c.textContent !== t) c.textContent = t;
      c.classList.toggle("caida", !S.conectado);
    }
    const s = $('[data-vivo="sonido"]', raiz);

  }
  function htmlBarra() {
    const m = S.mision;
    if (S.final || !m) return "";
    return `<div class="barra-mision"><button class="que" data-accion="pestana" data-p="mision">${esc(m.nombre)}<small data-vivo="barra-fase"></small></button>` +
      `<a class="boton chico blanco" href="${esc(enlaceWhatsApp(textoAviso()))}" target="_blank" rel="noopener" aria-label="Avisar por WhatsApp">${icono("whatsapp")}<span class="txt">Avisar</span></a>` +
      `<button class="boton chico blanco" data-accion="sirena" aria-label="Sonar la sirena en los celulares">${icono("sirena")}<span class="txt">Sirena</span></button></div>`;
  }

    if (m.fase === "juego" && m.cierra) t += ` · se cierra en ${reloj(m.cierra - T.ahora())}`;

  function pintarNav() {

  function claveContenido(ctx) {

        `<button class="boton rojo grande" data-accion="ir-lanzar">${icono("lanzar")} Lanzar una misión</button>` +
        `<button class="boton azul grande" data-accion="relampago-ya">${icono("rayo")} Pregunta relámpago</button><p class="suave" data-vivo="quedan-preguntas"></p></section>` +
        `<section class="pagina"><span class="cap">La Liga</span><p data-vivo="resumen"></p><button class="boton blanco" data-accion="pestana" data-p="agentes">Ver agentes e invitar</button></section>` +
        `<p class="nota centro">Mantén esta pantalla encendida mientras haya una misión: desde aquí corre el tiempo de cada juego.</p>`;
    }

    if (m.fase === "sala") {
      return `<section class="pagina"><span class="cap">Sala de espera</span><div class="mision-cabeza"><span class="icono-mision">${icono(tipo.icono)}</span><h2 class="titulo chico">${esc(m.nombre)}</h2></div>` +
        `${tipo.pasos ? `<p class="subtitulo">Explícalo así</p>${pasosHTML(tipo.pasos)}` : `<p>${esc(tipo.ayuda)}</p>`}<p class="suave">En la sala, cada uno tiene una práctica que no cuenta.</p>` +
        `<p><b data-vivo="n-listos">0</b> listos de <b data-vivo="n-conectados">0</b> conectados.</p><ul class="chips" data-vivo="listos"></ul>` +

        `<div class="fila"><a class="boton blanco" href="${esc(enlaceWhatsApp(textoAviso()))}" target="_blank" rel="noopener">${icono("whatsapp")} WhatsApp</a><button class="boton blanco" data-accion="sirena">${icono("sirena")} Sirena</button></div></section>` +

        (filas.length ? `<ol class="tabla">${filas.map((r, i) => filaResultado(S, r, i, null)).join("")}</ol>` : `<p>Nadie sumó puntos.</p>`) + `</section>` +
        (tipo.resultadoExtra ? tipo.resultadoExtra(m) : "") +
        `<div class="fila"><button class="boton rojo grande" data-accion="ir-lanzar">${icono("lanzar")} Lanzar otra</button><button class="boton azul" data-accion="relampago-ya">${icono("rayo")} Relámpago</button></div>` +
        `<button class="enlace centro" data-accion="archivar">Cerrar resultados</button>`;
    }
    if (S.mjListo !== m.id) return `<p class="centro latido">Cargando la misión…</p>`;
    return tipo.host.html(ctx) + `<button class="enlace centro" data-accion="cancelar-mision">Cancelar la misión sin dar puntos</button>`;
  }
  function actualizarContenido(ctx) {
    const bf = $('[data-vivo="barra-fase"]', zBarra || raiz);
    if (bf) { const t = textoFase(); if (bf.textContent !== t) bf.textContent = t; }
    if (L.pestana === "agentes") return actualizarAgentes();
    if (L.pestana === "marcador") return actualizarMarcador();
    if (L.pestana === "lanzar") {

      pintarVivo("resumen", `${plural(lista.length, "agente registrado", "agentes registrados")}, ${plural(conectados(), "conectado", "conectados")} ahora. ${plural(jugadas, "misión jugada", "misiones jugadas")}.`);
